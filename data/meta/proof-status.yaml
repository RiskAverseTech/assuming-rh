# Verification status of the proof every "unlocked" label depends on.
# The site banner and the method page read this file. Update last_updated
# whenever anything here changes.
status: Claimed. Machine checks reported. Not yet accepted by the mathematical community.
headline: A proof of the Riemann Hypothesis has been claimed but is not yet accepted.
summary: >
  On 20 November 2026 Levent Alpöge released a proof, written in a form that
  computers can check, of the Riemann Hypothesis and of its extension to
  Dirichlet L-functions. Independent computer checks have been reported and
  at least one more was still running when this was written. No account of
  the proof has been reviewed and published by mathematicians.
last_updated: 2026-11-21
claims:
  - The Riemann Hypothesis, stated with Mathlib's own definition.
  - GRH for every Dirichlet L-function, for all characters and separately for primitive characters.
  - Nothing is claimed for Dedekind zeta functions, Hecke, Artin or automorphic L-functions.
caveats:
  - >
    A formal proof checked by the Lean kernel shows that the formal statement
    follows from the axioms. Whether the formal statement says what
    mathematicians mean by the hypothesis is a separate, human question.
    The headline statements are short and use Mathlib definitions.
  - >
    One public third-party check had passed its source scan but had not
    finished building the proof on 21 November 2026. Press reports say other
    independent kernel checks have passed. This project has not run a check
    of its own.
  - >
    The released archive carries no licence file, so it is not reused or
    redistributed here.
  - >
    The entries in this file were gathered by an AI research pass on
    21 November 2026 and have not yet been re-read by a human. Sources
    marked "reported" were seen only as search summaries.
