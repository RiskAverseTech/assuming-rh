# Verification status of the proof every "unlocked" label depends on.
# The site banner and the method page read this file. Update last_updated
# whenever anything here changes.
status: Claimed. Checked by several independent proof checkers. Not yet accepted by the mathematical community.
headline: A proof of the Riemann Hypothesis has been claimed but is not yet accepted.
summary: >
  On 20 November 2026 Levent Alpöge released a proof, written in a form that
  computers can check, of the Riemann Hypothesis and of its extension to
  Dirichlet L-functions. Several independent proof checkers have since
  accepted it. No account of the argument has been reviewed and published by
  mathematicians.
last_updated: 2026-11-21
claims:
  - The Riemann Hypothesis, stated with Mathlib's own definition.
  - GRH for every Dirichlet L-function, for all characters and separately for primitive characters.
  - Nothing is claimed for Dedekind zeta functions, Hecke, Artin or automorphic L-functions.
caveats:
  - >
    A formal proof accepted by a proof checker shows that the formal
    statement follows from the axioms. Whether the formal statement says
    what mathematicians mean by the hypothesis is a separate, human
    question. The headline statements are short and use Mathlib definitions,
    and participants in the public discussion were still talking through
    that question on 21 November 2026.
  - >
    The checks reported in the public discussion on the Lean community chat
    include the standard Lean build, a statement comparison and axiom check,
    and acceptance by several independently written checkers (among them
    nanoda and con-leche). This project has not run a check of its own.
  - >
    Checked by machine is not the same as understood. No human-readable
    account of the argument has been reviewed.
  - >
    The released archive carries no license file, so it is not reused or
    redistributed here. The same point was raised in the public discussion
    and had not been answered when this was written.
  - >
    This file was compiled by an AI system from the sources below and has
    not yet been re-read by a human. Sources marked "reported" were seen
    only as search summaries.
