# Verification status of the proof every "unlocked" label depends on.
# The site banner and the method page read this file. Update last_updated
# whenever anything here changes.
status: Formal proof verified by the Lean community. The argument has not yet been understood or reviewed by mathematicians.
headline: The Lean community has verified a formal proof of the Riemann Hypothesis. The argument has not yet been understood or reviewed by mathematicians.
summary: >
  On 20 November 2026 Levent Alpöge released a proof, written in a form that
  computers can check, of the Riemann Hypothesis and of its extension to
  Dirichlet L-functions. On 21 November the Lean FRO and the Mathlib
  Initiative announced a joint statement certifying that the formal proof is
  correct and meets their verification criteria. No account of the argument
  that mathematicians can read has been reviewed.
last_updated: 2026-11-21
claims:
  - The Riemann Hypothesis, stated with Mathlib's own definition.
  - GRH for every Dirichlet L-function, for all characters and separately for primitive characters.
  - Nothing is claimed for Dedekind zeta functions, Hecke, Artin or automorphic L-functions.
caveats:
  - >
    A formal proof accepted by a proof checker shows that the formal
    statement follows from the axioms. The headline statements are short and
    use Mathlib definitions, and the community compared them with an
    independent statement in two ways. Whether the argument is understood is
    a separate, human question.
  - >
    The checks reported in the public discussion include the standard Lean
    build, a statement comparison and axiom check, and acceptance by many
    independently written checkers, among them the three formally verified
    ones. One long bundled run was still in progress on 21 November 2026.
    This project has not run a check of its own.
  - >
    Checked by machine is not the same as understood. No human-readable
    account of the argument has been reviewed. Participants expect that to
    take a long time.
  - >
    The released archive carried no license file. On 21 November 2026 a
    maintainer reported that the author is preparing one. Until it appears,
    the code is not reused or redistributed here.
  - >
    This file was compiled by an AI system from the sources below and has
    not yet been re-read by a human. Sources marked "not read directly" were
    seen only as search summaries or as links in the discussion.
