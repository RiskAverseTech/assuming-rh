# Verification status of the proof every "unlocked" label depends on.
# The site banner and the method page read this file. Update last_updated
# whenever anything here changes.
status: Formal proof verified by the Lean community. The argument has not yet been understood or reviewed by mathematicians.
headline: The Lean community has verified a formal proof of the Riemann Hypothesis. The argument has not yet been understood or reviewed by mathematicians.
summary: >
  On 20 November 2026 Levent Alpöge released a proof, written in a form that
  computers can check, of the Riemann Hypothesis and of its extension to
  Dirichlet L-functions. On 21 November the Lean and Mathlib communities,
  endorsed by the Lean FRO and the Mathlib Initiative, issued a joint
  statement certifying that both the statement and the proof of the Riemann
  Hypothesis are correct. No account of the argument that mathematicians can
  read has been reviewed.
last_updated: 2026-11-21
claims:
  - The Riemann Hypothesis, stated with Mathlib's own definition.
  - GRH for every Dirichlet L-function, for all characters and separately for primitive characters.
  - Nothing is claimed for Dedekind zeta functions, Hecke, Artin or automorphic L-functions.
caveats:
  - >
    The joint statement certifies the Riemann Hypothesis itself: the
    statement is Mathlib's own, vetted by experts, and the proof was compared
    against it with two independent tools and checked by several proof
    checkers, two of which are formally verified. The statement does not
    mention the extension to Dirichlet L-functions. In the public discussion
    the same tools were reported to accept those theorems as well, but they
    are stated with definitions written by the author and have had less
    scrutiny. Entries that need GRH for Dirichlet L-functions rest on that
    part.
  - >
    Checked by machine is not the same as understood. No human-readable
    account of the argument has been reviewed. The joint statement itself
    looks forward to work by mathematicians to explain the new ideas.
  - >
    The released archive carried no license file. On 21 November 2026 a
    maintainer reported that the author is preparing one. Until it appears,
    the code is not reused or redistributed here.
  - >
    This project has not run a check of its own. This file was compiled by
    an AI system from the sources below. Sources marked "not read directly"
    were seen only as search summaries or as links in the discussion.
