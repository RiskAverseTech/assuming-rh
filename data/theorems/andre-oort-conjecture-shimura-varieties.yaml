  open_questions:
    - >-
      The move to proved-otherwise rests on the abstract of the Pila, Shankar and Tsimerman paper, which says it proves the Andre-Oort conjecture in full generality. Only the abstract was read, and its publication status was not checked.
    - >-
      This entry very likely should have status proved-otherwise: existing
      dataset entries for special cases cite Pila, Shankar and Tsimerman
      (2021, arXiv 2109.08788) as proving the Andre-Oort conjecture in full
      generality. The paper on disk (2013) does not name an unconditional
      source, so under the drafting rules the status was left as
      still-conditional. A maintainer should change the status and add that
      source.
    - >-
      The paper does not define "GRH for CM fields" further. ERH-Dedekind
      for Galois CM fields is inferred from Proposition 10.1.2 (effective
      Chebotarev for split primes in a Galois number field).
