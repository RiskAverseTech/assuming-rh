id: frobenius-fields-abelian-varieties-power-saving
title: Power saving bound for places where the Frobenius field of an abelian variety is a given field
field: arithmetic-geometry
statement_plain: >
  Let A be an absolutely simple abelian variety without complex
  multiplication over a number field K whose monodromy groups are connected.
  Let d and r be the dimension and rank of the semisimple quotient of the
  Mumford-Tate group of A. For every eps > 0 there is a constant c depending
  on A, K and eps such that, for every number field M and every X > 0, the
  number of places v of good reduction with norm at most X whose Frobenius
  field is isomorphic to M is at most c X^(1 - 1/(3d - r + 2) + eps).
statement_formal: |
  \#\{\, v \in S_{A,M} : N_{K/\mathbb{Q}}\, v \le X \,\} \le c\, X^{1 - \frac{1}{3d - r + 2} + \varepsilon}
hypotheses_required: [ERH-Dedekind, GRH-Hecke]
status: still-conditional
waiting_on: [galois-extensions, class-group-characters]
status_note: >
  Remark 1.5 of the paper says the result is conditional on GRH for two
  types of L-functions: the Dedekind zeta function of the number field M,
  and the L-functions of the finite order Hecke characters attached to
  abelian subquotients of the Galois extensions K(A[d])/K, for d a
  squarefree product of primes. The Hecke characters live on intermediate
  fields of the division fields of A, which are not abelian over the
  rationals. For a generic A of dimension g the exponent is
  1 - 1/(6g^2 + 2g + 2) + eps (Corollary 1.4). The same paper proves
  unconditionally that the set of such places has upper density zero
  (Theorem 1.1).
sources:
  - authors: A. A. Burungale, H. Hida, S. Lai
    title: On the Frobenius fields of abelian varieties over number fields
    year: 2025
    venue: Preprint
