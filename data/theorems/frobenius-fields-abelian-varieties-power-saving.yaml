  open_questions:
    - >-
      The waiting_on families are an approximate fit: the Hecke characters are finite order characters of subfields of division fields (ray class characters), filed under class-group-characters, and the zeta function of the arbitrary field M is filed under galois-extensions.
    - >-
      The exponent is stacked in the extracted text of Theorem 1.3; it was reconstructed from the line "cX^(1 - 1/(3d-r+2) + eps)" and is consistent with Corollary 1.4 for d = 2g^2 + g, r = g.
