  open_questions:
    - >-
      The paper names its hypothesis as GRH for Artin L-functions but does not say which L-functions the lower bound argument uses; the code ERH-Dedekind follows the companion paper of Goldfeld, Lubotzky and Pyber (zeta functions of a Galois field K and its cyclotomic extensions). A reviewer may prefer GRH-Artin.
    - >-
      The definition R = |Phi_+| / l was reconstructed from garbled text and checked against the stated values for SL_d and SL_2.
