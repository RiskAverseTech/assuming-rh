  confidence: medium
  open_questions:
    - >-
      The paper writes "GRH" without a formal definition. It was read from the bounds (2.5), stated "under GRH, for any primary n", as GRH for the quadratic L-functions L(s, chi^(c_K m)) over the field K in question. A reviewer should confirm that the K = Q case uses nothing beyond Dirichlet L-functions and the Riemann zeta function.
    - >-
      Only Q(i) and Q(sqrt(-3)) are cyclotomic; power-residue-characters is used as the closest waiting_on family for quadratic residue symbols over the other imaginary quadratic fields.
