id: ratios-conjecture-quadratic-l-functions-prime-moduli
title: Ratios conjecture with one shift for quadratic L-functions of prime-related moduli
field: analytic-number-theory
statement_plain: >
  Let K be Q or an imaginary quadratic field of class number one, of degree
  d_K, let w be a non-negative Schwartz function, and for a primary prime pi
  of O_K let chi^(c_K pi) be the primitive quadratic character attached to
  c_K pi (for K = Q, c_K = 8 and pi runs over odd primes). For
  -1/4 < Re(alpha) < 1/2, Re(beta) > 0 and Re(alpha) + Re(beta) > 0, the sum
  over primary primes pi of log N(pi) L(1/2 + alpha, chi^(c_K pi)) /
  L(1/2 + beta, chi^(c_K pi)) w(N(pi)/X) equals an explicit main term of size
  X plus an explicit term of size X^(1 - alpha), with error
  O(|1 + alpha|^(3 - d_K/2 + eps) |1 + beta|^eps X^(E + eps)), where
  E = max(1/2, 1 - Re(alpha) - Re(beta), 1 - Re(alpha)/2 - Re(beta)/2,
  3/4 - Re(alpha)/2, 1 - Re(beta)) < 1.
statement_formal: |
  \begin{aligned} \sum_{\varpi \text{ primary}} \frac{\Lambda_K(\varpi)\, L(\frac12+\alpha, \chi^{(c_K\varpi)})}{L(\frac12+\beta, \chi^{(c_K\varpi)})}\, w\Bigl(\frac{N(\varpi)}{X}\Bigr) &= X\,\widehat{w}(1)\,\frac{\zeta_K^{(2)}(1+2\alpha)}{\zeta_K^{(2)}(1+\alpha+\beta)} + X^{1-\alpha}\,\widehat{w}(1-\alpha)\,B_K^{-\alpha}\,\Gamma_K\bigl(\tfrac12+\alpha\bigr)\,\frac{\zeta_K^{(2)}(1-2\alpha)}{\zeta_K^{(2)}(1-\alpha+\beta)} \\ &\quad + O\bigl(|1+\alpha|^{3-d_K/2+\varepsilon}\,|1+\beta|^{\varepsilon}\,X^{E(\alpha,\beta)+\varepsilon}\bigr) \end{aligned}
hypotheses_required: [RH, GRH-Dirichlet, GRH-Hecke]
status: partial
waiting_on: [power-residue-characters]
status_note: >
  Covered case: K = Q, which the theorem names explicitly. There the family
  consists of the quadratic Dirichlet L-functions L(s, chi^(8p)) for odd
  primes p, and the proof uses GRH for L(s, chi^(8m)) for positive odd m,
  which are Dirichlet L-functions of real characters (the Riemann zeta
  function up to finitely many Euler factors when the character is
  trivial). For K = Q(sqrt(d)) with d in {-1, -2, -3, -7, -11, -19, -43,
  -67, -163} the characters are quadratic residue symbols over K, which are
  Hecke characters and in general not Dirichlet characters, so those cases
  stay conditional. In the formula zeta_K^(2) is the zeta function of K
  without Euler factors at 2; Gamma_K(s) is Gamma((1-s)/2)/Gamma(s/2) for
  K = Q and Gamma(1-s)/Gamma(s) otherwise; B_K is |D_K| N(c_K)/pi for K = Q
  and |D_K| N(c_K)/(2 pi)^2 otherwise. Consequences proved in the paper
  under the same hypothesis include the first moment of central values over
  prime-related moduli with error O(X^(3/4 + eps)) and a one-level density
  formula. The paper remarks that the first moment result may be provable
  unconditionally.
