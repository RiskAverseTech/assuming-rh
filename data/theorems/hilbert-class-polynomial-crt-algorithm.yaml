id: hilbert-class-polynomial-crt-algorithm
title: Computing Hilbert class polynomials with the Chinese Remainder Theorem
field: computational-number-theory
statement_plain: >
  The Hilbert class polynomial H_D(X) modulo a positive integer P can be
  computed by a Las Vegas algorithm in expected time
  O(|D| (log |D|)^5 (log log |D|)^4) using
  O(|D|^(1/2) (log |D| + log P) log log |D|) space.
statement_formal: |
  O\!\left(|D|\log^5|D|\,(\log\log|D|)^4\right) \text{ time}, \qquad O\!\left(|D|^{1/2}(\log|D|+\log P)\log\log|D|\right) \text{ space}
hypotheses_required: [GRH-Dirichlet, ERH-Dedekind, GRH-Hecke]
status: still-conditional
status_note: >
  The output is always correct; the paper says the hypothesis is used only
  for the complexity bounds, and that its label GRH stands for several
  extended or generalized Riemann hypotheses. Three kinds appear. The bound
  on the class number h(D) concerns a quadratic Dirichlet L-function. The
  supply of suitable primes comes from an effective Chebotarev density
  theorem in the ring class field of the order of discriminant D, which is
  not abelian over the rationals in general. The bound O((log |D|)^2) on the
  prime norms generating the class group is Bach's bound, which uses class
  group characters of the imaginary quadratic field.
