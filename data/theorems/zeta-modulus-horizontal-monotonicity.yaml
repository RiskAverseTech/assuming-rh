id: zeta-modulus-horizontal-monotonicity
title: Horizontal monotonicity of the modulus of zeta left of the critical line
field: analytic-number-theory
statement_plain: >
  For every fixed real t with |t| >= 8, the modulus |zeta(sigma + it)| is
  monotone decreasing as a function of sigma on the half-line sigma <= 1/2.
  The same holds with zeta replaced by Riemann's xi function or by Euler's
  eta function eta(s) = (1 - 2^(1-s)) zeta(s).
statement_formal: |
  |\zeta(\sigma_1 + it)| \ge |\zeta(\sigma_2 + it)| \quad \text{for all } \sigma_1 < \sigma_2 \le \tfrac12 \text{ and all real } t \text{ with } |t| \ge 8
hypotheses_required: [RH]
status: unlocked
status_note: >
  This statement is equivalent to RH, for each of the three functions
  separately. The paper proves unconditionally that the monotonicity holds in
  the smaller region sigma <= 0, |t| >= 8. For the xi function the
  equivalence is credited in the paper to Sondow and Dumitrescu, and that
  monotone decrease of |zeta| implies RH is credited to earlier work of
  Saidak and Zvengrowski.
sources:
  - authors: Y. Matiyasevich, F. Saidak, P. Zvengrowski
    title: Horizontal Monotonicity of the Modulus of the Riemann Zeta Function and Related Functions
    year: 2014
    venue: Acta Arithmetica 166, 189-200
    doi: 10.4064/aa166-2-4
    url: https://arxiv.org/abs/1205.2773
    hypothesis_location: Theorem 3.4 (stated as Theorem 1.4 in the introduction)
    role: conditional-proof
