  open_questions:
    - >-
      The theorem says "monotone decreasing" while the abstract says "strictly decrease"; the formal statement here uses the non-strict form. Both forms are equivalent to RH by the paper's argument, but a reader should confirm the intended one.
    - >-
      The proof of the equivalence for the region sigma <= 1/2 is given in one sentence by reference to the argument of Corollary 2.5.
