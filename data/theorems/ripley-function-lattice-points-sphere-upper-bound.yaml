id: ripley-function-lattice-points-sphere-upper-bound
title: Upper bound of the expected order for Ripley's function of lattice points on the sphere
field: analytic-number-theory
statement_plain: >
  Let n be squarefree and not 7 mod 8, let N be the number of integer
  solutions of x^2 + y^2 + z^2 = n, and project these points to the unit
  sphere. Let K_r be the number of ordered pairs of distinct projected points
  at Euclidean distance less than r. For fixed epsilon > 0 and
  N^(-1 + epsilon) <= r <= 2, K_r is at most a constant (depending only on
  epsilon) times N^2 r^2, which is the order of magnitude for random points.
statement_formal: |
  K_r(\widehat{E}(n)) \ll_{\epsilon} N^2 r^2 \qquad (N^{-1+\epsilon} \le r \le 2,\ n \text{ squarefree},\ n \not\equiv 7 \bmod 8)
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The paper states the theorem under GRH and remarks that the full force is
  not needed, only that there are no Siegel zeros. In the proof the
  hypothesis is applied to sums of the quadratic character chi_{-n} over
  primes, to compare exp(sum of chi_{-n}(p)/p) with L(1, chi_{-n}). A
  consequence (Corollary 1.5) is that any weak limit of the nearest neighbor
  spacing measures is absolutely continuous with bounded density. Other
  results of the paper assume the Lindelof Hypothesis for GL(2) L-functions
  and are not part of this entry; see the existing entry
  linnik-sphere-lattice-points-variance-bound for the variance in caps.
