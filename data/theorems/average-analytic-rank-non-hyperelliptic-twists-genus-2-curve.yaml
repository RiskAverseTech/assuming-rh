  confidence: medium
  open_questions:
    - >-
      The hypothesis is coded GRH-automorphic because it concerns Hasse-Weil L-functions of genus 2 curves. Since the Jacobians have complex multiplication, GRH-Hecke for the corresponding Grossencharacters would be an equally reasonable code; the paper does not identify the Hecke characters explicitly.
    - >-
      The bound 1/2 + 18 is the paper's own summary ("we have an upper bound 18 + 1/2"); it comes from taking sigma close to 1/3 so that the error terms tend to zero.
