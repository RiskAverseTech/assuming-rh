id: mobius-like-multiplicative-function-sum-one-third
title: Partial sums of a Mobius-like multiplicative function are O(x^(1/3 + epsilon))
field: analytic-number-theory
statement_plain: >
  Let chi be a real non-principal Dirichlet character modulo q >= 3, and let
  f be the multiplicative function supported on squarefree integers with
  f(p) = chi(p) for primes p not dividing q and f(p) = 1 for primes p
  dividing q. Then for every epsilon > 0 the sum of f(n) over n <= x is
  O(x^(1/3 + epsilon)).
statement_formal: |
  M_f(x) = \sum_{n \le x} \mu^2(n)\, g_\chi(n) \ll_{\varepsilon} x^{1/3+\varepsilon}
hypotheses_required: [RH]
status: unlocked
status_note: >
  The hypothesis is the Riemann Hypothesis for the zeta function only; no
  hypothesis on L(s, chi) is made. This improves the bound O(x^(2/5 +
  epsilon)) of Aymone under the same hypothesis. In the same paper it is
  proved unconditionally that M_f(x) is O(x^(1/2) exp(-c (log x)^(3/5)
  (log log x)^(-1/5))) and that M_f(x) = Omega(x^(1/4)). So this function,
  which takes values +1 or -1 at every prime like the Mobius function, has
  partial sums smaller than square-root size.
sources:
