  confidence: medium
  open_questions:
    - >-
      The paper never writes out what GRH means; it is read here as the
      Riemann Hypothesis for the Dedekind zeta function of each field in the
      family, because the only place it is used is the prime ideal theorem
      for those fields.
    - >-
      The dependence of the O-constant in Corollary 2 on the family is not
      spelled out in the statement; from Theorem 7 it should depend only on
      the limit of n_i / g_i.
