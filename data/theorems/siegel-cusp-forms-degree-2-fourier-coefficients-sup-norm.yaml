id: siegel-cusp-forms-degree-2-fourier-coefficients-sup-norm
title: Fourier coefficient and sup-norm bounds for Siegel cusp forms of degree 2
field: analytic-number-theory
statement_plain: >
  Let F be a Siegel cusp form of weight k for Sp_4(Z) that is a Hecke
  eigenform, is not a Saito-Kurokawa lift, and has L^2 norm 1. Its Fourier
  coefficients satisfy
  |a(F,S)| << k^(1/4+eps) (4 pi)^k / Gamma(k) c(S)^(-1/2) det(S)^((k-1)/2+eps),
  where c(S) is the gcd of the entries of S, and its sup-norm satisfies
  sup |(det Y)^(k/2) F(Z)| << k^(5/4+eps). The implied constants depend only
  on eps.
statement_formal: |
  \frac{|a(F,S)|}{\|F\|_2} \ll_\varepsilon \frac{k^{1/4+\varepsilon}(4\pi)^k}{\Gamma(k)}\,c(S)^{-1/2}\det(S)^{\frac{k-1}{2}+\varepsilon}, \qquad \bigl\|(\det Y)^{k/2}F\bigr\|_\infty \ll_\varepsilon k^{5/4+\varepsilon}\,\|F\|_2
hypotheses_required: [GRH-automorphic]
status: still-conditional
waiting_on: [higher-automorphic]
status_note: >
  The hypothesis is used to bound the ratio
  L(1/2, pi x AI(Lambda)) / L(1, pi, Ad) by (kD)^eps, where pi is the
  automorphic representation of GSp_4 generated by F, Lambda runs over
  characters of the class group of an imaginary quadratic order of
  discriminant D, AI(Lambda) is its automorphic induction to GL_2, and Ad is
  the adjoint (degree 10) L-function. The paper remarks that the Generalized
  Lindelof Hypothesis for the first family and a sufficiently strong
  zero-free region for L(s, pi, Ad) would be enough. The link between
  Fourier coefficients and these L-values (the refined Gan-Gross-Prasad
  conjecture for Bessel periods) is a theorem of Furusawa and Morimoto and
  is not an assumption.
