id: cf-normal-absolutely-abnormal-numbers
title: Continued fraction normal numbers that are normal to no integer base
field: analytic-number-theory
statement_plain: >
  The set of real numbers in [0,1) that are normal with respect to the
  continued fraction expansion but are not normal to any integer base b at
  least 2 is dense and uncountable.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
status_note: >
  The paper says only "Generalized Riemann Hypothesis". It is used once,
  through a theorem of Lenstra on primes in an arithmetic progression that
  have a given integer as a primitive root. The paper does not say which
  L-functions are meant; results of this Artin primitive root type are
  recorded here as needing Dedekind zeta functions of Kummer-type fields.
sources:
  - authors: J. Vandehey
    title: Absolutely abnormal, continued fraction normal numbers
    year: 2016
    venue: Bulletin of the Australian Mathematical Society 94, 217-223
    doi: 10.1017/s0004972716000101
    url: https://arxiv.org/abs/1512.00337
    hypothesis_location: Theorem 1.1 (via Theorem 2.1 and Corollary 2.2)
    role: conditional-proof
  - authors: H. W. Lenstra, Jr.
    title: On Artin's conjecture and Euclid's algorithm in global fields
    year: 1977
    venue: Invent. Math. 42, 201-224
    doi: 10.1007/BF01389788
    hypothesis_location: "Theorem 3.1: the zeta function of each field L_n, obtained by adjoining n-th roots of unity and n-th roots, satisfies the generalized Riemann hypothesis"
    role: conditional-proof
review:
  state: ai-classified
  checked_by: null
  checked_on: null
  confidence: high
  open_questions:
    - >-
      Lenstra's paper was read: its hypothesis is the Riemann hypothesis for the zeta functions of Kummer-type fields, which confirms the code. Vandehey's own paper does not restate it.
