    - >-
      The paper is a recent single-author preprint and describes the result as a port of known arguments for the zeta function (Selberg, Tsang, Soundararajan) to a fixed Dirichlet L-function; its proof was not checked, and it is not clear why the modulus is restricted to squarefree odd q.
