id: ternary-goldbach-prime-and-two-isolated-primes
title: Every large odd integer is a sum of a prime and two isolated primes
field: additive-number-theory
statement_plain: >
  Call a prime p isolated if every integer m with
  0 < |p - m| <= C log p log log p log log log log p / log log log p is
  composite, where C is a fixed sufficiently small positive constant. Then
  every sufficiently large odd integer is the sum of a prime and two
  isolated primes.
statement_formal: null
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The paper writes "Generalized Riemann Hypothesis" without a formal
  definition. In the proof it is applied to sums of Lambda(n) twisted by
  non-principal Dirichlet characters and to the sieve remainder terms for
  primes in arithmetic progressions.
sources:
  - authors: H. Maier, M. Th. Rassias
    title: The ternary Goldbach problem with a prime and two isolated primes
    year: 2016
