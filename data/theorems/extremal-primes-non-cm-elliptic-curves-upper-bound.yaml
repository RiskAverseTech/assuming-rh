  confidence: high
  open_questions:
    - >-
      The paper lists analytic continuation and the functional equation of the symmetric power L-functions as assumptions. The existing entry sato-tate-effective-error-term-symmetric-powers reports that automorphy of these symmetric powers is now known, so PLUS-EXTRA was not listed here; a reviewer should confirm.
    - >-
      The theorem is stated for a_p(E) = [2 sqrt(p)]; the paper says the case a_p(E) = -[2 sqrt(p)] is analogous by symmetry but the theorem statement covers only the first.
