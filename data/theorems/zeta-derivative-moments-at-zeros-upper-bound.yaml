id: zeta-derivative-moments-at-zeros-upper-bound
title: Upper bounds for moments of zeta'(rho) over the zeros
field: analytic-number-theory
statement_plain: >
  Let N(T) be the number of non-trivial zeros rho of zeta with imaginary
  part gamma in (0, T]. For every positive integer k and every positive
  epsilon, the average of |zeta'(rho)|^(2k) over these zeros is
  O((log T)^(k(k+2) + epsilon)) for sufficiently large T, with the implied
  constant depending on k and epsilon.
statement_formal: |
  \frac{1}{N(T)} \sum_{0 < \gamma \le T} \left|\zeta'(\rho)\right|^{2k} \ll_{k,\varepsilon} (\log T)^{k(k+2)+\varepsilon} \qquad (k \in \mathbb{N})
hypotheses_required: [RH]
