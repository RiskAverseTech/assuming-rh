  open_questions:
    - >-
      The paper writes GRH without defining it. The code ERH-Dedekind is this draft's reading of the effective Chebotarev bound for completely split primes in a Galois field K (Proposition 5); the cited sources state it under the Riemann Hypothesis for the Dedekind zeta function of K.
    - >-
      Theorem 2 of the paper (2-RIT in coRP) looks unlocked and could be a separate entry.
