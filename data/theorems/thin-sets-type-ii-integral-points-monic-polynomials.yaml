id: thin-sets-type-ii-integral-points-monic-polynomials
title: Integral points in affine thin sets of type II for polynomials monic in Y
field: analytic-number-theory
statement_plain: >
  Fix n >= 2. Let F(Y, X_1, ..., X_n) be an integer polynomial that is
  absolutely irreducible, monic in Y, of degree at least 2 in Y, and
  (1, n)-allowable (a nondegeneracy condition that must hold after every
  GL_n(Q) change of the X variables). Let N(F, B) count the integer vectors
  x in [-B, B]^n for which F(y, x) = 0 has an integer solution y. Then there
  is an integer h depending only on n and deg F such that
  N(F, B) << ||F||^h B^(n - 1 + 1/(n+1) + epsilon) for all B >= 1 and every
  epsilon > 0, with the implied constant depending only on n, deg F and
  epsilon. Here ||F|| is the largest absolute value of a coefficient of F.
statement_formal: |
  N(F,B) \ll_{n,\deg F,\varepsilon} \|F\|^{h}\, B^{\,n-1+\frac{1}{n+1}+\varepsilon}
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The hypothesis is needed only when F is not a polynomial in Y^m for some
  m >= 2; for such F with m >= 2 the paper proves the same bound
  unconditionally. In the case m = 1 the hypothesis enters through a
  conditional polynomial sieve lemma (Lemma 6.2, taken from Bonolis and
  Pierce). Remark 7.2 says that this lemma assumes GRH for a large collection
  of Dedekind zeta functions, one for each integer vector k in [-2B, 2B]^n,
  so for potentially infinitely many number fields, and that a weaker
  averaged statement would suffice. These fields are generated by roots of
  specializations of F and are not abelian over the rationals in general;
  they need not be Galois, and the waiting_on value is the closest
  available family.
sources:
  - authors: D. Bonolis, L. B. Pierce, K. Woo
    title: "Counting integral points in thin sets of type II: singularities, sieves, and stratification"
    year: 2025
    venue: Preprint
    url: https://arxiv.org/abs/2505.11226
    hypothesis_location: Theorem 1.2 (case m = 1); the hypothesis is described in Remark 7.2
    role: conditional-proof
