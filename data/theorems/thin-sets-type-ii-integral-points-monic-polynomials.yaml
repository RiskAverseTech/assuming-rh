  open_questions:
    - >-
      The exact fields are specified in the cited paper of Bonolis and
      Pierce, which was not read. Remark 7.2 of this paper describes them
      only as Dedekind zeta functions attached to integer vectors k.
    - >-
      The waiting_on value galois-extensions is an approximation, since the
      fields involved are not stated to be Galois.
