id: brun-constant-upper-bound-2-1594
title: Brun's constant is less than 2.1594
field: analytic-number-theory
statement_plain: >
  Brun's constant B, the sum of 1/p + 1/(p+2) over all primes p such that
  p + 2 is also prime, is less than 2.1594.
statement_formal: |
  B = \sum_{p,\ p+2 \text{ both prime}} \left( \frac{1}{p} + \frac{1}{p+2} \right) < 2.1594
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The hypothesis is used to bound the error in the count of primes up to x in
  the residue class -2 modulo d, for the moduli d that arise in Selberg's
  sieve (Theorem 2.2 of the paper). The paper reports that the best
  unconditional bound is B < 2.28851, due to Platt and Trudgian, and that an
  earlier unpublished conditional bound B < 2.1754 is due to Klyve.
sources:
  - authors: L. Dunn
    title: Improved Upper Bound on Brun's Constant Under GRH
    year: 2025
    venue: Preprint
    url: https://arxiv.org/abs/2504.15658
    hypothesis_location: Theorem 1.1 (hypothesis used in Theorem 2.2)
    role: conditional-proof
