  open_questions:
    - >-
      The paper writes only 'Generalized Riemann Hypothesis (GRH)' and does not say for which L-functions. The classification rests on the one place it is used: a bound for the error term of pi(x; d, -2) quoted from Lemma 5.1 of the paper's reference [7], which was not read.
    - >-
      The proof depends on numerical computations (code linked from the paper) that were not checked.
