id: squarefull-variance-short-intervals-quasi-rh-equivalence
title: Variance bound for square-full integers in short intervals with both main terms removed
field: analytic-number-theory
statement_plain: >
  Write D_r(x; H) = (x + H)^r - x^r. For every eps in (0, 1/1000) and every
  X^eps <= H <= X^(1 - eps), the mean square over x in [X, 2X] of the number
  of square-full integers in (x, x + H] minus
  (zeta(3/2)/zeta(3)) D_(1/2)(x; H) + (zeta(2/3)/zeta(2)) D_(1/3)(x; H)
  is at most a constant depending on eps times X^(1/5 + 5 eps).
statement_formal: |
  \frac{1}{X}\int_{X}^{2X}\left| \sum_{x<n\le x+H} 1_{\text{square-full}}(n) - \left( \frac{\zeta(3/2)}{\zeta(3)}\, D_{1/2}(x;H) + \frac{\zeta(2/3)}{\zeta(2)}\, D_{1/3}(x;H) \right) \right|^{2} dx \ll_{\varepsilon} X^{1/5+5\varepsilon}, \qquad D_r(x;H) = (x+H)^r - x^r
hypotheses_required: [RH]
status: unlocked
status_note: >
  The paper proves that this statement is equivalent to a quasi-Riemann
  hypothesis: every zero of the Riemann zeta function has real part in
  [2/5, 3/5] (called 1/10-QRH in the paper). That hypothesis is weaker than
  RH, so RH implies the statement, but the statement is not equivalent to RH
  itself. It complements the existing entry
  squarefree-variance-short-intervals-rh-equivalence and the squarefull
  variance asymptotic of Chan.
sources:
