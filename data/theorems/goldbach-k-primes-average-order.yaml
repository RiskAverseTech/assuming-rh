id: goldbach-k-primes-average-order
title: Average number of representations as a sum of k primes with error X^(k-1) log^3 X
field: additive-number-theory
statement_plain: >
  Let G_k(n) be the number of ways to write n as a sum of k positive
  integers, each way weighted by the product of the von Mangoldt function at
  the summands. For k >= 2 and X >= k, the sum of G_k(n) over n <= X equals
  X^k/k! + H_k(X) + O_k(X^(k-1) (log X)^3), where H_k(X) is the sum over the
  nontrivial zeros rho of zeta of
  -k X^(rho + k - 1) / (rho (rho + 1) ... (rho + k - 1)).
statement_formal: |
  \sum_{n\le X}G_k(n)=\frac{X^{k}}{k!}-k\sum_{\rho}\frac{X^{\rho+k-1}}{\rho(\rho+1)\cdots(\rho+k-1)}+O_k\!\left(X^{k-1}\log^{3}X\right)
hypotheses_required: [RH]
status: unlocked
status_note: >
  The case k = 2 is due to Languasco and Zaccagnini. The paper also proves
  that RH is equivalent to the weaker estimate
  S_k(X) = X^k/k! + O(X^(k - 1/2 + eps)) for every eps > 0 (Theorem 1.4).
