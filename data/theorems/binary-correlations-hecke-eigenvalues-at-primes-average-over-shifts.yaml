  open_questions:
    - >-
      The theorem is stated under a zero-free region hypothesis, not under GRH; that GRH for L(s, f, chi) implies Hypothesis 1 is immediate but is not stated in the paper in these words. A reviewer should decide whether such weaker-than-GRH results belong in the dataset.
    - >-
      The abstract's claim that the fourth moment hypothesis of Theorem 2 follows from GRH is supported in the body only by Remark 1.4, which is phrased tentatively ("It seems that under Generalized Riemann Hypothesis").
