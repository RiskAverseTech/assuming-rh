id: zeta-derivative-discrete-mean-square-lower-order-terms
title: Discrete mean square of zeta'(rho) over the zeros with all lower-order terms
field: analytic-number-theory
statement_plain: >
  Let Z(t) be Hardy's Z-function. For all sufficiently large T, the sum of
  |Z'(gamma)|^2 over the zeros 0 < gamma <= T of Z(t), counted with
  multiplicity (which equals the sum of |zeta'(rho)|^2 over the zeros rho of
  zeta with ordinate in (0, T]), is
  (1/(24 pi)) T log^4(T/2pi) + ((2 gamma_0 - 1)/(6 pi)) T log^3(T/2pi)
  + a_1 T log^2(T/2pi) + a_2 T log(T/2pi) + a_3 T + O(T^(3/4) log^(7/2) T),
  where gamma_0 is Euler's constant and a_1, a_2, a_3 are constants
  expressible by the Stieltjes constants.
statement_formal: |
  \sum_{0<\gamma\le T} |Z'(\gamma)|^2 = \frac{1}{24\pi}\,T\log^4\frac{T}{2\pi} + \frac{2\gamma_0-1}{6\pi}\,T\log^3\frac{T}{2\pi} + a_1 T\log^2\frac{T}{2\pi} + a_2 T\log\frac{T}{2\pi} + a_3 T + O\!\left(T^{3/4}\log^{7/2} T\right)
hypotheses_required: [RH]
status: unlocked
status_note: >
  Sharpens Gonek's 1984 asymptotic, which had only the leading term and an
  error O(T log^3 T). The paper itself notes that Milinovich obtained this
  result in his 2008 PhD thesis with a better error term, working with
  zeta'(s) instead of Z'(t).
sources:
