  open_questions:
    - >-
      The paper states its hypothesis only for Dedekind zeta functions of the fields K(q). GRH-Hecke is added because that hypothesis is equivalent to the Riemann Hypothesis for the ray class Hecke L-functions modulo q that the proof works with; a reviewer may prefer to list ERH-Dedekind alone.
    - >-
      The coefficient 10^17 of h_K was read from the PDF; the extracted text prints it as '1017'.
