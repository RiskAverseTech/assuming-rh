id: primes-short-intervals-dudek-grenie-molteni
title: "Primes in explicit short intervals around x"
field: analytic-number-theory
statement_plain: >
  Let x be at least 2 and c = 1/2 + 2/log x. Then there is a prime in
  the interval (x - c sqrt(x) log x, x + c sqrt(x) log x), and there are at
  least sqrt(x) primes in
  (x - (c+1) sqrt(x) log x, x + (c+1) sqrt(x) log x).
statement_formal: |
  \text{For all } x \ge 2 \text{ and } c = \tfrac12 + \tfrac{2}{\log x} \text{ there is a prime } p \text{ with } |p - x| < c\,\sqrt{x}\,\log x
hypotheses_required: [RH]
