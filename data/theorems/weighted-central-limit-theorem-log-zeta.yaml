id: weighted-central-limit-theorem-log-zeta
title: Central limit theorem for log|zeta(1/2+it)| weighted by |zeta|^2
field: analytic-number-theory
statement_plain: >
  As t varies in [T, 2T], the distribution of log|zeta(1/2 + it)| with
  respect to the weighted measure |zeta(1/2 + it)|^2 dt is asymptotically
  Gaussian with mean log log T and variance (1/2) log log T.
statement_formal: null
hypotheses_required: [RH]
status: unlocked
status_note: >
  The paper says RH is used only in Proposition 1.1, to bound the
  contribution of the zeros through a sum of |zeta(rho + i alpha)|^2 over
  zeros, which is known to be O(T (log T)^2) only under RH.
sources:
