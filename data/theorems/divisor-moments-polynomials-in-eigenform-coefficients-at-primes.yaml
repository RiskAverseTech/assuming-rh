    - >-
      The formula K_m = sum over i of ((e_i + 1)^m - 1) is the one the paper gives after Theorem 1.4 for the same definition (2) of K_m; Theorem 1.5 defines kappa_v as the number of indices i with v <= e_i, which gives the same value.
    - >-
      The range of m (positive integers) is taken from the general Theorem 1.3; Theorem 1.5 itself does not restate it.
