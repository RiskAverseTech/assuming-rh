      The proof only needs the hypothesis for the Dedekind zeta function of the q-th cyclotomic field and for the Riemann zeta function. Since the cyclotomic zeta function factors into Dirichlet L-functions, this entry records the hypothesis as RH and GRH-Dirichlet. A reviewer should confirm that reading.
