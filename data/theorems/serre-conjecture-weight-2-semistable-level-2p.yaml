id: serre-conjecture-weight-2-semistable-level-2p
title: Serre's modularity conjecture in weight 2 and semistable level 2p
field: arithmetic-geometry
statement_plain: >
  Every odd, irreducible, two-dimensional Galois representation of the
  absolute Galois group of Q over a finite field with Serre weight 2 and
  semistable Serre level 2p, p any odd prime, is modular. Consequently every
  semistable abelian variety over Q of GL_2-type with bad reduction only at
  2 and one other prime p is modular.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: proved-otherwise
status_note: >
  Now known without any hypothesis: Serre's modularity conjecture was
  proved in full by Khare and Wintenberger (2009). What follows describes
  the earlier conditional proof of these cases.
  The paper writes only "the Generalized Riemann Hypothesis". It is used at
  one point: the base case of level 2 and weight 6 is reduced, in
  characteristic 5, to the modularity of a semistable abelian variety of
  conductor dividing 10, which is taken from Calegari's work under GRH. That
  work (existing entry no-semistable-abelian-varieties-good-outside-6-or-10)
  uses the GRH discriminant bounds of Odlyzko, which assume the Riemann
  Hypothesis for the Dedekind zeta functions of number fields generated by
  torsion points. The paper states that the case p = 3 holds without GRH,
  and its main theorem (Serre's conjecture for odd level) is unconditional.
sources:
  - authors: L. Dieulefait
    title: Remarks on Serre's modularity conjecture
    year: 2011
    venue: Preprint
    url: https://arxiv.org/abs/math/0603439
    hypothesis_location: Theorem 7.1 (argument in Section 7.1 b)
    role: conditional-proof
  - authors: C. Khare, J.-P. Wintenberger
    title: Serre's modularity conjecture (I) and (II)
    year: 2009
    venue: Invent. Math. 178, 485-504 and 505-586
    role: unconditional-proof
review:
  state: ai-classified
  checked_by: null
  checked_on: null
  confidence: medium
  open_questions:
    - >-
      The move to proved-otherwise rests on the general fact that Serre's conjecture is a theorem of Khare and Wintenberger, as stated for example in the abstract of arXiv 2004.07587, which was read. The Khare-Wintenberger papers themselves were not read and their citation is given from memory.
    - >-
      Serre's modularity conjecture is generally understood to have since been proved in full, without any Riemann Hypothesis, by Khare and Wintenberger. The paper on disk does not name such a source for the even level case, so the status is left as still-conditional; a reviewer should consider changing it to proved-otherwise with the proper reference.
    - >-
      The identification of the hypothesis with Dedekind zeta functions comes from the dataset's entry on the cited paper of Calegari, not from this paper, which does not define GRH.
