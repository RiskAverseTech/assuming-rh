  open_questions:
    - >-
      The paper never says which L-functions its GRH covers. The classification as Dirichlet-only comes from reading the cited results (Bach's bound for Dirichlet characters, and McGown's Theorems 3.1 and 3.2, whose hypotheses are RH, GRH for a Dirichlet L-function, and GRH for the Dedekind zeta function of a cyclic field). The theorem numbers cited as [13, Theorems 3.1 and 3.2] refer to the journal version of McGown's paper; in the arXiv text the matching bounds on q2 and r are Theorems 3.2 and 3.3. A reviewer should confirm that no other conditional input is used.
