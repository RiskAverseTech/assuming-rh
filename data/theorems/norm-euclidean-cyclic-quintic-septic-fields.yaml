id: norm-euclidean-cyclic-quintic-septic-fields
title: Classification of the norm-Euclidean cyclic fields of degrees 5 and 7
field: algebraic-number-theory
statement_plain: >
  A cyclic number field of degree 5 is norm-Euclidean if and only if its
  discriminant is 11^4, 31^4 or 41^4. A cyclic number field of degree 7 is
  norm-Euclidean if and only if its discriminant is 29^6 or 43^6.
statement_formal: |
  [K:\mathbb{Q}] = 5 \text{ cyclic}: \ K \text{ norm-Euclidean} \iff \Delta_K \in \{11^4, 31^4, 41^4\}; \qquad [K:\mathbb{Q}] = 7 \text{ cyclic}: \ K \text{ norm-Euclidean} \iff \Delta_K \in \{29^6, 43^6\}
hypotheses_required: [RH, GRH-Dirichlet]
status: unlocked
status_note: >
  This paper does not define GRH. Its conditional step (Proposition 5.2)
  takes a bound of Bach on the least prime where a Dirichlet character is
  not 1, and Theorems 3.1 and 3.2 of McGown's paper "Norm-Euclidean Galois
  fields and the generalized Riemann hypothesis" (arXiv 1102.2043). In that
  paper GRH means the hypothesis for Dirichlet L-functions, and the Dedekind
  zeta function of a cyclic field of prime degree is a product of Dirichlet
  L-functions. The result extends the cubic classification recorded in the entry on norm-Euclidean Galois cubic fields to degrees 5 and 7. The proof also relies
  on a large computation.
