id: prime-races-many-contestants-uniform-density
title: Prime number races with up to log q / (log log q)^4 contestants are asymptotically unbiased
field: analytic-number-theory
statement_plain: >
  For distinct reduced residue classes a_1, ..., a_n modulo q, let
  delta(q; a_1, ..., a_n) be the logarithmic density of the set of x with
  pi(x; q, a_1) > pi(x; q, a_2) > ... > pi(x; q, a_n). If
  2 <= n <= log q / (log log q)^4, then delta(q; a_1, ..., a_n) equals
  (1/n!) (1 + O(n (log n)^4 / log q)), uniformly in the n-tuple. In the
  other direction, for every eps > 0, every large q and every n between
  phi(q)^eps and phi(q), some n-tuple has density less than
  (1 - c_eps) / n! with c_eps > 0.
statement_formal: |
  \delta(q;a_1,\dots,a_n)=\frac{1}{n!}\left(1+O\!\left(\frac{n(\log n)^4}{\log q}\right)\right)\qquad \left(2\le n\le \frac{\log q}{(\log\log q)^4}\right)
hypotheses_required: [GRH-Dirichlet, PLUS-EXTRA]
status: still-conditional
waiting_on: [extra-assumption]
status_note: >
  The extra assumption is the Linear Independence hypothesis LI: the
  nonnegative imaginary parts of the nontrivial zeros of Dirichlet
  L-functions attached to primitive characters are linearly independent
  over the rationals. It is not covered. The Riemann Hypothesis part
  concerns Dirichlet L-functions only. The first statement is Theorem 1.2,
  which proves part (1) of a conjecture of Ford and Lamzouri and extends the
  range n <= sqrt(log q) of the earlier result of Lamzouri; the second is
  Theorem 1.3. Under the same assumptions the paper also shows (Theorem 1.4)
  that each of n <= phi(q)^(1/32) contestants leads with logarithmic density
  asymptotic to 1/n. Compare the entry
  prime-races-three-or-more-competitors-bias-size, which treats a fixed
  number of contestants.
sources:
  - authors: A. J. Harper, Y. Lamzouri
    title: Orderings of weakly correlated random variables, and prime number races with many contestants
    year: 2015
    venue: Preprint
