id: quadratic-form-from-genus-polynomial-time
title: Generating a quadratic form in a given genus in polynomial time
field: computational-number-theory
statement_plain: >
  Given a description (a valid symbol) of a non-empty genus of integral
  quadratic forms in n variables with determinant d, a randomized algorithm
  outputs a quadratic form in that genus with constant probability, in time
  polynomial in n and log d.
statement_formal: |
  \text{time } \mathrm{poly}(n, \log d)
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The hypothesis is used for the running time, in two places: a
  quantitative form of Dirichlet's theorem (the paper's Theorem 3: among the
  integers a + zq up to q^3 a proportion of order 1/log of them are prime),
  used to sample a prime in a prescribed residue class, and the bound
  3 (ln p)^2 / 2 for the least quadratic non-residue modulo p. Both concern
  Dirichlet L-functions only.
sources:
  - authors: C. Dubey, T. Holenstein
    title: Generating a Quadratic Forms from a Given Genus
    year: 2015
    venue: Preprint
    url: https://arxiv.org/abs/1409.6913
    hypothesis_location: "Theorem 33, through Theorem 23 (Section 7.7) and Theorem 3"
    role: conditional-proof
