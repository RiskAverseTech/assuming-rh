  open_questions:
    - >-
      Theorem 33 itself does not mention the hypothesis; the abstract does, and the proof of Theorem 23 uses it. The paper writes GRH in some places and ERH in others without defining either.
    - >-
      The year is that of the arXiv version read (v2, 2015); the first version is from 2014.
    - >-
      The two uses found (primes in arithmetic progressions and least quadratic non-residue) were located by searching the text for the hypothesis; a reviewer should confirm that the cited subroutines (for example from earlier work of the same authors) bring in nothing more.
