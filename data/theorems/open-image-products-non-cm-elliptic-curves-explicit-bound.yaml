id: open-image-products-non-cm-elliptic-curves-explicit-bound
title: Explicit open image bound for products of non-CM elliptic curves over Q
field: arithmetic-geometry
statement_plain: >
  Let A_1, ..., A_n be elliptic curves over Q without complex multiplication
  that are pairwise not isogenous over the algebraic closure, with
  conductors N_{A_i}. Then for every prime l greater than the maximum over
  pairs i != j of 1377075200 log rad(6 N_{A_i} N_{A_j}) + 26020715799, the
  l-adic Galois representation of the product A_1 x ... x A_n is surjective,
  in the sense that its image is the full group of n-tuples in GL_2(Z_l) with
  equal determinants.
statement_formal: |
  c(A_1 \times \cdots \times A_n) \le \max_{1 \le i \ne j \le n} \bigl( 1377075200\, \log \mathrm{rad}(6 N_{A_i} N_{A_j}) + 26020715799 \bigr)
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The paper's GRH is the Generalized Riemann Hypothesis for Dedekind zeta
  functions. It is used through the effective Chebotarev bound of Bach and
  Sorenson for the least prime with a given Frobenius class, applied to
  Galois extensions generated by torsion points, which are not abelian over
  Q. The paper states that only the explicit bound needs the hypothesis: the
  equivalence between pairwise non-isogeny and openness of the adelic image
  is unconditional, and weaker unconditional bounds are available. This is
  the special case (Corollary 1.2) of the main theorem for products of
  principally polarized abelian varieties of a common dimension over a
  number field (Theorem 1.1).
sources:
  - authors: J. Mayle, T. Wang
    title: An effective open image theorem for products of principally polarized abelian varieties
