id: nonvanishing-central-values-cusp-forms-more-than-nine-sixteenths
title: More than 9/16 of even holomorphic cusp forms have non-vanishing central L-value
field: analytic-number-theory
statement_plain: >
  Among level 1 holomorphic Hecke cusp forms f of weight k up to K with k
  divisible by 4, the proportion with L(1/2, f) nonzero has lim inf greater
  than 9/16 as K grows; the same holds for newforms of fixed weight and
  prime level N with even functional equation as N grows. For odd
  functional equation the proportion with nonzero central derivative
  L'(1/2, f) has lim inf greater than 15/16 in both families, and the average
  order of vanishing at 1/2 over all newforms of prime level N has lim sup
  less than 1. For symmetric squares of level 1 forms the proportion with
  L(1/2, sym^2 f) nonzero has lim inf greater than 55/64.
statement_formal: |
  \liminf_{N \to \infty} \frac{\#\{f \in H_k^{+}(\Gamma_0(N)) : L(\tfrac12, f) \ne 0\}}{\#H_k^{+}(\Gamma_0(N))} > \frac{9}{16}
hypotheses_required: [GRH-automorphic, GRH-Dirichlet]
status: still-conditional
waiting_on: [higher-automorphic]
status_note: >
  The corollary assumes "the GRH for GL2 automorphic L-functions as well as
  Dirichlet L-functions". It follows from the one-level density theorem of
  the same paper (entry one-level-density-holomorphic-cusp-forms-support-two)
  by choosing positive test functions. The paper notes that a proportion of
  at least 1/2 for even forms is known unconditionally from Iwaniec and
  Sarnak, and that Kowalski-Michel and Vanderkam have an unconditional lower
  bound 7/8 for the odd case in the level aspect. The symmetric square part
  also uses the hypothesis for L(s, sym^2 f).
