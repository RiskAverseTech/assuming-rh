id: half-integral-weight-fourier-coefficients-sign-changes-positive-proportion
title: Fourier coefficients of half-integral weight cusp forms change sign a positive proportion of the time along fundamental discriminants
field: analytic-number-theory
statement_plain: >
  Let k >= 2 and let g be a Hecke cusp form of weight k + 1/2 and level 4 in
  Kohnen's plus space, normalized to have real Fourier coefficients c(n).
  Consider the fundamental discriminants of the form 8n with n > 0 odd and
  squarefree. For all large X, the sequence of nonzero c(d) with d of this
  form and d <= X has >> X sign changes. In particular c(d) < 0 for >> X such
  d <= X and c(d) > 0 for >> X such d <= X.
statement_formal: null
hypotheses_required: [GRH-automorphic]
status: still-conditional
waiting_on: [higher-automorphic]
status_note: >
  The paper states that it assumes GRH for L(s, f x chi_d) for every
  fundamental discriminant d with (-1)^k d > 0, where f is the level 1 Hecke
  cusp form of weight 2k attached to g by the Shimura correspondence and
  chi_d is the Kronecker symbol. Since k >= 2 the weight of f is at least 4,
  so these are quadratic twists of modular L-functions of weight above 2.
  The paper also proves unconditionally that there are >> X^(1 - eps) sign
  changes (its Theorem 4 and the results of Section 1.1). The dataset entry
  half-integral-weight-fourier-coefficients-decorrelation-primes is a
  different result on the same coefficients.
