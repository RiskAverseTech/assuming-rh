id: murmurations-quadratic-dirichlet-characters-explicit-formula
title: Murmurations for quadratic Dirichlet characters with an explicit scale-invariant main term
field: analytic-number-theory
statement_plain: >
  Let chi_n be the Jacobi symbol (n/.), f a smooth fast-decaying weight with
  Mellin transform Mf, and consider the average over odd squarefree n > 0,
  weighted by f(n/N)/N, of (N y)^(-1/2) times the sum of chi_n(p^k) log p
  over prime powers p^k < N y. For 2 < T < N y and 1/2 + eps < c < 3/4 this
  average equals an explicit contour integral depending only on y (not on
  N), plus 2 Mf(1) / (3 zeta(2)), up to an error
  O((N^(1/2 - c) y^(c - 1/2) + N^(1/2) y^(1/2) / T) (N y T)^eps).
statement_formal: |
  \begin{aligned}
  \sum_{\substack{n>0\\ n\ \text{odd, squarefree}}}\frac1N f\!\left(\frac nN\right)\frac{1}{\sqrt{Ny}}\sum_{p^k<Ny}\chi_n(p^k)\log p
  ={}& \frac{1}{2\pi i}\int_{c-iT}^{c+iT}\frac14\left(\frac{\Gamma\bigl(\frac{1-s}{2}\bigr)}{\Gamma\bigl(\frac s2\bigr)}+\frac{\Gamma\bigl(\frac{2-s}{2}\bigr)}{\Gamma\bigl(\frac{1+s}{2}\bigr)}\right)\frac{\zeta(2-2s)}{\zeta^{(2)}(3-2s)}(\pi y)^{s-\frac12}\,\mathcal{M}f\bigl(\tfrac32-s\bigr)\frac{ds}{s} \\
  &+ \frac{2\,\mathcal{M}f(1)}{3\zeta(2)} + O\!\left(\bigl(N^{\frac12-c}y^{c-\frac12}+N^{\frac12}y^{\frac12}T^{-1}\bigr)(NyT)^{\varepsilon}\right)
  \end{aligned}
hypotheses_required: [RH, GRH-Dirichlet]
status: unlocked
status_note: >
  The paper writes "Assume GRH" without naming a family. The proof combines
  a truncated Perron formula with the asymptotic of Cech for the weighted
  average of L'/L(1/2 + r, chi_n) over odd squarefree n (quoted as Theorem
  5.2), which is a consequence of the result recorded in the entry
  ratios-conjecture-quadratic-dirichlet-l-functions-one-shift; that result
  uses the hypothesis only for the zeta function and for Dirichlet
  L-functions of real characters. Here zeta^(2) is written as in the paper;
  it is presumably zeta with its Euler factor at 2 removed. The paper
  proves other murmuration formulas under Ratios Conjectures (elliptic
  curves by height, quadratic twists) and, under GRH, one for newforms of
  fixed weight and prime level tending to infinity (Theorem 1.5), which
  needs modular form L-functions and is not recorded here.
