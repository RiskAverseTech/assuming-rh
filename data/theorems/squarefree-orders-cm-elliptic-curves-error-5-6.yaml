  open_questions:
    - >-
      Since the division fields are abelian over K, the hypothesis could also be coded as GRH-Hecke for ray class characters of K (waiting on class-group-characters). ERH-Dedekind is used because the paper states it that way.
    - >-
      Whether the proof needs the zeta functions of composita K(E[a^2]) K(E[m]) only, or of further fields, was not checked.
