id: squarefree-orders-cm-elliptic-curves-error-5-6
title: Primes where a CM elliptic curve has reduction of squarefree order, with error x^(5/6)
field: arithmetic-geometry
statement_plain: >
  Let E be an elliptic curve over the rationals of conductor N_E with
  complex multiplication by the full ring of integers of an imaginary
  quadratic field K, and let h_E(x) be the number of ordinary primes p up to
  x of good reduction for which the number of points of E modulo p is
  squarefree. Then for any eta in (0, 1/3),
  h_E(x) = delta_E Li(x) + O(x^(5/6) (log(N_E x))^(1/3) / (log x)^(2/3)),
  uniformly for N_E up to x^eta, where delta_E is an explicit constant given
  by a sum over division fields.
statement_formal: |
  h_E(x,\mathbb{Q}) = \delta_E \,\mathrm{Li}(x) + O_\eta\!\left( x^{5/6}\, \frac{(\log(N_E x))^{1/3}}{(\log x)^{2/3}} \right), \qquad N_E \le x^{\eta},\ 0 < \eta < \tfrac13
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The hypothesis is GRH for the Dedekind zeta functions of the division
  fields of E, used through the effective Chebotarev theorem. Because E has
  complex multiplication these fields are abelian over the imaginary
  quadratic field K but in general not over the rationals, so their zeta
  functions factor into Hecke L-functions over K rather than Dirichlet
  L-functions. This sharpens the conditional error term
  x^(5/6) (log x)^2 (log(N_E x))^(1/3) of Cojocaru by a power of log x.
  The same theorem also gives an unconditional error
  O_A(N_E x / (log x)^A), and the paper's short interval results are
  unconditional. No earlier entry in the dataset treats squarefree orders.
