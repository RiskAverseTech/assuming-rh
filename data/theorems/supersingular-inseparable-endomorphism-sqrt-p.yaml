id: supersingular-inseparable-endomorphism-sqrt-p
title: Computing an inseparable endomorphism of a supersingular elliptic curve in about sqrt(p) time
field: computational-number-theory
statement_plain: >
  For a prime l in {2, 3, 5}, an integer d in {1, 2}, a prime p > 4d and a
  supersingular elliptic curve E over the field with p^2 elements, there is
  a randomized algorithm (random non-backtracking walks in the l-isogeny
  graph until a curve d-isogenous to its Frobenius conjugate is reached)
  that outputs an inseparable endomorphism of E and terminates in expected
  O(p^(1/2) (log p)^2 (log log p)^3) bit operations.
statement_formal: |
  O\!\left(p^{1/2}(\log p)^2(\log\log p)^3\right) \text{ expected bit operations}
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The output is correct unconditionally. The hypothesis is used only for the
  expected running time, through Proposition 4.2: the number of target
  curves is bounded below by the class number of Q(sqrt(-pd)), and
  Littlewood's conditional lower bound gives a class number of order at
  least sqrt(p) / log log p. That bound concerns the L-function of a
  quadratic Dirichlet character. The paper's later Theorem 5.5, which
  computes the whole endomorphism ring, also relies on conditional results of
  other authors (Wesolowski and others) and is not part of this entry.
sources:
  - authors: J. Fuselier, A. Iezzi, M. Kozek, T. Morrison, C. Namoijam
