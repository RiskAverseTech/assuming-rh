  open_questions:
    - >-
      The statement of Corollary 1.2 does not repeat the words 'assume GRH'; the hypothesis is carried by Theorem 2.1 and the introduction. Confirm that this is the intended reading.
    - >-
      RH for zeta is listed because the proof of Corollary 1.1 says 'Since we assume GRH' when bounding the sum of the von Mangoldt function up to t using Rosser and Schoenfeld. It is not clear whether that step truly needs RH for zeta or only GRH for L(s, chi). Either way the status is unlocked.
    - >-
      The exponent in the first term is read as (log log C)^2; this matches the derivation with x = (log C)^2 but the text extraction prints it as log2 log C.
