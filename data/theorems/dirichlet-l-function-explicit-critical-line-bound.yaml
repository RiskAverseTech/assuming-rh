id: dirichlet-l-function-explicit-critical-line-bound
title: Explicit upper bound for Dirichlet L-functions on the critical line
field: analytic-number-theory
statement_plain: >
  Let chi be a primitive even Dirichlet character modulo q and put
  C = q (|t| + 1/2). If log log C is at least 10, then |L(1/2 + it, chi)| is
  at most exp( (23/25) log C / (log log C)^2 + (3/8) log C / log log C ).
statement_formal: |
  \left| L\!\left(\tfrac12 + it, \chi\right) \right| \le \exp\!\left( \frac{23 \log \tilde C}{25 (\log\log \tilde C)^2} + \frac{3 \log \tilde C}{8 \log\log \tilde C} \right), \qquad \tilde C = q\left(|t| + \tfrac12\right),\ \log\log \tilde C \ge 10
hypotheses_required: [RH, GRH-Dirichlet]
status: unlocked
status_note: >
  The paper proves a bound for a general class of L-functions satisfying
  Ramanujan's conjecture (Theorem 2.1 and Corollary 1.1), assuming GRH for the
  L-function in question. This entry records only the special case for
  primitive even Dirichlet characters (Corollary 1.2). The same paper gives
  the same bound for the Riemann zeta function with T <= t <= 2T and C = T
  (Corollary 1.4), and versions for holomorphic cusp forms and Dedekind zeta
  functions (Corollaries 1.3 and 1.5), which are not recorded here.
