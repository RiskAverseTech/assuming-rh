    - >-
      The paper never says which L-functions its GRH covers. ERH-Dedekind is inferred from the two uses (Odlyzko discriminant bounds and a Hooley-type argument following Roskam and Murty); the cited result of Murty was not read.
    - >-
      The abstract says the result assumes GRH "and a minor technical result", while Theorem 5.2 as stated assumes only GRH. The entry follows Theorem 5.2.
