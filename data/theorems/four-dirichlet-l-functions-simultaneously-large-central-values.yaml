  open_questions:
    - >-
      Corollary 1.2 does not restate the conditions on the characters chi_j and the size of D; they are taken here from the standing assumptions and from Theorem 1.1, from which the corollary is deduced.
    - >-
      The paper writes 'the Generalized Riemann Hypothesis' without a formal definition; every L-function in the argument is a Dirichlet L-function.
