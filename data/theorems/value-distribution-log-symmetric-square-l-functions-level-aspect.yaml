  open_questions:
    - >-
      For r = 1 the paper says the result is known unconditionally in stronger form (reference [20], M. Mine); the entry is therefore about the symmetric square case, and the r = 1 case was not split off as proved-otherwise.
    - >-
      The average is restricted to forms whose symmetric power L-function is entire, which for r = 1, 2 is all primitive forms according to the paper.
