  confidence: medium
  open_questions:
    - >-
      The paper does not define ERH. The codes are this draft's reading of how the cited results are used: Bach and Sorenson's bound for the least split prime is applied only to quadratic fields, and the cited classification of Elsenhans, Klueners and Nicolae was not read.
    - >-
      RH is listed next to GRH-Dirichlet because the cited bounds work with the Dedekind zeta function of a quadratic field, which is the Riemann zeta function times a quadratic Dirichlet L-function.
    - >-
      This is a classification theorem that depends on computer searches, not an algorithm paper.
