id: imaginary-multiquadratic-fields-class-group-exponent-3
title: Complete list of imaginary multiquadratic fields with class group of exponent 3
field: algebraic-number-theory
statement_plain: >
  The imaginary biquadratic fields whose class group has exponent 3 are
  exactly the 163, 122, 32 and 1 known fields with class group C_3, C_3^2,
  C_3^3 and C_3^4, and the imaginary triquadratic fields with this property
  are exactly the 23, 29, 7 and 1 known fields with these class groups.
  There are no further such fields.
statement_formal: null
hypotheses_required: [RH, GRH-Dirichlet]
status: unlocked
status_note: >
  The existence of the listed fields is unconditional; the hypothesis is
  needed only for completeness of the list. It enters in two ways, both
  about imaginary quadratic fields: the cited classification of imaginary
  quadratic fields with class group of exponent 3 (Elsenhans, Klueners and
  Nicolae), and a bound of Bach and Sorenson for the least prime that splits
  in a quadratic field of discriminant D. A prime splits in a quadratic
  field exactly when a quadratic Dirichlet character takes the value 1, so
  Dirichlet L-functions (and the zeta function) suffice. Theorem 2 of the
  paper gives the analogous complete list for exponent 5.
sources:
  - authors: J. Klüners, T. Komatsu
    title: Imaginary multiquadratic number fields with class group of exponent 3 and 5
