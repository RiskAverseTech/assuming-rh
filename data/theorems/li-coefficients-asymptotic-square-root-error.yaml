  open_questions:
    - >-
      The paper presents the zeta case as a new proof of a known formula (Voros; Lagarias for automorphic L-functions). Whether the error term O(sqrt(n) log n) is itself due to Lagarias was not checked.
    - >-
      The constant for zeta was obtained by substituting the paper's values d = 1, Q = pi^(-1/2), lambda = 1/2 into c_F; it agrees with the constant in the existing entry.
