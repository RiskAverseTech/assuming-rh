id: index-of-minus-one-a-mod-p-finiteness-criterion
title: When the group generated by -1 and a has index m modulo only finitely many primes
field: analytic-number-theory
statement_plain: >
  Let a be a positive rational number different from 1 and write a = a0^h,
  where a0 is not a power of a rational number and a0 = a1 * a2^2 with a1 > 1
  a squarefree integer. For a positive integer m, the set of primes p such
  that the subgroup of F_p^* generated by -1 and a has index exactly m is
  finite if and only if 3 | h, 3 does not divide m, 3 | a1, a1 | 3m, and
  either (h odd, 2 || m, a1 odd) or (v_2(h) < v_2(m) and v_2(m) is not 1).
  In every other case the set is infinite.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The paper writes only "GRH". The conditional part is the existence of the
  density of primes with a given index, taken from Pappalardi and Susa and
  going back to Hooley's method, which uses the Dedekind zeta functions of
  the Kummer fields Q(zeta_{mk}, Gamma^{1/mk}). The paper proves
  unconditionally that the density formula vanishes exactly in the two
  listed cases, and that in those cases the set of primes is finite; the
  hypothesis is needed for the converse (a nonzero density gives infinitely
  many primes). For a group generated by a single rational number the
  corresponding criterion is due to Lenstra.
