  open_questions:
    - >-
      The paper does not list every L-function to which GRH is applied; GRH-automorphic is the cautious code. The L-functions L(s, pi x chi) with chi a class group character are Rankin-Selberg L-functions of GL_2 x GL_2 type via automorphic induction.
    - >-
      The statement of the general theorem is simplified; the precise definitions of the packets, the level structure K and the Sobolev norm S_{infinity,d} are in Section 1.3 of the paper.
