id: montgomery-form-factor-integral-bounded-intervals-bounds
title: Bounds for the integral of Montgomery's pair correlation function F(alpha) over bounded intervals
field: analytic-number-theory
statement_plain: >
  Let F(alpha, T) be Montgomery's form factor: (2 pi / (T log T)) times the
  sum over pairs of zeta zero ordinates gamma, gamma' in (0, T] of
  T^(i alpha (gamma - gamma')) w(gamma - gamma'), with w(u) = 4/(4 + u^2).
  Let b >= 1. Then for all sufficiently large l, as T tends to infinity, the
  integral of F(alpha, T) over alpha from b to b + l lies between
  0.9278 l + o(1) and 1.3302 l + o(1).
statement_formal: |
  0.9278\,\ell+o(1)\ \le\ \int_{b}^{b+\ell}F(\alpha,T)\,d\alpha\ \le\ 1.3302\,\ell+o(1)\qquad (b\ge 1,\ \ell \text{ large},\ T\to\infty)
hypotheses_required: [RH]
status: unlocked
status_note: >
  Montgomery's pair correlation conjecture is equivalent, under RH, to this
  integral being asymptotic to l. According to the paper the previous best
  constants were 1/3 and 2. From this the paper deduces (Corollary 4), for
  the Selberg integral J(beta, T) measuring the variance of primes in short
  intervals, that (0.8376 beta + o(1)) (log T)^2 / T <= J(beta, T) <=
  (1.4283 beta + o(1)) (log T)^2 / T for large beta, and it gives upper and
  lower bounds for the second moment of zeta'/zeta near the critical line
  (Theorem 5). Related entries: zeta-zeros-pair-correlation-counting-bounds
  and zeta-zeros-shifted-form-factor-integral-bounds.
sources:
  - authors: E. Carneiro, V. Chandee, A. Chirre, M. B. Milinovich
    title: "On Montgomery's pair correlation conjecture: a tale of three integrals"
    year: 2022
    venue: Preprint
