    - >-
      The list for p = 11 in Theorem 1.3(1) is printed with the item
      "427499" between 235 and 595, which looks like a missing comma (427,
      499); for that reason the p = 11 list is not reproduced in the
      statement.
    - >-
      The L-functions of the weight 2 newforms involved are those of level
      dividing 4p in the Shimura correspondence setting, twisted by
      quadratic characters; the exact levels were not checked in detail.
