review:
  state: ai-classified
  checked_by: null
  checked_on: null
  confidence: medium
  open_questions:
    - >-
      The paper does not say which L-functions its GRH covers. The code ERH-Dedekind (Kummer fields) is inferred from the fact that the only conditional input is Moree's theorem on primes in a progression with a prescribed primitive root (Proposition 2.2), a Hooley-type result; Moree's paper was not checked.
    - >-
      The proof needs only infinitely many such primes r for each p, not the density, so a weaker hypothesis might suffice.
    - >-
      The subject is combinatorics and coding theory; none of the allowed field values fits well.
