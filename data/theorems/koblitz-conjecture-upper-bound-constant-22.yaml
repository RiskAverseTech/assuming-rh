id: koblitz-conjecture-upper-bound-constant-22
title: Koblitz conjecture upper bound within a factor 22 of the conjectured constant
field: arithmetic-geometry
statement_plain: >
  Let E be an elliptic curve without complex multiplication over a number
  field k, and let t be the least common multiple of the orders of the
  k-rational torsion subgroups of the curves k-isogenous to E. Let P(x) be
  the number of primes p of k of good reduction with norm at most x for
  which |E(F_p)| / t is prime. Then P(x) <= (22 + o(1)) C x / (log x)^2,
  where C = C_{E,k} > 0 is the constant in the conjectured asymptotic
  P(x) ~ C x / (log x)^2.
statement_formal: |
  P_{E,k}(x) \le (22 + o(1))\, C_{E,k}\, \frac{x}{(\log x)^2}
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The paper defines GRH as the statement that the Dedekind zeta function of
  every number field has no zeros with real part greater than 1/2. It is
  used through effective Chebotarev bounds for the division fields of E,
  which are not abelian over the rationals, inside a large sieve for Galois
  representations. The o(1) term depends on E and k. Unconditionally the
  same theorem gives P(x) <= (24 + o(1)) C x / (log x log log x). A
  footnote says a quasi-GRH would give the same bound with 22 replaced by a
  larger constant. Cojocaru had earlier proved P(x) << x / (log x)^2 under
  GRH for curves over the rationals with t = 1, without an explicit
  constant.
sources:
