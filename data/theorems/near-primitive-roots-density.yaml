id: near-primitive-roots-density
title: Density of primes with a near-primitive root of given index
field: analytic-number-theory
statement_plain: >
  Let g be a rational number other than -1, 0, 1 and let t be a positive
  integer. The set of primes p for which the subgroup generated by g modulo p
  has index exactly t in the multiplicative group modulo p has a natural
  density. This density is a rational multiple of Artin's constant and is
  given by an explicit Euler product.
statement_formal: |
  \delta(g,t)=\sum_{n=1}^{\infty}\frac{\mu(n)}{[\mathbb{Q}(\zeta_{nt},g^{1/nt}):\mathbb{Q}]}
hypotheses_required: [ERH-Dedekind]
status: still-conditional
status_note: >
  The series formula for the density is due to Wagstaff (Theorem 2 of the
  paper, quoted from his work); the paper's own contribution, Theorem 3,
  rewrites it as an Euler product in every case. The paper writes only
  "GRH". The density formula is a sum over the degrees of the Kummer fields
  Q(zeta_nt, g^(1/nt)), which are not abelian over the rationals, and the
  argument is of Hooley type.
sources:
