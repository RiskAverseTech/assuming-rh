id: alladi-johnson-constants-mostly-negative
title: "Sign of the constants in the Alladi-Johnson series over smallest prime factors"
field: analytic-number-theory
statement_plain: >
  For coprime l and k, let C(k,l) be the constant such that the sum of
  mu(n) omega(n) / n over n up to X whose smallest prime factor is congruent
  to l mod k equals C(k,l)/log X + O((log log X)^4/(log X)^2). Then for
  large k the number of reduced classes l mod k with C(k,l) >= 0 is
  O(phi(k)/log k), so C(k,l) is negative for a proportion 1 + O(1/log k)
  of the reduced classes.
statement_formal: |
  \#\{\, 1 \le l \le k : (l,k)=1,\ C(k,l) \ge 0 \,\} \ll \frac{\varphi(k)}{\log k}
hypotheses_required: [GRH-Dirichlet]
