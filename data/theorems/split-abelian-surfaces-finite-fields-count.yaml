  open_questions:
    - >-
      The paper writes only "the generalized Riemann hypothesis". That it is needed only for quadratic Dirichlet L-functions is inferred from Lemma 4.4, whose conditional part cites Littlewood's 1927 class number paper, and from the fact that every conditional step in the paper cites Lemma 4.4.
    - >-
      Whether every later "under GRH" step (Propositions 3.1 to 3.5) uses nothing beyond Lemma 4.4 was checked by searching the text, not by reading every proof in full.
