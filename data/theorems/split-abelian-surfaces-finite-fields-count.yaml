id: split-abelian-surfaces-finite-fields-count
title: Counting non-simple principally polarized abelian surfaces over a finite field
field: arithmetic-geometry
statement_plain: >
  Let S(q) be the number of isomorphism classes of principally polarized
  abelian surfaces over the finite field F_q that are not simple over F_q.
  Then for all prime powers q, S(q) / q^(5/2) is bounded above by a constant
  times (log q)^2 (log log q)^4 and below by a positive constant times
  1 / ((log q) (log log q)^6). So the probability that a random
  principally polarized abelian surface over F_q is split is q^(-1/2) up to
  these logarithmic factors.
statement_formal: |
  \frac{1}{(\log q)(\log\log q)^{6}} \ll \frac{\#\mathcal{A}_{2,\text{split}}(\mathbb{F}_q)}{q^{5/2}} \ll (\log q)^{2}(\log\log q)^{4}
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The hypothesis is used only through Littlewood's conditional bound
  h(D) << |D|^(1/2) log log |D| for class numbers of imaginary quadratic
  fields (Lemma 4.4), which rests on the Riemann Hypothesis for the
  L-functions of quadratic Dirichlet characters; see the existing entry on
  Littlewood's bounds for L(1, chi) and class numbers. Unconditionally the
  paper proves the same statement with upper factor
  (log q)^4 (log log q)^2 and lower factor 1 / ((log q)^3 (log log q)^4).
  Although the objects live over finite fields, the hypothesis is the
  classical one over the rationals.
sources:
