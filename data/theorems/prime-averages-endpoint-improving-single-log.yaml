  open_questions:
    - >-
      The paper's one-line description of GRH mentions "an arbitrary L-function", but every use found in the text goes through equation (1.1) for primes in arithmetic progressions, so the entry is coded as zeta and Dirichlet L-functions only. A reviewer should confirm no other L-function is used.
    - >-
      The normalization of the pairing was read from the extracted text: the averages are written with the bracket notation <f>_I = |I|^{-1} sum |f|, so the right side is <f>_I <g>_I Log(<f>_I <g>_I).
