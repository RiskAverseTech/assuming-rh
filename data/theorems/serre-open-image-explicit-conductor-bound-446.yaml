  open_questions:
    - >-
      The paper phrases its hypothesis as GRH for Artin L-functions of Galois extensions. The code ERH-Dedekind is used, as in the Mayle-Wang entry, because the Chebotarev bounds it relies on concern the zeros of the Dedekind zeta function of the Galois field; a reviewer may prefer GRH-Artin.
    - >-
      The arXiv version on disk is dated 31 December 2024, so the year is given as 2024.
