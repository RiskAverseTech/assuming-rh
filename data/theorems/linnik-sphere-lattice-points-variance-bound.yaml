  confidence: medium
  open_questions:
    - >-
      For small m the proof quotes conditional lower bounds for L(1, Sym^2 f) from another paper (Section 3). The theorem's stated hypothesis names only GL(2)/Q and Dirichlet L-functions, so it is unclear whether a Riemann Hypothesis for the symmetric square L-function is also being used; either way the code is GRH-automorphic.
    - >-
      The forms have weight 2m + 2 with m large, so the waiting family is higher-automorphic and not the weight 2 family.
