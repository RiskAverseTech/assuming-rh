  open_questions:
    - >-
      The paper never says which L-functions its GRH covers. The code ERH-Dedekind for Kummer fields is inferred from the cited results of Erdos-Murty and Jarviniemi and the reference to Hooley; those papers were not consulted.
    - >-
      The entry states the case r = 1 as part of the theorem although the paper says that case is known unconditionally (Debes); the conditional content is r at least 2.
