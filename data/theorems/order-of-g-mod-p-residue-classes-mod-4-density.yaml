id: order-of-g-mod-p-residue-classes-mod-4-density
title: Density of primes p for which the order of g modulo p is 1 or 3 modulo 4
field: analytic-number-theory
statement_plain: >
  Let g be a rational number other than -1, 0, 1, written as plus or minus
  g0^h with g0 positive and not an exact power of a rational, and suppose
  h = 1. Let D be the discriminant of Q(sqrt(g0)). For odd j, the set of
  primes p for which the order of g modulo p is congruent to j modulo 4 has
  a natural density. This density is 1/6 for both j = 1 and j = 3, unless D
  is divisible by 8 and has no prime divisor congruent to 1 modulo 4; in
  that case it is given by the explicit formula below, in which A is the
  product over primes p congruent to 3 modulo 4 of
  1 - 2p / ((p^2 + 1)(p - 1)), about 0.6436507.
statement_formal: |
  \delta_g(j,4)=\begin{cases}\dfrac{1}{6}+\operatorname{sgn}(g)\,A_{\psi_1}\,\dfrac{(-1)^{\frac{j+1}{2}}}{8}\displaystyle\prod_{p\mid \frac{D}{8}}\dfrac{2p}{p^3-p^2-p-1} & \text{if } D\neq 8,\\[2ex] \dfrac{7}{48}+\operatorname{sgn}(g)\,A_{\psi_1}\,\dfrac{(-1)^{\frac{j+1}{2}}}{8} & \text{if } D=8,\end{cases}\qquad 8\mid D,\ \text{no prime } p\equiv 1 \pmod 4 \text{ divides } D
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The paper says that instead of GRH it is enough to require the Riemann
  Hypothesis for every field Q(zeta_r, g^(1/s)) with s dividing r. These are
  Kummer fields, not abelian over the rationals. The paper also gives the
  densities for the order modulo 3, for the index of g modulo p in residue
  classes, and quantitative versions with error terms (Theorems 1 and 2).
  The densities of primes with order congruent to 0 or 2 modulo 4 are
  unconditional. For positive integers g the result of Corollary 1 is
  credited to Chinen and Murata. Related entries on the order and index of g
  modulo p: near-primitive-roots-density and
  index-map-preimages-finite-or-positive-density.
