id: least-prime-lambda-root-composite-modulus
title: Least prime primitive root and least prime lambda-root for any modulus
field: analytic-number-theory
statement_plain: >
  For every integer q at least 2, the least prime lambda-root g*(q) modulo q
  (a prime whose multiplicative order mod q is the largest possible; a prime
  primitive root when q has primitive roots) satisfies
  g*(q) << (w log w)^4 (log q)^2, where w is the number of distinct prime
  factors of phi(q) and log w is replaced by 1 when it is smaller than 1.
statement_formal: |
  g^*(q) \ll \bigl(\omega(\phi(q))\,\log_1 \omega(\phi(q))\bigr)^4 (\log q)^2, \qquad \log_1 x = \max\{\log x, 1\}
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The paper needs the hypothesis only for certain nonprincipal Dirichlet
  characters modulo q (those in a set it calls Phi_*(q)). For prime q the
  paper says the bound was already shown by Shoup, improving Wang.
