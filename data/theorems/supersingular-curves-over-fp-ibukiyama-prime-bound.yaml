id: supersingular-curves-over-fp-ibukiyama-prime-bound
title: Bound on the minimal Ibukiyama prime of a supersingular curve over F_p
field: arithmetic-geometry
statement_plain: >
  Let p > 3 be a prime. By a result of Ibukiyama, the endomorphism ring of a
  supersingular elliptic curve over F_p with j-invariant j not equal to 0 or
  1728 is isomorphic to one of two explicit maximal orders O(q) or O'(q)
  attached to a prime q; let q_j be the least such q. Then
  q_j < 10000 p (log p)^6 for every such j.
statement_formal: |
  q_j < 10000\, p \log^6 p \quad \text{for every supersingular } j \in \mathbb{F}_p \setminus \{0, 1728\}
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The proof applies an explicit effective Chebotarev density theorem
  (Grenié and Molteni) to the extensions L_0(zeta_8) and L_1(zeta_8) of the
  rationals, where L_0 and L_1 are ring class fields of orders in
  Q(sqrt(-p)). These fields are Galois but not abelian over the rationals in
  general. The same theorem also gives q_j < 10000 p (log p)^4 for a generic
  j, and asymptotics for the number of j with q_j at most a multiple of
  sqrt(p).
sources:
  - authors: S. Li, Y. Ouyang, Z. Xu
    title: Endomorphism rings of supersingular elliptic curves over $\mathbb{F}_p$
    year: 2019
    venue: Preprint
