    role: conditional-proof
review:
  state: ai-classified
  checked_by: null
  checked_on: null
  confidence: medium
  open_questions:
    - >-
      Theorem 1.2 is stated for p > 3, but the proof of part (3) assumes p > 2000; the paper reports a numerical computation of the maximum of q_j for all p < 2000. A reviewer should confirm that the stated range p > 3 is fully justified.
    - >-
      The paper writes GRH without saying for which L-functions. The code is this draft's reading of the proof, which uses the conditional Chebotarev bound for the fields L_i(zeta_8).
    - >-
      The meaning of "generic" in part (2) of the theorem was not recorded; only part (3) is stated in this entry.
