  checked_by: null
  checked_on: null
  confidence: medium
  open_questions:
    - >-
      The Hecke L-functions over Q(omega) are used inside the cited cubic character sum estimate (Lemma 2.2); which Hecke characters exactly (cubic residue symbols and their twists) was not checked in the cited source.
    - >-
      The formulas for the constants (checked against the PDF, sums over all primes p as printed) evaluate numerically to about 3.72 and 6.65, which does not match the printed values 5.7972 and 9.4207; restricting the sums to primes congruent to 1 mod 3 does not match either. A reviewer should decide which constants are correct.
