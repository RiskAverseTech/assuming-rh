id: almost-ramanujan-graphs-every-degree
title: Almost-Ramanujan expander families of every degree
field: analytic-number-theory
statement_plain: >
  For every integer k at least 3 one can explicitly construct a family of
  k-regular expander graphs, all of which have spectral gap at least
  k - 2 (k - 1)^(1/2 + r(k)), where r(k) = O(log log k / log k).
statement_formal: |
  k - \lambda_2(X_m) \ge k - 2(k-1)^{\frac12 + r(k)}, \qquad r(k) = O\!\left(\frac{\log\log k}{\log k}\right)
hypotheses_required: [RH]
status: unlocked
status_note: >
  The hypothesis enters only through Cramer's conditional bound on gaps
  between consecutive primes, p' - p = O(sqrt(p) log p). The implied constant
  in r(k) is not made explicit.
sources:
