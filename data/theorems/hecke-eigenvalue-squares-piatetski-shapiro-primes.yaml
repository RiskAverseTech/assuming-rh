      Theorem 5 is deduced from the general Theorem 3, whose condition c') also asks for polynomial upper and lower bounds for F(s, chi) to the right of the critical line; Remark 1 says these follow from the Riemann Hypothesis for these L-functions. Whether the proof also needs the prime number theorem for L(Sym^2 G, s) under RH is covered by the same hypothesis (chi trivial), as far as was read.
