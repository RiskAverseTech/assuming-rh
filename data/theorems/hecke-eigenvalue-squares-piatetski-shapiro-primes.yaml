id: hecke-eigenvalue-squares-piatetski-shapiro-primes
title: Squares of Hecke eigenvalues at Piatetski-Shapiro primes for exponents below 12/11
field: analytic-number-theory
statement_plain: >
  Let G be a Hecke eigenform for the full modular group SL_2(Z) with
  normalized Hecke eigenvalues lambda(n), and fix c with 1 < c < 12/11.
  Then the sum of lambda([n^c])^2 over n up to N for which [n^c] is prime is
  asymptotic to N / (c log N) as N tends to infinity.
statement_formal: |
  \sum_{\substack{n \le N \\ [n^c] \in \mathbb{P}}} \lambda\bigl([n^c]\bigr)^2 \sim \frac{N}{c \log N} \qquad (N \to \infty,\ 1 < c < 12/11)
hypotheses_required: [GRH-automorphic]
status: still-conditional
waiting_on: [higher-automorphic]
status_note: >
  The hypothesis is the Riemann Hypothesis for all L-functions
  L(Sym^2 G x chi, s), the symmetric square L-function of the level 1 Hecke
  eigenform G twisted by Dirichlet characters chi. The paper says its
  author previously had the result for 1 < c < 25/24 under the Lindelof
  Hypothesis for the same family.
