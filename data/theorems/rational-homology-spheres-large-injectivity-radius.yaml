id: rational-homology-spheres-large-injectivity-radius
title: Hyperbolic rational homology 3-spheres with arbitrarily large injectivity radius
field: topology
statement_plain: >
  There is an explicit tower of covers N_0 <- N_1 <- N_2 <- ... in which
  each N_n is a hyperbolic rational homology 3-sphere and the injectivity
  radius of N_n tends to infinity. The N_n are congruence covers M_n of an
  arithmetic 3-manifold built from the quaternion algebra over Q(sqrt(-2))
  ramified at the two primes above 3, and the key fact is that the first
  rational cohomology of every M_n vanishes.
statement_formal: null
hypotheses_required: [ERH-Dedekind, PLUS-EXTRA]
status: proved-otherwise
status_note: >
  Calegari and Dunfield proved this assuming GRH and their Conjecture 3.2,
  a strengthening of results of Taylor and others attaching Galois
  representations to automorphic forms on GL_2 over an imaginary quadratic
  field (this is the extra assumption). GRH enters through Odlyzko's
  discriminant bounds, applied to a number field L cut out by a mod 3
  Galois representation of Q(sqrt(-2)), to show that representation is
  reducible (Theorem 4.1); such bounds use the Dedekind zeta function of L,
  which is not abelian over the rationals. The paper itself states that
  Boston and Ellenberg, in the next paper of the same journal volume,
  proved the vanishing of H^1(M_n; Q) unconditionally by pro-p group
  methods, so the result no longer depends on either assumption.
sources:
