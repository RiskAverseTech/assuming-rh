id: mertens-function-bound
title: Square-root growth of the Mertens function
field: analytic-number-theory
statement_plain: >
  The Mertens function M(x), the sum of the Möbius function over the
  integers up to x, grows no faster than x to the power 1/2 + epsilon, for
  every positive epsilon.
statement_formal: |
  M(x) = \sum_{n \le x} \mu(n) = O_\varepsilon\!\left(x^{1/2+\varepsilon}\right) \quad \text{for every } \varepsilon > 0
hypotheses_required: [RH]
status: unlocked
status_note: >
  This bound is equivalent to RH. It is not the stronger Mertens conjecture
  that |M(x)| is below sqrt(x), which Odlyzko and te Riele disproved in 1985.
