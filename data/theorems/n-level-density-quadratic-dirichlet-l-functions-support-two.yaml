    - The entry does not reproduce the explicit formula of Theorem 2.1; a reviewer may want to add it or restrict the entry to Corollary 2.2.
    - The proof of Corollary 2.2 (agreement with the symplectic density for n at most 3) is not in the paper; it is referred to reference [3].
    - The introduction defines GRH for general automorphic L-functions, but the hypothesis appears to be used only for quadratic Dirichlet L-functions. Whether the Riemann zeta function is also needed (for example for square moduli) was not checked line by line; either way the status is unlocked.
