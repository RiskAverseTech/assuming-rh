  open_questions:
    - >-
      The specialization to Dirichlet characters (m = 1, theta = 0, N = q, mu equal to 0 or 1) is my own reading of the general theorem; the paper only says that Dirichlet L-functions of primitive characters are examples of its class and does not write out this case.
    - >-
      The general theorem for automorphic L-functions would need GRH-automorphic and is not recorded here.
