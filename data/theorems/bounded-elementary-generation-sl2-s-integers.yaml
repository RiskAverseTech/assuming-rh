id: bounded-elementary-generation-sl2-s-integers
title: Bounded elementary generation of SL_2 over S-integers with infinitely many units
field: algebraic-number-theory
statement_plain: >
  Let O be the ring of S-integers in a number field k and suppose the unit
  group of O is infinite. Then every matrix in SL_2(O) is a product of at most
  9 elementary matrices.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: proved-otherwise
status_note: >
  Cooke and Weinberger (1975) proved this, with the same bound 9, assuming
  what the cited paper calls a suitable form of the Generalized Riemann
  Hypothesis. Morgan, Rapinchuk and Sury (arXiv 1708.09262) prove it
  unconditionally, using only standard results such as Artin reciprocity and
  the Chebotarev density theorem. They also note an earlier unconditional
  proof by Carter, Keller and Paige (written up by Morris) that gives no
  explicit bound. The code ERH-Dedekind for the Cooke and Weinberger
  hypothesis is a cautious guess and was not checked against their paper.
sources:
  - authors: G. Cooke, P. J. Weinberger
    title: On the construction of division chains in algebraic number rings, with applications to SL_2
    year: 1975
    venue: Comm. Algebra 3, 481-524
    role: conditional-proof
  - authors: A. V. Morgan, A. S. Rapinchuk, B. Sury
    title: Bounded generation of SL_2 over rings of S-integers with infinitely many units
    year: 2018
    venue: Algebra & Number Theory 12, 1949-1974
    doi: 10.2140/ant.2018.12.1949
    url: https://arxiv.org/abs/1708.09262
    hypothesis_location: Theorem 1.1 (unconditional; the conditional history is in the paragraph after it)
    role: unconditional-proof
  - authors: H. W. Lenstra, Jr.
    title: Artin's conjecture on primes with prescribed primitive roots
    year: 1977
    venue: "Sem. Delange-Pisot-Poitou, Theorie des nombres 18 (1976-77), exp. 14"
    url: https://www.numdam.org/item/SDPP_1976-1977__18_1_A11_0/
    hypothesis_location: "Theorem 5.2, which states the Cooke and Weinberger result, and Section 3, which describes their method as a generalization of Hooley's approach"
    role: survey
review:
