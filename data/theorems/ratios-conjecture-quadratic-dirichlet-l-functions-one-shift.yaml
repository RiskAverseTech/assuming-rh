  open_questions:
    - >-
      The paper says only "GRH" without a formal definition; the codes are read from the estimates it records under GRH (Section 2), which concern L(s, chi_n) for quadratic characters. RH is listed because chi_n is principal when n is a square.
    - >-
      Theorem 1.1 is recorded because it is the shortest complete statement; the paper calls Theorem 1.2 the stronger result. The formula was checked against the PDF.
