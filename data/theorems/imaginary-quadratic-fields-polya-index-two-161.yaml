id: imaginary-quadratic-fields-polya-index-two-161
title: There are exactly 161 imaginary quadratic fields with Polya index two
field: algebraic-number-theory
statement_plain: >
  The Polya group Po(K) of a number field K is the subgroup of the class
  group Cl(K) generated by the classes of the products of all prime ideals
  of the same norm. There are exactly 161 imaginary quadratic fields K with
  [Cl(K) : Po(K)] = 2, equivalently with class number equal to twice the
  genus number, and the paper lists them.
statement_formal: |
  \#\bigl\{ K \text{ imaginary quadratic} : [\mathrm{Cl}(K) : \mathrm{Po}(K)] = 2 \bigr\} = 161
hypotheses_required: [RH, GRH-Dirichlet]
status: unlocked
status_note: >
  The hypothesis is used only through Ihara's conditional explicit lower
  bound for the class number of an imaginary quadratic field, which shows
  that the absolute discriminant of such a field is below 3.6 * 10^7 or
  4.1 * 10^8 depending on the residue class; the remaining fields are
  checked by computer. The zeta function of a quadratic field is the product
  of the Riemann zeta function and a quadratic Dirichlet L-function. The
  paper writes only "GRH".
sources:
  - authors: A. Akbary, A. Maarefparvar
    title: Number Fields With Large Pólya Groups
    year: 2025
    venue: Preprint
    url: https://arxiv.org/abs/2508.11125
    hypothesis_location: Theorem 1.13, proved in Section 5.1 from Theorem 5.3
    role: conditional-proof
