id: zeta-critical-strip-log-bound
title: Upper bound for log |zeta(alpha + it)| inside the critical strip
field: analytic-number-theory
statement_plain: >
  For fixed alpha with 1/2 < alpha < 1 and large t, log |zeta(alpha + it)| is
  at most (1/2 + (2 alpha - 1)/(alpha (1 - alpha))) (log t)^(2 - 2 alpha) / log log t
  + log(2 log log t) + O( (log t)^(2 - 2 alpha) / ((1 - alpha)^2 (log log t)^2) ).
  The paper also gives matching forms when alpha tends to 1/2 or to 1 as t
  grows, and a lower bound of the same shape.
statement_formal: |
  \log|\zeta(\alpha+it)| \le \left(\frac12 + \frac{2\alpha-1}{\alpha(1-\alpha)}\right)\frac{(\log t)^{2-2\alpha}}{\log\log t} + \log(2\log\log t) + O\!\left(\frac{(\log t)^{2-2\alpha}}{(1-\alpha)^2(\log\log t)^2}\right)
hypotheses_required: [RH]
status: unlocked
status_note: >
  The displayed bound is the generic case of Theorem 1, which applies when
  neither (alpha - 1/2) log log t nor (1 - alpha) log log t is bounded. The
  result holds for large t with an unspecified implied constant; only the
  leading constant is explicit.
sources:
  - authors: E. Carneiro, V. Chandee
    title: Bounding zeta(s) in the critical strip
    year: 2011
    venue: Journal of Number Theory 131, 363-384
    doi: 10.1016/j.jnt.2010.08.002
