  open_questions:
    - >-
      Hypothesis 3.4 is worded for Dedekind zeta functions and Artin L-functions satisfying Artin's conjecture. The Artin L-functions actually used are abelian ones for subextensions of Q(E[l]), which divide the Dedekind zeta function of Q(E[l]), and Theorem 3.9 is stated for Dedekind zeta functions of the fields Q(E[n]) only, so only ERH-Dedekind is listed.
