  open_questions:
    - >-
      The theorem says "for each K in F(X)"; the entry reads this as all non-Galois cubic fields (all X), which is what the proof needs as X tends to infinity.
    - >-
      The uniformity in p and T in the assumed estimate (1.2) is this entry's reading of "admissible values"; the exact form used in the proof is the multi-prime version (2.3) in Section 2 of the paper.
    - >-
      waiting_on is single-field-zeta although the hypothesis is for a whole family of cubic fields; no family in the list fits better.
