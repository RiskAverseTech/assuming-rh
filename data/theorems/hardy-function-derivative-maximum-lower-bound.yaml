id: hardy-function-derivative-maximum-lower-bound
title: Lower bound for the maximum of a derivative of Hardy's Z-function near T
field: analytic-number-theory
statement_plain: >
  Let Z be Hardy's function. For any fixed C > 1/(2 log 2) and all
  sufficiently large T, with m = floor(C log T log log T), there is a k in
  {1, 3, 5, ..., 2m - 1, 2m} such that the maximum of |Z^(k)(t)| over t in
  [T - 2 pi, T + 2 pi] is at least
  (1 - log log log T / log log T)^k (log sqrt(T / (2 pi)))^k |Z(T)|.
statement_formal: |
  \max_{t\in[T-2\pi,\,T+2\pi]} \bigl|Z^{(k)}(t)\bigr| \ \ge\ \Bigl(1-\frac{\log\log\log T}{\log\log T}\Bigr)^{k} \Bigl(\log\sqrt{\frac{T}{2\pi}}\Bigr)^{k}\, |Z(T)| \quad \text{for some } k \in \{1,3,5,\dots,2m-1,2m\},\ m=\lfloor C\log T\log\log T\rfloor
hypotheses_required: [RH]
status: unlocked
status_note: >
  The paper derives this from the distribution of zeros of Z near T under
  RH (via the bound for S(t+h) - S(t)) and a general theorem about smooth
  functions with prescribed zeros.
