id: monoid-two-three-not-matsuda-positive-type
title: The monoid generated by 2 and 3 is not a Matsuda monoid of any positive type
field: algebraic-number-theory
statement_plain: >
  Let M be the additive monoid of non-negative integers other than 1, and for
  a prime p let E(p) be the set of primes q such that X^q - 1 is reducible in
  the monoid ring F_p[X; M]. Then E(p) is infinite for every prime p, so M is
  not a Matsuda monoid of any positive type. More precisely, E(2) and E(3)
  have natural density 1 - A, where A is Artin's constant, and for odd p the
  subset of q in E(p) for which p generates a subgroup of index 2 modulo q
  has positive natural density (3/4) (2p - 1) / (p^2 - p - 1) A.
statement_formal: |
  \operatorname{dens}E(p)=1-A\ \ (p\in\{2,3\}),\qquad \operatorname{dens}E_2(p)=\frac{3}{4}\cdot\frac{2p-1}{p^2-p-1}\,A\ \ (p\ \text{odd}),\qquad A=\prod_{\ell\ \text{prime}}\left(1-\frac{1}{\ell(\ell-1)}\right)
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The paper states its hypothesis exactly: the Riemann Hypothesis for the
  Dedekind zeta functions of the fields Q(zeta_n, p^(1/n)) for squarefree n,
  and of Q(zeta_4n, p^(1/4n)) for odd squarefree n. These Kummer fields are
  not abelian over the rationals. For p = 2 and 3 the set E(p) is shown to be
  the set of primes q for which p is not a primitive root, so the density
  comes from the dataset entry artin-primitive-root-conjecture (Hooley). For
  odd p the density comes from a generalized Artin conjecture with a
  congruence condition on q, for which the paper cites Lenstra; compare
  near-primitive-roots-density and
  primitive-root-primes-in-progression-density.
