  open_questions:
    - >-
      A reviewer should check whether later work of the same authors on Serre's uniformity problem in the split Cartan case (level p itself, for large p) makes this statement unconditional; if so the status should be proved-otherwise. This paper gives no evidence either way.
    - >-
      Serre's Theoreme 21 is applied to Galois extensions cut out by torsion of two elliptic curves; the code ERH-Dedekind follows the paper's own wording of its hypothesis.
