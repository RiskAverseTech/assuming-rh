id: elkies-curve-mordell-weil-rank-28
title: The Elkies elliptic curve has Mordell-Weil rank exactly 28
field: arithmetic-geometry
statement_plain: >
  Let E28 be the elliptic curve over Q found by Elkies in 2006 with 28
  independent rational points of infinite order. Its Mordell-Weil group
  E28(Q) is isomorphic to Z^28, so the rank is exactly 28. Equivalently for
  the proof, the class group of the cubic subfield K28 of the 2-division
  field of E28 has 2-rank exactly 20.
statement_formal: |
  E_{28}(\mathbb{Q}) \cong \mathbb{Z}^{28}
hypotheses_required: [ERH-Dedekind, GRH-Hecke]
status: still-conditional
waiting_on: [class-group-characters]
status_note: >
  Only part (i) of Theorem 1 is recorded. The paper says (Remarks 1.1 and
  4.1) that for this part GRH is needed for the Dedekind zeta functions of
  the unramified quadratic extensions of the cubic field K28, so that
  Cl(K28)/Cl(K28)^2 is generated by primes below the Bach or Belabas bound.
  Such a zeta function is the product of the zeta function of K28 and the
  Hecke L-function of a quadratic class group character of K28, hence the
  two codes. Part (ii) of Theorem 1 (analytic rank at most 28) is a separate
  statement that needs GRH for the Hasse-Weil L-function of E28, and is not
  part of this entry. The lower bound, 2-rank at least 20, is unconditional.
sources:
