id: artin-conjecture-abelian-varieties-frobenius-condition
title: Artin's conjecture for abelian varieties with a Frobenius condition
field: arithmetic-geometry
statement_plain: >
  Let A be an abelian variety of dimension r over a number field K, let
  a_1, ..., a_g be K-rational points, let F/K be a finite Galois extension
  and C_F a conjugation-stable subset of Gal(F/K). The set of primes P of K
  such that the reduction of A modulo P, divided by the subgroup generated
  by the reduced points, is a product of at most 2r - 1 cyclic groups, and
  such that the Frobenius of P in F/K meets C_F, has a natural density f
  given by an absolutely convergent series. The number of such primes of
  norm up to x is f li(x) + O(x^(5/6) (log x)^(2/3)).
statement_formal: |
  \mathcal{P}_{C_F}(x) = f_{C_F}\,\operatorname{li}(x) + O\!\left(x^{5/6}(\log x)^{2/3}\right),\qquad f_{C_F}=\sum_{k=1}^{\infty}\mu(k)\,\frac{\#\{\sigma\in\operatorname{Gal}(L_kF/K) : \sigma|_F\in C_F,\ \sigma|_{L_k}=\mathrm{id}\}}{[L_kF:K]}
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The theorem assumes GRH for the Dedekind zeta functions of the fields
  L_k F, where L_k = K(A[k], k^(-1) a) is generated by the k-torsion points
  of A and the k-division points of the given points. The hypothesis is used
  through Serre's form of the effective Chebotarev density theorem. These
  division fields are not abelian over the rationals in general. The paper
  says the theorem contains earlier results of Virdol and of Akbal and
  Guloglu as special cases. It does not determine when the density is
  positive.
