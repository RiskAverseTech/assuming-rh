  open_questions:
    - >-
      If some central value vanished the sum would be infinite under the natural convention, so the role of Chowla's conjecture is to make the statement meaningful; a reviewer may prefer to treat it differently from other extra assumptions.
    - >-
      The exponent 2k(2k+1)/2 was read from the extracted text and not checked against the PDF.
