id: argument-of-zeta-extreme-values-resonance
title: Extreme values of the argument of the zeta function and of its integral
field: analytic-number-theory
statement_plain: >
  Let S(t) be 1/pi times the argument of zeta(1/2 + it) and let S_1(t) be the
  integral of S from 0 to t. Fix beta with 0 <= beta < 1. Then there are
  positive constants c and c_1 such that for all large T, the maximum of
  |S(t)| over T^beta <= t <= T is at least
  c sqrt(log T log log log T / log log T), and the maximum of S_1(t) over the
  same range is at least c_1 sqrt(log T log log log T / (log log T)^3).
statement_formal: |
  \max_{T^{\beta}\le t\le T} |S(t)| \ge c\,\sqrt{\frac{\log T\,\log\log\log T}{\log\log T}}, \qquad \max_{T^{\beta}\le t\le T} S_1(t) \ge c_1\,\sqrt{\frac{\log T\,\log\log\log T}{(\log\log T)^{3}}}
hypotheses_required: [RH]
status: unlocked
status_note: >
  Improves Montgomery's conditional Omega result
  S(t) = Omega_{+-}((log t / log log t)^(1/2)) by the factor
  sqrt(log log log t). The same paper's Theorem 1, a lower bound for the
  maximum of |zeta(1/2 + it)|, is unconditional.
