      The entry combines Corollary 1.4 (conditional) with Theorem 1.5
      (unconditional existence); the paper states the combination only in
      prose. The paper has results under GRH for Artin L-functions alone
      (Theorem 1.6, Proposition 1.8), which are not recorded here.
