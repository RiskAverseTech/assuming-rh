id: grid-line-segments-count-error-term-five-halves
title: Error term n^(5/2+epsilon) for counting lattice pairs with given gcd in a square grid
field: analytic-number-theory
statement_plain: >
  For integers n, q >= 1 let f_q(n) be the sum of (n - |i|)(n - |j|) over
  integers i, j with |i|, |j| < n and gcd(i, j) = q. Then
  f_q(n) = 6 n^4 / (pi^2 q^2) + O(n^(5/2 + epsilon)) for every epsilon > 0.
  Since f_q(n)/2 is the number of line segments whose endpoints and exactly
  q - 1 interior points lie in the n by n square grid, that number is
  3 n^4 / (pi^2 q^2) + O(n^(5/2 + epsilon)).
statement_formal: |
  f_q(n) := \sum_{\substack{-n < i, j < n \\ \gcd(i,j) = q}} (n - |i|)(n - |j|) = \frac{6 n^4}{\pi^2 q^2} + O\!\left(n^{5/2+\varepsilon}\right)
hypotheses_required: [RH]
status: unlocked
status_note: >
  Unconditionally the paper gets the error term
  O(n^3 exp(-A (log n)^(3/5) (log log n)^(-1/5))). RH enters through the
  bound O(m^(3/2 + epsilon)) for the summed error term in the average order
  of Euler's totient function. The paper says the cases q = 1 and q = 2 were
  proved earlier by Ernvall-Hytonen, Matomaki, Haukkanen and Merikoski.
sources:
