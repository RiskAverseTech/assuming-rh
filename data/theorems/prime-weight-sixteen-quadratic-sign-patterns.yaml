id: prime-weight-sixteen-quadratic-sign-patterns
title: Prime weight in short intervals for sixteen quadratic sign patterns
field: analytic-number-theory
statement_plain: >-
  Let log L be at least 366 and let h be at least L/(log L)^10. Fix the four Legendre symbols (p/r) for r = 547, 727, 571 and 599, each with value +1 or −1. Among primes p in (L, L+h] congruent to 1 or −1 modulo 16 with those signs, the sum of log p lies strictly between h/65 and h/63.
statement_formal: |
  R=(547,727,571,599),\quad \varepsilon\in\{-1,1\}^4,\qquad
  \frac{h}{65}<\sum_{\substack{L<p\le L+h,\ p\ \mathrm{prime}\\ p\equiv\pm1\pmod{16},\ \bigl(\left(\frac{p}{r}\right)\bigr)_{r\in R}=\varepsilon}}\log p<\frac{h}{63}
  \quad\left(\log L\ge366,\ h\ge\frac{L}{(\log L)^{10}}\right).
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >-
  Grenié and Molteni’s Theorem 1.1 bounds the error in each residue class of a cyclotomic field. Dirichlet GRH supplies the required hypothesis on its Dedekind zeta function. The prime number theorem in fixed progressions also gives the two inequalities for all sufficiently large L, with no explicit starting point.
