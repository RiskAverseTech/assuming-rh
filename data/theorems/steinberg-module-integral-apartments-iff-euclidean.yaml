id: steinberg-module-integral-apartments-iff-euclidean
title: The Steinberg module of a number ring is generated by integral apartments exactly when the ring is Euclidean
field: topology
statement_plain: >
  Let O_K be the ring of integers of a number field K and let n >= 2. The
  Steinberg module St_n(K) is generated by integral apartment classes if and
  only if O_K is Euclidean.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The hypothesis enters only through Weinberger's theorem (see the entry
  euclidean-number-rings) that every number ring has class number greater
  than 1, is Euclidean, or is imaginary quadratic. The other ingredients
  are unconditional: Ash and Rudolph (Euclidean rings), Church, Farb and
  Putman (class number greater than 1), and this paper's Theorem 1.1 for
  the four imaginary quadratic rings that are principal ideal domains but
  not Euclidean (d = -19, -43, -67, -163).
