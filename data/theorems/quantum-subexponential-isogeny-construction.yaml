id: quantum-subexponential-isogeny-construction
title: Quantum subexponential algorithm for isogenies between ordinary elliptic curves
field: computational-number-theory
statement_plain: >
  Given two ordinary elliptic curves over F_q that are isogenous and have the
  same endomorphism ring of known discriminant, a quantum algorithm finds an
  ideal class whose action carries one curve to the other (and hence an
  isogeny between them) in time L_q(1/2, sqrt(3)/2), where
  L_q(1/2, c) = exp((c + o(1)) sqrt(ln q ln ln q)). A variant using only
  polynomial space runs in time L_q(1/2, sqrt(3)/2 + sqrt(2)).
statement_formal: |
  L_q\!\left(\tfrac12, \tfrac{\sqrt3}{2}\right) = \exp\!\left(\left(\tfrac{\sqrt3}{2}+o(1)\right)\sqrt{\ln q\,\ln\ln q}\right)
hypotheses_required: [GRH-Hecke]
status: still-conditional
waiting_on: [class-group-characters]
status_note: >
  The hypothesis is used for the running time. The analysis rests on the
  theorem of Jao, Miller and Venkatesan that random short products of small
  primes are nearly uniformly distributed in the class group of an imaginary
  quadratic order (Theorem 2.1 of the paper), which needs the hypothesis for
  L-functions of class group characters, and on Bach's bound 6 (ln |D|)^2 for
  generators of the class group. The paper stresses that no heuristic
  assumption is needed besides the hypothesis. The same analysis gives a
  classical algorithm that evaluates the action of an ideal class on a curve
  in time L_q(1/2, sqrt(3)/2) (Corollary 4.7).
