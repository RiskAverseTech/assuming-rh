id: class-group-generators-norm-bound-below-4
title: Class group generated by prime ideals of norm below 4 (log Delta)^2
field: algebraic-number-theory
statement_plain: >
  Let K be a number field of degree n with absolute discriminant D, and let
  T_K be the least T such that the classes of the prime ideals of norm at
  most T generate the class group of K. Then
  T_K <= (4 - 1/(2n) + 1/(2n^2)) (log D)^2 for every K. Moreover
  T_K <= (4 - 1/(2n)) (log D)^2 when n >= 5, and also when n is 2, 3 or 4 and
  log D is at most 63, 353, 833 respectively or at least 12184, 18455, 27911
  respectively.
statement_formal: |
  T_K \le \Bigl(4 - \frac{1}{2n} + \frac{1}{2n^2}\Bigr)\log^2\Delta
hypotheses_required: [GRH-Hecke, ERH-Dedekind]
status: still-conditional
waiting_on: [single-field-zeta, class-group-characters]
status_note: >
  This sharpens the entry class-group-generators-norm-bound-4-01 (constant
  4.01, by the same authors) and is the first bound with a constant below 4.
  The proof compares the explicit formulas for the Dedekind zeta function of
  K and for the L-function of a non-trivial class group character that is
  trivial on the small prime ideals; GRH is used for both. Class group
  characters are Hecke characters and in general not Dirichlet characters,
  even for quadratic fields, so nothing here is covered. The paper also
  proves bounds with constants 4 - 2/(3n) and 4 - 2/(3n) + 3/(8n^2) for
  generating the subgroup of squares of the class group.
