id: arithmetic-progressions-in-product-sets-complex-numbers
title: Arithmetic progressions in product sets of complex numbers have length O(n^(1+epsilon))
field: additive-number-theory
statement_plain: >
  Let B be a set of n complex numbers and let B.B be the set of all products
  b b' with b, b' in B. Then for every epsilon > 0 the longest arithmetic
  progression contained in B.B has length at most O_epsilon(n^(1 + epsilon)).
statement_formal: |
  B \subset \mathbb{C},\ |B| = n \ \Longrightarrow\ \text{every arithmetic progression in } B\cdot B \text{ has length } O_{\varepsilon}\!\left(n^{1+\varepsilon}\right)
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The paper writes only "GRH". The hypothesis enters through the effective
  Chebotarev density theorem of Lagarias and Odlyzko, applied to the
  splitting field over Q of an irreducible integer polynomial, to get a
  lower bound for the number of primes modulo which the polynomial has a
  root. For sets of natural numbers the same paper proves the bound
  O(n log n) unconditionally, and it says the earlier unconditional bound
  for complex numbers was O(n^(3/2)).
sources:
