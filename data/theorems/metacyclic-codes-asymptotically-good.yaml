  open_questions:
    - >-
      The result is in coding theory; the schema has no matching field
      value, so analytic-number-theory was used because the hypothesis
      enters through Artin's primitive root conjecture in arithmetic
      progressions.
    - >-
      The paper mentions Heath-Brown's unconditional result for all but two
      unspecified prime values of a; whether it gives the needed primes in
      the progression 1 mod s for some q is not discussed in the paper.
