id: quadratic-iterates-irreducibility-second-implies-tenth
title: Irreducibility of the tenth iterate of x^2 + c from the second
field: arithmetic-geometry
statement_plain: >
  Let c be a rational number and f_c(x) = x^2 + c. If the second iterate of
  f_c is irreducible over the rationals, then so is the tenth iterate. The
  key conditional step is that A_7(c), the seventh iterate evaluated at 0,
  is a square in the rationals only for c = 0; equivalently the genus 31
  hyperelliptic curve y^2 = a_7(x) has only three rational points.
statement_formal: |
  f_c^{\circ 2} \text{ irreducible over } \mathbb{Q} \implies f_c^{\circ 10} \text{ irreducible over } \mathbb{Q}, \qquad f_c(x) = x^2 + c,\ c \in \mathbb{Q}
hypotheses_required: [GRH-Hecke]
status: still-conditional
waiting_on: [class-group-characters]
status_note: >
  The same theorem proves unconditionally that irreducibility of the second
  iterate implies irreducibility of the sixth, and that irreducibility of
  the seventh implies irreducibility of the tenth. Only the step from the
  sixth to the seventh iterate depends on the hypothesis. There it is used
  solely to verify (with Magma) that the degree 63 number field obtained by
  adjoining a root of a_7 has trivial class group (odd class number is
  enough), which enters a 2-Selmer group computation. The paper does not
  define the hypothesis further. Conditional class group computations rely
  on GRH bounds for the norms of prime ideals generating the class group,
  which is a statement about L-functions of class group characters of that
  field. The paper says the Minkowski bound is far too large for an
  unconditional computation to be feasible.
