id: explicit-bounds-for-l-functions-at-one
title: Explicit bounds for L-functions at s = 1 in terms of the analytic conductor
field: analytic-number-theory
statement_plain: >
  Let L(s, f) be an L-function of degree d with analytic conductor C(f), in
  a class that includes L-functions of cuspidal automorphic forms on GL(n).
  If log C(f) >= 23 d, then |L(1, f)| <= 2^d e^(d gamma) (y^d + (d/2)
  y^(d-1) + (d K(d)/4) y^(d-2)), where y = log log C(f) - log(2d) and K(d) =
  2.31 + (22.59/d)(e^(0.31 d) - 1 - 0.31 d). The paper also gives a matching
  explicit upper bound for 1/|L(1, f)|.
statement_formal: |
  |L(1,f)| \le 2^d e^{d\gamma}\left( y^d + \frac{d}{2}\,y^{d-1} + \frac{d\,K(d)}{4}\,y^{d-2} \right), \qquad y = \log\log C(f) - \log 2d, \quad \log C(f) \ge 23d
hypotheses_required: [GRH-automorphic, PLUS-EXTRA]
status: still-conditional
status_note: >
  The extra assumption is the Ramanujan-Petersson conjecture for L(s, f),
  and the Riemann hypothesis is assumed for L(s, f) itself. The paper notes
  that Ramanujan-Petersson is known for Hecke cusp forms of weight k >= 1 by
  Deligne and Deligne-Serre (Corollary 1.2), so that degree 2 case needs
  only the Riemann hypothesis for L(s, f), which is still not covered. For
  degree 1 the paper remarks that the theorem essentially recovers the bound
  of Lamzouri, Li and Soundararajan for primitive Dirichlet characters,
  which needs only GRH for Dirichlet L-functions. That special case is not
  what this entry records.
sources:
  - authors: A. Lumley
    title: "Explicit bounds for L-functions on the edge of the critical strip"
    year: 2018
    venue: Journal of Number Theory 188, 186-209
