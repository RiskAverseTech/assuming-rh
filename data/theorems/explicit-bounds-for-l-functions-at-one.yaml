  open_questions:
    - >-
      The theorem is stated for an axiomatically defined class of L-functions, not only automorphic ones. The code GRH-automorphic is the closest available code.
    - >-
      Should the degree 1 case for Dirichlet characters be split out as a separate unlocked entry, or is it already covered by an entry on the Lamzouri, Li and Soundararajan bound?
