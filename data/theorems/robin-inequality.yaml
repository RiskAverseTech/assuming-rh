id: robin-inequality
title: Robin's inequality for the sum of divisors
field: analytic-number-theory
statement_plain: >
  For every integer n above 5040, the sum of the divisors of n is less than
  e^gamma times n log log n, where gamma is the Euler-Mascheroni constant.
statement_formal: |
  \sigma(n) < e^{\gamma}\, n \log\log n \qquad (n > 5040)
hypotheses_required: [RH]
status: unlocked
status_note: >
  This inequality is equivalent to RH.
  The equivalence between RH and Robin's inequality for every n above 5040
  is formalized in Lean 4 in the repository cited below, stated with
  Mathlib's own definition of the Riemann Hypothesis. This project built
  that repository from source on 25 November 2026 and confirmed that the
  theorem compiles and depends only on Lean's three standard axioms. What
  is checked is the implication between RH and this inequality. It is not a
  check of the announced proof of RH, and it was run by an AI system, not
  reviewed by a person.
