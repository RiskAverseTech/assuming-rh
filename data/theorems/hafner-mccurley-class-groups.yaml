id: hafner-mccurley-class-groups
title: Subexponential class group computation for imaginary quadratic fields
field: computational-number-theory
statement_plain: >
  There is a probabilistic algorithm that computes the structure of the
  class group of the imaginary quadratic field of discriminant -d in
  expected time L(d)^(sqrt(2) + o(1)), where
  L(d) = exp(sqrt(log d log log d)).
statement_formal: null
hypotheses_required: [GRH-Hecke]
status: still-conditional
waiting_on: [class-group-characters]
status_note: >
  This differs from the first expectation that the result would be unlocked
  because the field is quadratic. The paper invokes the hypothesis through
  its Theorem 2, quoted from Schoof: the prime forms with p up to a constant
  times (log d)^2 generate the class group. That is the quadratic case of
  Bach's bound, which rests on L-functions of class group characters. Those
  are Hecke characters, not Dirichlet characters. See the entry on Bach's
  bound.
sources:
