  open_questions:
    - >-
      The paper never defines GRH; the code ERH-Dedekind is inferred from its use in discriminant lower bounds and class group computations. Class group computations under GRH may also rest on Hecke L-functions, depending on the software's method, which the paper does not describe.
    - >-
      No waiting_on family describes discriminant bounds for non-abelian fields exactly; galois-extensions is the closest.
