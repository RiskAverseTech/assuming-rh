id: smooth-solutions-a-plus-b-equals-c-asymptotic
title: Asymptotic count of smooth solutions of a + b = c
field: analytic-number-theory
statement_plain: >
  Let N(x, y) be the number of triples (a, b, c) of positive integers up to
  x, all of whose prime factors are at most y, with a + b = c, and let
  N*(x, y) count those that are also coprime. Fix epsilon > 0. As x and y
  tend to infinity with (log x)^(8 + epsilon) <= y <= x,
  N(x, y) ~ S0(alpha) S1(alpha) Psi(x, y)^3 / x and
  N*(x, y) ~ S0(alpha) S1(alpha) Psi(x, y)^3 / (zeta(3 alpha - 1) x), where
  Psi(x, y) counts y-smooth integers up to x, alpha = alpha(x, y) is the
  saddle point defined by sum_{p <= y} log p / (p^alpha - 1) = log x, S0 is
  an explicit double integral (the archimedean density) and S1 an explicit
  Euler product (the singular series).
statement_formal: |
  \begin{gathered}
  N(x,y) = \mathfrak{S}_0(\alpha)\,\mathfrak{S}_1(\alpha)\,\frac{\Psi(x,y)^3}{x}\,\{1 + o(1)\}, \qquad (\log x)^{8+\varepsilon} \le y \le x, \\
  \mathfrak{S}_0(\alpha) = \alpha^3 \iint_{t_1, t_2 > 0,\ t_1 + t_2 \le 1} \bigl(t_1 t_2 (t_1 + t_2)\bigr)^{\alpha - 1}\, dt_1\, dt_2, \qquad
  \mathfrak{S}_1(\alpha) = \prod_p \left(1 + \frac{p-1}{p\,(p^{3\alpha-1}-1)} \left(\frac{p - p^{\alpha}}{p-1}\right)^{3}\right)
  \end{gathered}
hypotheses_required: [RH, GRH-Dirichlet]
status: unlocked
status_note: >
  The paper's hypothesis (Conjecture 1.2) is that the non-trivial zeros of
  the Riemann zeta function and of all Dirichlet L-functions have real part
  1/2. This sharpens Lagarias and Soundararajan, who under the same
  hypothesis obtained the right-hand sides only as lower bounds and only for
  y <= exp((log x)^(1/2 - epsilon)). The paper also gives (Theorem 1.3) a
  version with smooth weights and relative error O(1/u), u = log x / log y.
