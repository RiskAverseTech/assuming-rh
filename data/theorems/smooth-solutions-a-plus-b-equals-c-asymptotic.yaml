  open_questions:
    - >-
      Theorem 1.5 says 'if the Riemann hypothesis is true'; from the surrounding text (Conjecture 1.2 and the proof via Theorem 1.3) this means the generalized hypothesis for zeta and all Dirichlet L-functions, and the entry is coded that way.
    - >-
      The formulas for S0 and S1 were transcribed from the extracted text of the paper (which is in French) and should be checked against the PDF. In the coprime count the paper writes S1*(alpha) = S1(alpha) / zeta(3 alpha - 1).
