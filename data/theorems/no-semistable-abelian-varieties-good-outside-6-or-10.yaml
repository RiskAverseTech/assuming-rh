id: no-semistable-abelian-varieties-good-outside-6-or-10
title: No semistable abelian varieties over Q with good reduction outside 6 or outside 10
field: arithmetic-geometry
statement_plain: >
  An abelian variety over Q with everywhere semistable reduction and good
  reduction outside 2 and 3 has dimension 0. The same holds with good
  reduction outside 2 and 5. Combined with results of Fontaine, Brumer and
  Kramer, and Schoof, this shows that for squarefree N a non-zero semistable
  abelian variety over Q with good reduction outside N exists exactly when N
  is not one of 1, 2, 3, 5, 6, 7, 10, 13.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The theorems are stated under "the GRH discriminant bounds of Odlyzko".
  These are lower bounds for the root discriminant of a number field that
  assume the Riemann Hypothesis for its Dedekind zeta function. They are
  applied to the Galois extensions L of Q generated by the points of finite
  flat group schemes (torsion of the hypothetical abelian variety), to bound
  the degree [L : Q]; the paper notes that the unconditional Odlyzko bounds
  are not strong enough here because the root discriminant estimates (for
  example 31.349) exceed the unconditional limit 22.38. The fields involved
  are not known in advance to be abelian over Q. The earlier cases N = 1, 2,
  3, 5, 7, 13 are unconditional.
