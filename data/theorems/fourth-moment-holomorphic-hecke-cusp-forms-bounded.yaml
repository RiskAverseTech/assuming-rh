id: fourth-moment-holomorphic-hecke-cusp-forms-bounded
title: The fourth moment of holomorphic Hecke cusp forms is bounded
field: analytic-number-theory
statement_plain: >
  Let f be a holomorphic Hecke cusp form of even weight k for SL_2(Z),
  normalized so that F(z) = f(z) y^(k/2) has L^2 norm 1 on the modular
  surface. Then there is a universal constant C such that the integral of
  |f(z)|^4 y^(2k) with respect to dx dy / y^2 over the modular surface is at
  most C for all sufficiently large k.
statement_formal: |
  \int_{\Gamma\backslash\mathbb{H}} |f(z)|^4\, y^{2k}\, \frac{dx\,dy}{y^2} \le C \qquad \text{for all sufficiently large } k
hypotheses_required: [GRH-automorphic]
status: still-conditional
waiting_on: [higher-automorphic]
status_note: >
  The paper assumes the Riemann Hypothesis for the degree 8 triple product
  L-functions L(s, f x f x g), where g runs over Hecke cusp forms of weight
  2k for the full modular group, and for the symmetric square L-function
  L(s, sym^2 f). The best unconditional bound quoted in the paper is
  k^(1/3 + epsilon), due to Blomer, Khan and Young.
