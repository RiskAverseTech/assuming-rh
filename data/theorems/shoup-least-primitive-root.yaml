id: shoup-least-primitive-root
title: Least primitive root modulo p is polynomial in log p
field: analytic-number-theory
statement_plain: >
  The least primitive root modulo a prime p is O(r^4 (log r + 1)^4 (log p)^2),
  where r is the number of distinct prime factors of p - 1. In particular it
  is O((log p)^6).
statement_formal: |
  g(p) = O\!\left(r^4(\log r + 1)^4(\log p)^2\right), \qquad r = \omega(p-1)
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  Earlier conditional bounds are due to Ankeny (1952) and Wang (1961). The
  result is for prime fields only.
sources:
  - authors: V. Shoup
    title: Searching for primitive roots in finite fields
    year: 1992
    venue: Math. Comp. 58, 369-380
