id: psi-theta-error-bound-lee-nosal
title: "Explicit bounds for psi(x) - x and theta(x) - x with a log log saving"
field: analytic-number-theory
statement_plain: >
  The Chebyshev function psi(x) differs from x by at most
  sqrt(x) log x (log x - log log x) / (8 pi) for every x at least 101, and
  the same bound holds for theta(x) - x for every x at least 2657.
statement_formal: |
  |\psi(x) - x| \le \frac{\sqrt{x}\,\log x\,(\log x - \log\log x)}{8\pi} \quad \text{for all } x \ge 101
