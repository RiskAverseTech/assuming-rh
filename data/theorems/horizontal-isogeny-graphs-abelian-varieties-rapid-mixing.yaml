  open_questions:
    - >-
      The paper never says which L-functions its hypothesis covers. Hecke L-functions of ray class characters is read from the proof of Theorem 1.2 (Section 3.2); the cited theorem of Iwaniec and Kowalski was not consulted.
    - >-
      The statement of Theorem 1.1 writes N(fm) with m an ideal in O introduced just before the theorem; the role of m is as printed there.
