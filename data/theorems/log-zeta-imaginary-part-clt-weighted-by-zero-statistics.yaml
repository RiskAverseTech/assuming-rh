  open_questions:
    - "Theorem 1.2 as printed has main term mu_l mu_k sigma^k (log log T)^(l/2), while Corollary 1.4 normalizes by sqrt((1/2) log log T); the two differ by a factor 2^(-l/2). The entry records the corollary; a reader should check which normalization is intended."
