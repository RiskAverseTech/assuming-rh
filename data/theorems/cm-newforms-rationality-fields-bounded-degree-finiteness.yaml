id: cm-newforms-rationality-fields-bounded-degree-finiteness
title: Finiteness of rationality fields of bounded degree for CM newforms of fixed weight
field: algebraic-number-theory
statement_plain: >
  Fix a weight k >= 2 and a degree d >= 1. There are only finitely many
  number fields K of degree d that occur as the field generated by the
  Fourier coefficients of a weight k newform with complex multiplication
  and trivial nebentypus.
statement_formal: null
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The hypothesis is the Extended Riemann Hypothesis for quadratic Dirichlet
  characters. It is used only to guarantee that there are finitely many
  imaginary quadratic fields whose class group has a given exponent (Boyd
  and Kisilevsky); such a form has CM by a field of exponent dividing
  (k - 1) d. The paper states that the result holds unconditionally when
  k = 2 and d <= 6, or when (k - 1) d is a power of 2 or 3 times a power of
  2. Under the same hypothesis the paper also lists all quadratic and cubic
  rationality fields of weight 2 CM forms with trivial nebentypus: 23
  quadratic and 18 cubic fields (Theorem 2). The entry
  cm-newforms-rational-coefficients-finiteness is the analogous earlier
  result of Schütt for rational coefficients, up to twisting.
