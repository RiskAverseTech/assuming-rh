  open_questions:
    - >-
      Theorem 1.2 does not state the range of h. Lemma 6.1 (F_h <= F) is stated for all alpha and h, but whether the upper bounds 9 and 6 are uniform in all real h or only for 0 < h <= A as in Theorem 1.1 should be checked.
    - >-
      The paper's headline result is Theorem 1.1, which needs the extra twin prime hypothesis; the choice to record Theorem 1.2 instead is a judgment call.
