id: carmichael-number-recognition-in-polynomial-time
title: Recognizing Carmichael numbers is in P, with unconditionally correct output
field: complexity-theory
statement_plain: >
  There is a deterministic algorithm that decides whether a given integer n
  is a Carmichael number and runs in time polynomial in log n. When n is a
  Carmichael number the algorithm finds its complete prime factorization,
  using Fermat tests to the bases b < 2 (log n)^2, so its answers are
  always correct.
statement_formal: null
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The paper's hypothesis is the Extended Riemann Hypothesis, used only for
  the running time: correctness is unconditional. It is invoked through
  Theorem 1.4.5 of Crandall and Pomerance (reference [8]) to guarantee that
  for distinct primes q1, q2 some b < 2 (log q1 q2)^2 is a square modulo one
  and not the other, or a non-square modulo q2. These are statements about
  small elements outside proper subgroups of the multiplicative group modulo
  an integer, which is the Dirichlet L-function case. The paper does not
  spell out which L-functions it means by ERH.
