id: zeta-moments-harper-bound-explicit-k-dependence
title: Explicit dependence on k in the sharp upper bound for zeta moments
field: analytic-number-theory
statement_plain: >
  Let k >= 0 be fixed. For all large T, the integral of
  |zeta(1/2 + it)|^(2k) over T <= t <= 2T is at most an absolute constant
  times exp(exp(18.63 k)) T (log T)^(k^2).
statement_formal: |
  \int_T^{2T} \left|\zeta\left(\tfrac12+it\right)\right|^{2k} dt \ll e^{e^{18.63k}}\, T(\log T)^{k^2} \quad \text{with an absolute implied constant}
hypotheses_required: [RH]
status: unlocked
status_note: >
  This sharpens the entry zeta-moments-sharp-upper-bound-harper: Harper's
  bound C(k) T (log T)^(k^2) has C(k) = exp(exp(O(k))), and this paper
  makes the O(k) explicit as 18.63 k by optimizing the steps of Harper's
  proof.
sources:
