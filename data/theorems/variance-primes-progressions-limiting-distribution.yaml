    - >-
      The entry combines Proposition 1.8 (needs GRH and LI) with the mean and variance from Theorem 1.2 (needs GRH only). A reviewer may prefer to record only one of them.
    - >-
      The paper's main purpose is to support a conjecture (Hooley's conjecture V(x; q) ~ x log q down to q around log log x); that conjecture is not proved and is not part of this entry.
