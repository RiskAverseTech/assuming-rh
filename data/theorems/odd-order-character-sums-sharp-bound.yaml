id: odd-order-character-sums-sharp-bound
title: Sharp upper bound for maximal sums of odd order Dirichlet characters
field: analytic-number-theory
statement_plain: >
  Let g >= 3 be a fixed odd integer and chi a primitive Dirichlet character
  modulo q of order g. Then M(chi) = max_t |sum_{n <= t} chi(n)| is at most a
  constant times
  sqrt(q) (log log q)^(1 - delta_g) (log log log log log q)^(delta_g) / (log log log q)^(1/4),
  where delta_g = 1 - (g/pi) sin(pi/g).
statement_formal: |
  M(\chi) \ll \sqrt{q}\,\frac{(\log\log q)^{1-\delta_g}(\log\log\log\log\log q)^{\delta_g}}{(\log\log\log q)^{1/4}},
  \qquad \delta_g = 1-\frac{g}{\pi}\sin\frac{\pi}{g}
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  This sharpens the conditional bound of Lamzouri and Mangerel. The paper
  also proves unconditionally (Theorem 1.2) that the bound is attained for
  infinitely many characters, so it is sharp up to the implied constant.
