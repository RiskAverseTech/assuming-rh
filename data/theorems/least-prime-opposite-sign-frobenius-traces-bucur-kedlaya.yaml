    - >-
      PLUS-EXTRA is listed for the analytic continuation and functional equation parts of Conjecture 1.1. Over a totally real K the paper says these are known, so for such K the entry needs only the Riemann Hypothesis part; a reviewer may prefer to drop PLUS-EXTRA.
    - >-
      ERH-Dedekind is listed because the case i = j = 0 is the Dedekind zeta function of K; for K = Q this is the Riemann zeta function.
