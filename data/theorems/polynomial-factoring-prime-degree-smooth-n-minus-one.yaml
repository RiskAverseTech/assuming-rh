    - >-
      The paper writes only "GRH" and does not define it. The code GRH-Hecke is this project's reading of what finding r-th nonresidues in extension fields F_q requires; if nonresidues are only ever needed in prime fields, Dirichlet L-functions would suffice and the entry would be unlocked.
