id: kaplansky-ternary-forms-represent-all-odd-integers
title: Three ternary quadratic forms that represent all positive odd integers
field: analytic-number-theory
statement_plain: >
  Each of the ternary quadratic forms x^2 + 2y^2 + 5z^2 + xz,
  x^2 + 3y^2 + 6z^2 + xy + 2yz and x^2 + 3y^2 + 7z^2 + xy + xz represents
  every positive odd integer.
statement_formal: null
hypotheses_required: [GRH-Dirichlet, GRH-automorphic]
status: still-conditional
status_note: >
  These are the three candidates left open from Kaplansky's list (the paper's
  Conjecture 1). The proof follows the method of Ono and Soundararajan as
  refined by Chandee: it needs the hypothesis for quadratic Dirichlet
  L-functions, to bound class numbers from below, and for the L-functions of
  quadratic twists of weight 2 newforms, through Waldspurger's theorem. The
  second part is not covered. The same paper proves that, given this
  statement, a positive-definite integer-valued quadratic form represents all
  positive odd integers if and only if it represents 46 specific odd integers
  up to 451 (Theorem 2, the 451-Theorem).
sources:
