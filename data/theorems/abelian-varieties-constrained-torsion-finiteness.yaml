id: abelian-varieties-constrained-torsion-finiteness
title: Finiteness of abelian varieties with constrained l-power torsion (Rasmussen-Tamagawa conjecture)
field: arithmetic-geometry
statement_plain: >
  Fix a number field K and an integer g > 0. For a prime l, consider the
  isomorphism classes of g-dimensional abelian varieties A over K whose
  l-power torsion field K(A[l^infinity]) lies in the maximal pro-l extension
  of K(mu_{l^infinity}) unramified away from l. Then the set of pairs
  (class of A, l) of this kind is finite; equivalently, such abelian
  varieties exist for only finitely many primes l.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: partial
waiting_on: [galois-extensions]
status_note: >
  Theorem 5.1 assumes, for all large l, GRH for the Dedekind zeta functions
  of the fields L K~, where L is a subfield of Q(mu_l) and K~ is the Galois
  closure of K over the rationals. It is used through the effective
  Chebotarev theorem of Lagarias and Odlyzko. When K is abelian over the
  rationals, in particular when K is the field of rational numbers, every
  such field L K~ is abelian over the rationals, so its zeta function is a
  product of Dirichlet L-functions and that case is covered. For other K
  the fields are not abelian and the result stays conditional. The paper
  also proves unconditionally the semistable version (Theorem 3.6) and
  several cases of small degree and dimension.
  A later paper (Ishii, 2025) proves the case of abelian fivefolds over the
  rationals without the hypothesis.
