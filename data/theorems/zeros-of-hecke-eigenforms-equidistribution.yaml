  open_questions:
    - >-
      The move to proved-otherwise rests on the abstract of the Holowinsky and Soundararajan paper (only the abstract was read) together with this paper's own statement that the step from mass equidistribution to zeros is unconditional.
    - >-
      Mass equidistribution for holomorphic Hecke eigenforms of growing weight was later proved without any hypothesis (Holowinsky and Soundararajan, 2010), which combined with Theorem 2 of this paper would make the statement unconditional. The paper on disk predates that work and does not name it, so the status here is left as still-conditional; a reviewer should probably change it to proved-otherwise and add that source.
    - >-
      The proof of Theorem 1 in the paper is only a sketch (Section 4) that refers to Sarnak and Watson for the link between the hypothesis and mass equidistribution.
