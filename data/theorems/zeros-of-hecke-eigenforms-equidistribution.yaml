id: zeros-of-hecke-eigenforms-equidistribution
title: "Zeros of Hecke eigenforms equidistribute as the weight grows"
field: analytic-number-theory
statement_plain: >
  Let f_k be a sequence of cuspidal Hecke eigenforms for SL2(Z) of weight k.
  As k tends to infinity, the zeros of f_k become equidistributed in the
  modular domain SL2(Z)\H with respect to the normalized hyperbolic measure
  (3/pi) dx dy / y^2: the proportion of inequivalent zeros lying in a nice
  compact set tends to its relative hyperbolic area.
statement_formal: null
hypotheses_required: [GRH-automorphic]
status: proved-otherwise
status_note: >
  Now known without any hypothesis: Holowinsky and Soundararajan (2008)
  prove the mass equidistribution conjecture of Rudnick and Sarnak for Hecke
  eigenforms, which is the only step where this paper used the hypothesis.
  What follows describes the earlier conditional proof.
  The paper says the hypothesis is the Generalized Riemann Hypothesis "for
  certain automorphic L-functions". In the sketch of proof these are the
  Rankin-Selberg L-functions L(s, f_k x f_k) (periods against Eisenstein
  series) and the triple product L-functions L(1/2, g x f_k x f_k) with g a
  Hecke-Maass cusp form (via Watson's formula). The hypothesis is used only
  to get equidistribution of the masses y^k |f_k|^2 dV; the passage from
  mass equidistribution to zeros (Theorem 2) is unconditional. The paper
  notes the result is unconditional for CM forms.
sources:
