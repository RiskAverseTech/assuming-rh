id: chebyshev-bias
title: Chebyshev's bias in prime number races
field: analytic-number-theory
statement_plain: >
  The set of x for which there are more primes up to x of the form 4k + 3
  than of the form 4k + 1 has logarithmic density about 0.9959. More
  generally, the logarithmic densities in prime number races exist, lie
  strictly between 0 and 1, and favour non-residue classes.
statement_formal: |
  \delta\bigl(\{\, x : \pi(x;4,3) > \pi(x;4,1) \,\}\bigr) = 0.9959\ldots
hypotheses_required: [GRH-Dirichlet, PLUS-EXTRA]
status: still-conditional
status_note: >
  The extra assumption is the Grand Simplicity Hypothesis, also called
  Linear Independence: the positive imaginary parts of the zeros of the
  relevant Dirichlet L-functions are linearly independent over the
  rationals. It is not covered. One part of the paper needs only GRH for
  Dirichlet L-functions and so is covered: the normalized error terms have a
  limiting logarithmic distribution.
sources:
