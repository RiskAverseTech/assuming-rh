id: class-number-count-imaginary-quadratic-odd-average
title: "Average number of imaginary quadratic fields with a given odd class number"
field: analytic-number-theory
statement_plain: >
  Let F(h) be the number of imaginary quadratic fields with class number h.
  For any eps > 0, the sum of F(h) over odd h <= H equals (15/4) H^2 / log H +
  O(H^2 (log H)^(-3/2+eps)) as H tends to infinity.
statement_formal: |
  \sum_{\substack{h\le H\\ h\ \text{odd}}}\mathcal{F}(h)=\frac{15}{4}\cdot\frac{H^2}{\log H}+O\!\left(H^2(\log H)^{-3/2+\varepsilon}\right)
hypotheses_required: [RH, GRH-Dirichlet]
status: unlocked
status_note: >
  The paper states the hypothesis it uses as the Generalized Riemann
  Hypothesis for Dedekind zeta functions of quadratic number fields
  (Proposition 3.1 and Corollary 3.2). Such a zeta function is the product of
  the Riemann zeta function and a quadratic Dirichlet L-function, so the
  hypothesis is covered. The result is the analogue for odd class numbers of
  Soundararajan's average order of F(h). The paper also reports computations
  of F(h) for odd h up to 10^6 that are conditional on GRH; they are not part
  of this entry.
