id: random-matrix-characteristic-polynomial-irreducible
title: The characteristic polynomial of a random integer matrix is irreducible with Galois group at least A_n
field: algebraic-number-theory
statement_plain: >
  Let mu be a fixed nontrivial finitely supported probability measure on
  the integers, for example the uniform measure on {-1, +1}, and let M be
  an n by n matrix with independent entries of law mu. Then the
  characteristic polynomial phi of M is irreducible with probability
  1 - O(exp(-c n)), and its Galois group contains the alternating group
  A_n with probability 1 - O(exp(-c n^(1/2))), where c and the implied
  constants depend on mu.
statement_formal: |
  \mathbb{P}(\varphi \text{ irreducible}) = 1 - O(e^{-cn}), \qquad \mathbb{P}(\mathrm{Gal}(\varphi) \ge A_n) = 1 - O(e^{-cn^{1/2}})
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The paper assumes the extended Riemann hypothesis, defined as the Riemann
  Hypothesis for the Dedekind zeta functions of all number fields. It
  enters through the error term in the prime ideal theorem, following
  Breuillard and Varju: the number of roots of phi modulo large primes,
  averaged over primes, counts the irreducible factors of phi. The fields
  involved are generated by roots of phi, have degree up to n and are not
  abelian over the rationals in general. The same paper proves the
  conclusion "with high probability" unconditionally when mu is uniform
  modulo a product of four distinct primes (Theorem 1.2). This is the
  non-symmetric counterpart of the entry
  random-symmetric-matrix-characteristic-polynomial-irreducible.
