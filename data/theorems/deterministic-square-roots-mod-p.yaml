id: deterministic-square-roots-mod-p
title: Deterministic polynomial-time square roots modulo a prime
field: computational-number-theory
statement_plain: >
  There is a deterministic algorithm that, given a prime p and a square a
  modulo p, finds a square root of a modulo p in time polynomial in log p.
statement_formal: null
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The Tonelli-Shanks algorithm is deterministic once it is given a quadratic
  non-residue modulo p. Under GRH for Dirichlet L-functions a non-residue
  below 2 (ln p)^2 exists, so trying 2, 3, 4, ... in turn finds one quickly.
