    - >-
      Theorem 1 was read in the paper. The paper speaks of fields with class
      group of exponent 2 and says these are "essentially" Euler's idoneal
      numbers. The step from Theorem 1 to "exactly 65 idoneal numbers" is
      taken from later surveys, not from the paper.
