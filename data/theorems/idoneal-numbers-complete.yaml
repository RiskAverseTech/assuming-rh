id: idoneal-numbers-complete
title: Euler's list of 65 idoneal numbers is complete
field: algebraic-number-theory
statement_plain: >
  There are exactly 65 idoneal numbers (Euler's "convenient numbers"), the
  largest being 1848.
statement_formal: null
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  Weinberger's Theorem 1 has two parts. Without any hypothesis, there is at
  most one imaginary quadratic field of discriminant -d with d > 5460 whose
  class group has exponent 2. This leaves at most two more idoneal numbers,
  and the common claim "at most one more" is a misstatement. Under the
  hypothesis that the L-function of the Kronecker symbol of -d has no real
  zero s with 1 - 1/(4 log d) <= s < 1, for every d above 2 * 10^11, there is
  no such field, and Euler's list is complete. That hypothesis concerns real
  Dirichlet characters only and is much weaker than GRH for Dirichlet
  L-functions, which implies it.
sources:
