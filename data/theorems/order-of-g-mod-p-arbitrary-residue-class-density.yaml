  open_questions:
    - >-
      The paper does not spell out which fields its GRH refers to. Part I of
      the series says the Riemann Hypothesis for the fields
      Q(zeta_r, g^(1/s)) with s dividing r is enough; this entry assumes the
      same holds here.
