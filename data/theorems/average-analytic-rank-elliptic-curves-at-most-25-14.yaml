id: average-analytic-rank-elliptic-curves-at-most-25-14
title: The average analytic rank of all elliptic curves over the rationals is at most 25/14
field: arithmetic-geometry
statement_plain: >
  Consider the family of all elliptic curves E_{a,b}: y^2 = x^3 + a x + b with
  positive integers a and b, counted with a smooth weight that takes a of
  size X^(1/3) and b of size X^(1/2). As X tends to infinity the average
  analytic rank of the family is at most 25/14, which is less than 2. As a
  consequence a positive proportion of elliptic curves ordered by height
  have algebraic rank equal to analytic rank and finite Tate-Shafarevich
  group.
statement_formal: null
hypotheses_required: [GRH-automorphic, GRH-Dirichlet]
status: still-conditional
waiting_on: [modular-form-l-functions, higher-automorphic]
status_note: >
  This sharpens the bound 2 of Heath-Brown (existing entry
  average-analytic-rank-elliptic-curves-at-most-2) and the bound 2.3 of
  Brumer. It follows from the paper's one-level density theorem (Theorem
  3.1) for test functions with Fourier support in (-7/9, 7/9). The paper
  assumes GRH throughout for arithmetic L-functions. The Riemann Hypothesis
  for the elliptic curve L-functions L(s, E) in the family is needed to turn
  the density theorem into a rank bound; GRH for Dirichlet L-functions is
  said to be crucial for the support 7/9; and the Riemann Hypothesis for the
  symmetric-square L-functions is used in the explicit formula, where the
  paper says it could be avoided by averaging over the family.
