id: multivariable-artin-conjecture-stephens-constant-density
title: A multivariable Artin conjecture with a generalized Stephens constant
field: analytic-number-theory
statement_plain: >
  Let a, b_1, ..., b_nu be positive rational numbers that are
  multiplicatively independent. The set of primes p for which every b_h
  modulo p lies in the subgroup generated by a modulo p has a density, and
  this density is a rational multiple of the generalized Stephens constant
  S^(nu), the product over all primes p of
  1 - ((p^nu - 1)/(p - 1)) (p/(p^(nu+2) - 1)).
statement_formal: |
  \delta(a,b_1,\dots,b_\nu) \in \mathbb{Q}\cdot S^{(\nu)}, \qquad S^{(\nu)}=\prod_{p}\left(1-\frac{p^{\nu}-1}{p-1}\cdot\frac{p}{p^{\nu+2}-1}\right)
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The proof follows Moree and Stevenhagen's treatment of the two-variable
  case (dataset entry two-variable-artin-conjecture-density, which is the
  case nu = 1) and uses the Riemann Hypothesis for the Dedekind zeta
  functions of the Kummer fields
  Q(zeta_(ij), a^(1/ij), b_1^(1/i), ..., b_nu^(1/i)). Theorem 1.3 of the
  paper gives a formula for the rational factor up to an error term. The
  paper applies the case nu = 8 to the density of primes p for which the
  pseudo-effective cone of the reduction modulo p of a blow-up of the plane
  at 9 points of a nodal cubic is polyhedral (Theorem 1.2).
sources:
