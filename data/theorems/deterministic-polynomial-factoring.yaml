id: deterministic-polynomial-factoring
title: Deterministic polynomial factoring over finite fields in special cases
field: computational-number-theory
statement_plain: >
  Three results. Huang: an integer polynomial with abelian Galois group can
  be factored modulo a prime p in deterministic polynomial time. Rónyai: for
  Galois group G the time is polynomial in the size of G and of the input.
  Evdokimov: any polynomial of degree n over a finite field with q elements
  can be factored in deterministic time (n^(log n) log q)^O(1).
statement_formal: null
hypotheses_required: [GRH-Dirichlet, GRH-Hecke]
status: still-conditional
waiting_on: [power-residue-characters]
status_note: >
  Classified cautiously. Taking square roots modulo a prime needs Dirichlet
  L-functions only and is unlocked (see the entry on square roots). The
  general algorithms also need power non-residues in extension fields, for
  which Dirichlet L-functions are not known to suffice. Unconditional
  deterministic polynomial-time factoring over finite fields remains open
  either way.
