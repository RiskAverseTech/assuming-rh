  open_questions:
    - >-
      The exact GRH variant is not confirmed from any of the three papers. The hypothesis is used to find r-th power non-residues, including in extension fields, and the usual justification there goes through Hecke characters of number fields.
    - >-
      Huang's case of abelian Galois group may need less. If it needs Dirichlet L-functions only, this entry should be split and that part marked unlocked.
