      The paper's proof of Theorem 1.4 is one sentence: Bucur and Kedlaya proved it for elliptic curves and "one can extend their proof to other f_1 and f_2 with little additional effort". The Bucur and Kedlaya paper was not read.
    - >-
      The formula was read from the PDF as x^(5/6) log(k_1 q_1 k_2 q_2 x)^(1/3); I read the exponent 1/3 as applying to the logarithm as a whole.
