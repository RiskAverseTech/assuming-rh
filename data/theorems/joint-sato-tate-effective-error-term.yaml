id: joint-sato-tate-effective-error-term
title: Joint Sato-Tate distribution for two newforms with error term x^(5/6)
field: analytic-number-theory
statement_plain: >
  Let f_1 and f_2 be non-CM holomorphic newforms of weights k_1, k_2 and
  levels q_1, q_2 with trivial nebentypus that are not twist-equivalent, and
  let I_1, I_2 be subintervals of [0, pi]. The number of primes p up to x,
  not dividing q_1 q_2, whose Sato-Tate angles for f_1 and f_2 lie in I_1 and
  I_2 respectively differs from mu(I_1) mu(I_2) pi(x) by at most
  c x^(5/6) (log(k_1 q_1 k_2 q_2 x))^(1/3) for all x at least 3, where mu is
  the Sato-Tate measure and c is an absolute constant.
statement_formal: |
  \bigl|\pi_{f_1,f_2,I_1,I_2}(x) - \mu_{ST}(I_1)\,\mu_{ST}(I_2)\,\pi(x)\bigr| \le c_8\, x^{5/6}\,\bigl(\log(k_1 q_1 k_2 q_2 x)\bigr)^{1/3} \quad (x \ge 3)
hypotheses_required: [RH, GRH-automorphic]
status: still-conditional
waiting_on: [higher-automorphic]
status_note: >
  The theorem assumes GRH for the Rankin-Selberg L-functions
  L(s, Sym^m1 f_1 x Sym^m2 f_2) for all m1, m2 at least 0. The case
  m1 = m2 = 0 is the Riemann zeta function; the others are automorphic
  L-functions and are not covered. The paper credits the result to Bucur and
  Kedlaya for forms attached to elliptic curves and says their proof extends.
  The same paper proves unconditionally an error term
  O(pi(x) log(k_1 q_1 k_2 q_2 log log x) / sqrt(log log x)) (Theorem 1.2).
