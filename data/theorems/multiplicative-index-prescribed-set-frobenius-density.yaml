id: multiplicative-index-prescribed-set-frobenius-density
title: Density of primes of a number field with multiplicative index in a prescribed set and prescribed Frobenius
field: algebraic-number-theory
statement_plain: >
  Let K be a number field, G a finitely generated torsion-free subgroup of
  the multiplicative group of K of positive rank r, F/K a finite Galois
  extension, C a union of conjugacy classes of Gal(F/K), and S a non-empty
  set of positive integers. Let P(x) count the primes of K of norm at most x,
  unramified in F, whose Frobenius lies in C and for which the index of
  G modulo the prime in the multiplicative group of the residue field lies in
  S. Then P(x) equals an explicit density times x / log x, up to an error
  O(x / (log x)^(2 - 1/(r+1))) whose constant depends only on K, F and G.
statement_formal: |
  P(x)=\frac{x}{\log x}\sum_{t\in S}\sum_{v=1}^{\infty}\frac{\mu(v)\,c(vt)}{[F_{vt,vt}:K]}+O\!\left(\frac{x}{(\log x)^{2-\frac{1}{r+1}}}\right),\qquad c(n)=\#\{\sigma\in \mathrm{Gal}(F_{n,n}/K):\ \sigma|_{K_{n,n}}=\mathrm{id},\ \sigma|_F\in C\}
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  Here K_(n,n) = K(zeta_n, G^(1/n)) and F_(n,n) = F(zeta_n, G^(1/n)). The
  paper writes only "GRH" and says the result relies on variations for number
  fields of Hooley's conditional proof of Artin's primitive root conjecture;
  the fields involved are the Kummer extensions F_(n,n), which are in general
  not abelian over the rationals. For K = F = Q and G generated by one
  integer this kind of asymptotic is credited to Pappalardi and to Felix and
  Murty. The dataset entry index-map-preimages-finite-or-positive-density
  shows such sets are finite or of positive density; this entry gives the
  density and an error term. See also near-primitive-roots-density (S a
  single integer, K = Q). The paper goes on to express the density for S an
  arithmetic progression through Artin-type constants (Theorem 8) and to
  characterize when it is positive (Theorem 14).
