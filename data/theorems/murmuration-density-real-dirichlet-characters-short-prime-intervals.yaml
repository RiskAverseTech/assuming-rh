  open_questions:
    - >-
      The paper does not define its Generalized Riemann hypothesis. That only zeta and quadratic Dirichlet L-functions are needed is read from Lemma 2.10 (which cites Granville and Soundararajan) and from the uses of the Riemann hypothesis for prime counts; the full proof was not checked line by line.
    - >-
      The formula was transcribed from the extracted text of equations (1.6) and (1.7) and cross-checked against equation (1.9), not against the PDF.
