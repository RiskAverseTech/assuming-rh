  confidence: medium
  open_questions:
    - >-
      The paper does not define GRH. The code ERH-Dedekind is read from the cited theorem of Lagarias, Montgomery and Odlyzko, which assumes the hypothesis for the Dedekind zeta function of the splitting field.
    - >-
      The paper does not state the Galois group of x^n - x - 1; that the splitting field is non-abelian for n >= 3 is this project's remark, not the paper's.
