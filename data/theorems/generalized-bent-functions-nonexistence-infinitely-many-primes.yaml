review:
  state: ai-classified
  checked_by: null
  checked_on: null
  confidence: medium
  open_questions:
    - >-
      The paper never says which zeta functions its ERH covers. The code ERH-Dedekind with kummer-fields is this project's reading of the cited theorem of Murty (near-primitive roots, Hooley's method), which was not checked against Murty's paper.
    - >-
      Corollary 4.2 is printed for 'fixed positive integers n and g', but Theorem 4.1, on which it rests, requires n odd; the entry states it for odd n.
    - >-
      The positivity of the density constant for every g is asserted in the paper's quoted Theorem 2.3 and was not checked.
