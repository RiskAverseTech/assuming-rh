id: zeta-one-line-explicit-bound-chirre-molero
title: "Explicit bound for the zeta function on the line Re s = 1"
field: analytic-number-theory
statement_plain: >
  For t at least e^18, |zeta(1 + it)| is at most
  2 e^gamma (log log t - log 2 + 1/2 + 0.2674 / log log t
  - 2.6 log log t / log t), where gamma is the Euler-Mascheroni constant.
  The paper gives a matching explicit upper bound for 1 / |zeta(1 + it)|.
statement_formal: |
  |\zeta(1+it)| \le 2e^{\gamma}\left( \log\log t - \log 2 + \frac12 + \frac{0.2674}{\log\log t} - \frac{2.6\,\log\log t}{\log t} \right) \quad \text{for all } t \ge e^{18}
