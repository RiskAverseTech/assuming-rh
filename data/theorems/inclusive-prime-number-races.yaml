id: inclusive-prime-number-races
title: Prime number races are inclusive under a weak linear independence hypothesis
field: analytic-number-theory
statement_plain: >
  Fix q at least 3. Call an ordinate of a zero of a Dirichlet L-function
  modulo q self-sufficient if it is not a rational linear combination of the
  other ordinates, and call a character robust if the sum of 1/gamma over
  its self-sufficient ordinates diverges. If every nonprincipal character
  modulo q is robust, then every prime number race modulo q is strongly
  inclusive: the vector of normalized error terms lands in every open ball
  with positive logarithmic density, so every ordering of
  pi(x; q, a_1), ..., pi(x; q, a_r) occurs with positive logarithmic density.
statement_formal: null
hypotheses_required: [GRH-Dirichlet, PLUS-EXTRA]
status: still-conditional
status_note: >
  The extra assumption is a weakened form of the Linear Independence
  hypothesis: every nonprincipal character modulo q must be robust, meaning
  the sum of 1/gamma over its self-sufficient zero ordinates diverges. This
  is much weaker than full Linear Independence (as used by Rubinstein and
  Sarnak) but is still unproven and is not covered. GRH is assumed for all
  Dirichlet L-functions modulo q; the paper says most of its results do not
  need RH for zeta itself.
