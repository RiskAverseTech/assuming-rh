id: one-level-density-cubic-l-functions-eisenstein-field-support-13-11
title: One-level density of cubic L-functions over the Eisenstein field for support up to 13/11
field: analytic-number-theory
statement_plain: >
  Let omega be a primitive cube root of unity and consider the family of
  L-functions of the cubic residue symbols chi_n with n in Z[omega]
  square-free, n congruent to 1 modulo 9 and n not 1. For every even Schwartz
  function phi whose Fourier transform is supported in (-13/11, 13/11), the
  one-level density of the low-lying zeros of the family tends to the
  integral of phi against the unitary density, which equals the value of the
  Fourier transform of phi at 0. As a consequence L(1/2, chi) is nonzero for
  at least 2/13 of the characters in the family.
statement_formal: |
  \lim_{X\to\infty} D(X;\varphi,\mathcal{F}_3') = \int_{-\infty}^{\infty}\varphi(x)\,W_U(x)\,dx = \widehat{\varphi}(0), \qquad \operatorname{supp}\widehat{\varphi}\subset\left(-\tfrac{13}{11},\tfrac{13}{11}\right)
hypotheses_required: [GRH-Hecke]
status: still-conditional
waiting_on: [power-residue-characters]
status_note: >
  The hypothesis is GRH for the L-functions L(s, chi) of the characters in
  the family. These are Hecke L-functions of cubic characters of the field
  Q(omega), not Dirichlet L-functions over the rationals. The paper says
  this is the first family of cubic L-functions for which the support is
  extended beyond (-1, 1). For the full family of primitive cubic characters
  over Q(omega) the paper obtains, also under GRH, the one-level density
  only for a smaller support (Theorem 1.4).
