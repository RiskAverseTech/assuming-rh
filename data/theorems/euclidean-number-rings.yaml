id: euclidean-number-rings
title: Number rings with infinitely many units and class number 1 are Euclidean
field: algebraic-number-theory
statement_plain: >
  If the ring of integers of a number field has infinitely many units, then
  it is a Euclidean domain if and only if it is a principal ideal domain.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
status_note: >
  Weinberger's proof follows Hooley's method for Artin's conjecture and
  needs the hypothesis for Dedekind zeta functions of Kummer-type extensions
  that are not abelian over the rationals. Part of the statement is known
  unconditionally: Harper and Murty (2004) proved it for Galois fields of
  unit rank above 3, and Harper proved that Z[sqrt(14)] is Euclidean.
sources:
