id: lang-trotter-upper-bounds-zywina
title: Lang-Trotter upper bound x^(4/5) / (log x)^(3/5) for primes with a given Frobenius trace
field: arithmetic-geometry
statement_plain: >
  Let E be an elliptic curve over the rationals without complex
  multiplication, and for an integer a let P_{E,a}(x) be the number of
  primes p up to x of good reduction with a_p(E) = a. Then
  P_{E,a}(x) = O(x^(4/5) / (log x)^(3/5)) and
  P_{E,0}(x) = O(x^(3/4) / (log x)^(1/2)), with implied constants depending
  on E.
statement_formal: |
  P_{E,a}(x) \ll_E \frac{x^{4/5}}{(\log x)^{3/5}}, \qquad P_{E,0}(x) \ll_E \frac{x^{3/4}}{(\log x)^{1/2}}
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The paper's GRH is the Riemann Hypothesis for the Dedekind zeta functions
  of all number fields. It is used through a smoothed effective Chebotarev
  theorem applied to subextensions of the division fields of E, which are
  not abelian over the rationals. The Chebotarev bounds also assume Artin's
  holomorphy conjecture, but they are applied to abelian extensions, where
  the paper notes it is known. This sharpens the bounds of Serre recorded
  in the existing entry lang-trotter-upper-bounds-serre and, by a power of
  log x, the bound x^(4/5) of Murty, Murty and Saradha. The same paper
  proves the analogous bound for primes whose Frobenius field is a given
  imaginary quadratic field (Theorem 1.3).
