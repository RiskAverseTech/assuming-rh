  open_questions:
    - >-
      The paper never lists in one place every L-function for which GRH is assumed; the list here is assembled from Lemmas 2.6 and 2.7 and the proof in Section 4.1. Whether RH for zeta is also used was not determined.
    - >-
      The Maass forms have arbitrary level and the holomorphic forms weight k >= 3, so the modular-form-l-functions family (weight 2) does not apply.
