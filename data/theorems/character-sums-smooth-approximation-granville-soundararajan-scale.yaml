id: character-sums-smooth-approximation-granville-soundararajan-scale
title: Smooth-number approximation to character sums at the Granville-Soundararajan cutoff for sums of length at least a power of q
field: analytic-number-theory
statement_plain: >
  Let chi be a non-principal character modulo q (not necessarily
  primitive), chi_0 the principal character, S(x, chi) the sum of chi(n)
  over n <= x, and Psi(x, y; f) the sum of f(n) over n <= x with all prime
  factors at most y. Fix 0 < a <= 1, C > 6 and 0 < g < (C - 6)/4, and put
  y = log q + (log x)^2 (log log q)^C. Then uniformly for q^a <= x <= q,
  |S(x, chi)| + |Psi(x, y; chi)| is at most a constant times
  Psi(x, y; chi_0) exp(-g (log x) (log log log q) / log log q). In
  particular S(x, chi) = Psi(x, y; chi) + o(Psi(x, y; chi_0)).
statement_formal: |
  |S(x,\chi)|+|\Psi(x,y;\chi)|\ll_{a,C,\gamma}\Psi(x,y;\chi_0)\,\exp\!\left(-\gamma\,\frac{(\log x)\log\log\log q}{\log\log q}\right),\qquad q^{a}\le x\le q,\quad y=\log q+(\log x)^{2}(\log\log q)^{C}
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The hypothesis is the Riemann Hypothesis for the single L-function
  L(s, chi). This establishes, in the range q^a <= x <= q, the approximation
  conjectured by Granville and Soundararajan with the smaller cutoff y of
  order (log q)^2 (log log q)^C, where the entry
  short-character-sums-smooth-number-approximation needs
  y >= (log q)^2 (log x)^2 (log log q)^12; the error is measured against the
  count of y-smooth integers coprime to q. The paper proves the analogous
  statement for the sums of n^(-it) over n <= x under RH for zeta, uniformly
  for T^a <= x <= T and 2T <= t <= 5T (Theorem 1.6). It also proves
  unconditionally that the uniform upper-bound form of the
  Granville-Soundararajan conjecture, imposed on all non-principal
  characters including imprimitive ones, implies the Riemann Hypothesis for
  every primitive non-principal Dirichlet L-function (Theorem 1.2).
sources:
