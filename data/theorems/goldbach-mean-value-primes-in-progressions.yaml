  open_questions:
    - >-
      The hypothesis as worded covers all Dirichlet L-functions; the principal characters bring in the Riemann zeta function, which the paper notes has no real nontrivial zeros. RH for zeta is treated here as included in the Dirichlet case and is not listed separately.
