  open_questions:
    - >-
      The constant is read from the text extraction of Theorem 1.1 as 3 e^(-e^(101.3)) / (sqrt(3) - 1)^2, consistent with the final computation of the paper (a factor e^(e^(101.3)) (1 - 1/sqrt(3))^2 in the denominator). The paper writes "lim" for the proportion; a liminf may be what is actually proved.
    - >-
      Lemma 2.8 also says "Assuming that GRH holds" for a non-principal cubic ray class character, without further specification; this is read as GRH for Hecke L-functions of cubic characters over Q(omega).
