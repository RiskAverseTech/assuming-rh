  open_questions:
    - >-
      PLUS-EXTRA is listed because this paper treats automorphy of the symmetric powers (Conjecture 1.1 (a) to (e)) as unproved. The existing entry sato-tate-effective-error-term-symmetric-powers reports, from a later paper, that this automorphy is now known; if so PLUS-EXTRA and extra-assumption should be removed here.
    - >-
      The same paper also proves, under the same hypotheses, that the density of n with tau(n) nonzero exceeds 1 - 1.54 x 10^(-13); it is not recorded as a separate entry.
