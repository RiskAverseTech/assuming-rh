id: zeta-critical-line-bound-lower-order-terms
title: "Upper bound for the zeta function on the critical line with lower-order terms"
field: analytic-number-theory
statement_plain: >
  As t tends to infinity, log |zeta(1/2 + it)| is at most
  (log 2 / 2) log t / log log t
  + (log 2 / 2 + (log 2)^2) log t / (log log t)^2
  + O(log t / (log log t)^3). The paper gives further terms of the
  expansion with effectively computable coefficients.
statement_formal: |
  \log\left|\zeta(\tfrac12 + it)\right| \le \frac{\log 2}{2}\,\frac{\log t}{\log\log t} + \left(\frac{\log 2}{2} + \log^2 2\right)\frac{\log t}{(\log\log t)^2} + O\!\left(\frac{\log t}{(\log\log t)^3}\right)
hypotheses_required: [RH]
status: unlocked
