id: analytic-rank-distribution-elliptic-curves-explicit
title: Explicit upper bounds for the proportion of elliptic curves of large analytic rank
field: arithmetic-geometry
statement_plain: >
  Order elliptic curves y^2 = x^3 + Ax + B over the rationals by the naive
  height max(|A|^3, |B|^2), and let P(r_E >= a) be the proportion with
  analytic rank at least a. For every positive constant C and positive
  integer n, P(r_E >= (1 + C) 9n) is at most
  (sum over k from 0 to n of binom(2n, 2k) (1/2)^(2n-2k) (2k)! (1/6)^k)
  divided by (9 C n)^(2n). For example P(r_E <= 11) is at least 0.935185
  and P(r_E <= 21) is at least 0.996548.
statement_formal: |
  P\bigl(r_E \ge (1+C)\,9n\bigr) \le \frac{\sum_{k=0}^{n}\binom{2n}{2k}\left(\frac12\right)^{2n-2k}(2k)!\left(\frac16\right)^{k}}{(C\cdot 9n)^{2n}}
hypotheses_required: [GRH-automorphic]
status: still-conditional
waiting_on: [modular-form-l-functions]
status_note: >
  The theorem assumes GRH for elliptic L-functions, that is, for the
  L-function L(s, E) of every elliptic curve over the rationals in the
  family. These are L-functions of weight 2 newforms, not Dirichlet
  L-functions.
