id: primes-in-arithmetic-progressions-error
title: Square-root error term for primes in arithmetic progressions
field: analytic-number-theory
statement_plain: >
  For a coprime to q and q at most x, the weighted count of primes up to x
  that are congruent to a modulo q equals x / phi(q) with an error of
  O(sqrt(x) (log x)^2).
statement_formal: |
  \psi(x; q, a) = \frac{x}{\varphi(q)} + O\!\left(\sqrt{x}\,(\log x)^2\right) \qquad (\gcd(a,q) = 1,\ q \le x)
