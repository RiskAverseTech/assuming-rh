id: schinzel-wojcik-problem-equal-orders-modulo-primes
title: "Schinzel-Wojcik problem: when several rationals have equal multiplicative order modulo infinitely many primes"
field: analytic-number-theory
statement_plain: >
  Let a_1, ..., a_k be rational numbers different from -1, 0 and 1. There
  are infinitely many primes p for which a_1, ..., a_k all have the same
  multiplicative order modulo p, unless both of the following hold: some
  product of integer powers of the a_i equals -1, and some product of
  integer powers of the a_i with odd exponent sum equals 1. In that
  exceptional case there are only finitely many such primes. The set of
  such primes always has a density, and the density is positive whenever
  the set is infinite.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The paper says it suffices to assume the Riemann Hypothesis for the
  Dedekind zeta functions of Kummer-type extensions, that is, number fields
  obtained by adjoining roots of integers and roots of unity to Q. The
  proof generalizes Lenstra's work on Artin-type problems to several
  subgroups and uses Hooley's method. The same paper shows under the same
  hypothesis that for pairwise multiplicatively independent rationals every
  strict ordering of the orders occurs for a positive density of primes
  (Theorem 1.3). The existence of the density was proved earlier under GRH
  by Pappalardi and Susa.
