id: class-group-generators-norm-bound-4-01
title: Class group generated by prime ideals of norm at most 4.01 (log Delta)^2
field: algebraic-number-theory
statement_plain: >
  Let K be a number field of degree at least 2 with absolute discriminant D.
  The ideal class group of K is generated by the prime ideals of norm at
  most 4.01 (log D)^2.
statement_formal: |
  T_C(K) \le 4.01\,\log^2 \Delta_K, \quad \text{where } T_C(K) \text{ is the least } T \text{ such that } \{\mathfrak{p} : N\mathfrak{p} \le T\} \text{ generates } \mathrm{Cl}_K
hypotheses_required: [GRH-Hecke, ERH-Dedekind]
status: still-conditional
status_note: >
  The proof rests on a criterion of Belabas, Diaz y Diaz and Friedman that
  assumes the Riemann Hypothesis for the L-functions of all non-trivial
  characters of the class group of K, together with an explicit formula over
  the zeros of the Dedekind zeta function of K. Class group characters are
  Hecke characters and are in general not Dirichlet characters, even for
  quadratic fields, so nothing here is covered.
sources:
  - authors: L. Grenie, G. Molteni
    title: Explicit bounds for generators of the class group
    year: 2017
    venue: Preprint
    url: https://arxiv.org/abs/1607.02430
    hypothesis_location: Corollary 3.8 (hypothesis stated in Theorem 2.4 and the first paragraph of the introduction)
    role: conditional-proof
review:
  state: ai-classified
  checked_by: null
  checked_on: null
  confidence: high
  open_questions:
    - >-
      The paper writes "GRH" without one formal definition. It was read as: zeros of the Dedekind zeta function of K on the critical line (introduction) plus the Riemann Hypothesis for class group character L-functions (Theorem 2.4). A number theorist should confirm that no other L-functions enter.
