review:
  state: ai-classified
  checked_by: null
  checked_on: null
  confidence: medium
  open_questions:
    - >-
      The paper does not define GRH or Psi(x, y). Psi is taken to be the usual count of y-smooth integers up to x, and the code GRH-Dirichlet follows the related existing entries; whether the Darbar-Maiti lemma also needs RH for zeta was not checked.
    - >-
      The displayed formula is partly garbled in the extracted text; it was reconstructed from Theorem 1.1 and the parallel statement of Munsch's bound in the introduction, not from the PDF.
