id: zeta-simple-zeros-proportion-19-27
title: At least 19/27 of the zeros of the Riemann zeta-function are simple
field: analytic-number-theory
statement_plain: >
  Let N(T) count the zeros of the Riemann zeta-function with imaginary part
  in (0, T), with multiplicity, and let N*(T) count those that are simple.
  Then the lower limit of N*(T) / N(T) as T tends to infinity is at least
  19/27. As a corollary, the proportion of distinct zeros is at least
  0.84665.
statement_formal: |
  \kappa^{*} := \liminf_{T\to\infty}\frac{N^{*}(T)}{N(T)} \ \ge\ \frac{19}{27}
hypotheses_required: [RH]
status: unlocked
status_note: >
  Conrey, Ghosh and Gonek had proved the same bound assuming RH together
  with the Generalised Lindelof Hypothesis. This paper removes the second
  assumption, so only RH for the Riemann zeta-function is needed.
sources:
