id: random-zero-one-polynomials-irreducible-large-degree
title: Random polynomials with 0, 1 coefficients are irreducible with probability tending to 1
field: algebraic-number-theory
statement_plain: >
  Let P(x) = x^d + A_{d-1} x^(d-1) + ... + A_1 x + 1 where A_1, ..., A_{d-1}
  are independent and each equal to 0 or 1 with probability 1/2. Then the
  probability that P is irreducible in Z[x] tends to 1 as d tends to
  infinity. This is a conjecture of Odlyzko and Poonen.
statement_formal: |
  \mathbb{P}\bigl(P \text{ is irreducible in } \mathbb{Z}[x]\bigr)\to 1 \quad (d\to\infty)
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  Theorem 1 assumes the Riemann hypothesis for the Dedekind zeta functions
  of all number fields Q(a) with a a root of a polynomial with 0, 1
  coefficients. These fields have unbounded degree and are in general not
  Galois and not abelian over the rationals. Theorem 2 of the paper is more
  precise: for i.i.d. coefficients of a general law it gives probability at
  least 1 - exp(-c tau d^(1/2) / log d) for P to be an irreducible polynomial
  times a product of cyclotomic polynomials and a power of x of small total
  degree, and, assuming the hypothesis for the fields generated by any
  number of roots of P, that the Galois group of the irreducible part
  contains the alternating group. The paper says it also proves results
  under weaker information on the zeros. The existing entry
  random-symmetric-matrix-characteristic-polynomial-irreducible uses the
  same method for characteristic polynomials.
sources:
