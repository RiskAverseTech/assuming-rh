id: ray-class-subgroup-generators-small-primes
title: Small prime ideals generating a subgroup of a ray class group
field: algebraic-number-theory
statement_plain: >
  Let K be a number field with absolute discriminant D, m a modulus with
  finite part m0 and infinite part m_inf, and H a non-trivial subgroup of the
  ray class group Cl_m(K). Then H is generated by the classes of the degree 1
  prime ideals p coprime to m0 whose class lies in H and whose norm is less
  than ([Cl_m(K) : H] (2.71 log(D N(m0)) + 1.29 |m_inf| + 1.38 omega(m0)) + 4.13)^2,
  where omega counts distinct prime ideal divisors.
statement_formal: |
  N(\mathfrak{p}) < \Bigl([\mathrm{Cl}_{\mathfrak{m}}(K):H]\,\bigl(2.71\log(\Delta N(\mathfrak{m}_0)) + 1.29\,|\mathfrak{m}_\infty| + 1.38\,\omega(\mathfrak{m}_0)\bigr) + 4.13\Bigr)^2
hypotheses_required: [GRH-Hecke]
status: partial
status_note: >
  The paper's ERH is the statement that all Hecke L-functions are zero-free
  for Re(s) > 1/2, and the proof applies it to ray class characters of K, so
  the general theorem stays conditional. The named special case K = Q is
  Theorem 1.3 of the paper: any non-trivial subgroup H of G = (Z/mZ)^* is
  generated by the primes p with p mod m in H and p at most
  16 ([G:H] log m)^2. There the ray class characters are Dirichlet
  characters, so that case is covered.
