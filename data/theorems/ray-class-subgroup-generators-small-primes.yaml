  open_questions:
    - >-
      The entry states Theorem 1.2 with the auxiliary ideal h taken trivial; the paper allows an extra ideal h that the generating primes must avoid, with m0 replaced by h m0 in the bound.
    - >-
      The claim that the K = Q case (Theorem 1.3) needs only the Riemann zeta function and Dirichlet L-functions is this project's reading of how Theorem 1.3 is derived from Theorem 1.1; Section 4.2 applies Theorem 1.2 to K = Q with modulus m times the real place, and for H the full group cites Theorem 3 of Bach's 1990 paper, whose hypothesis was not checked here.
    - >-
      If the project prefers to reserve partial for hypotheses marked partially covered, this entry should be still-conditional with the K = Q case as a separate unlocked entry.
