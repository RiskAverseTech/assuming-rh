id: nullstellensatz-polynomial-hierarchy
title: Hilbert's Nullstellensatz is in the polynomial hierarchy
field: complexity-theory
statement_plain: >
  Deciding whether a system of polynomial equations with integer
  coefficients has a solution over the complex numbers is in the second
  level of the polynomial hierarchy. More precisely it is in the class
  RP^NP, and in the class AM according to a revised version of the paper.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
status_note: >
  The proof counts the primes modulo which the system has a solution, using
  an effective Chebotarev estimate for arbitrary number fields. Those fields
  are not abelian in general.
sources:
  - authors: P. Koiran
    title: Hilbert's Nullstellensatz is in the polynomial hierarchy
    year: 1996
    venue: J. Complexity 12, 273-286
    doi: 10.1006/jcom.1996.0019
    hypothesis_location: "Theorem 9 in Section 5, which rests on the effective Chebotarev theorem of Lagarias and Odlyzko. The main result is Theorem 2."
    role: conditional-proof
