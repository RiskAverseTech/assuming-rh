  confidence: medium
  open_questions:
    - >-
      The paper does not define its hypothesis; that it is the Riemann Hypothesis for the Dedekind zeta functions of the fields in the family is inferred from the cited GRH Basic Inequality of Tsfasman and Vladut, which was not consulted.
    - >-
      Marked partial on the strength of the special case of families of abelian fields. A reviewer may prefer still-conditional, since the theorem is a lim inf over all number fields.
    - >-
      The displayed constant was reconstructed from garbled extracted text and checked numerically to equal 0.26049.
