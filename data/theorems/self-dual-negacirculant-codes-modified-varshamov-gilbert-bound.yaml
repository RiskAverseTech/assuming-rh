  open_questions:
    - >-
      Theorem 5.2 does not name GRH in its statement; the hypothesis appears in the first sentence of the proof and in the abstract. The code ERH-Dedekind is inferred from the cited theorem of Moree (Hooley's method), which was not read.
    - >-
      The theorem also requires ord_{4p}(q) = p - 1 (hypotheses of Theorem 3.2). The paper does not spell out how Moree's theorem is applied when q is a proper prime power, nor why the relevant density is positive.
