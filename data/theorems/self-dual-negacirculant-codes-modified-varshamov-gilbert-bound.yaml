id: self-dual-negacirculant-codes-modified-varshamov-gilbert-bound
title: Infinite families of self-dual double and four-negacirculant codes meeting a modified Varshamov-Gilbert bound
field: analytic-number-theory
statement_plain: >
  Let q be a prime power congruent to 3 modulo 4 and let H_q be the q-ary
  entropy function. There are infinite families of self-dual
  double-negacirculant codes over F_q of length 2n, with n = 2p and p a
  prime congruent to 3 modulo 4, whose relative distance delta satisfies
  H_q(delta) >= 1/8, and infinite families of self-dual four-negacirculant
  codes over F_q of length 4n whose relative distance delta satisfies
  H_q(delta) >= 1/16.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The hypothesis is used only to guarantee infinitely many primes p
  congruent to 3 modulo 4 that have q as a primitive root, so that x^(2p) + 1
  factors over F_q into three self-reciprocal irreducible factors. The
  paper takes this from Moree's theorem on primes in arithmetic
  progressions with a prescribed primitive root, which it says is proved
  under GRH. The paper does not define GRH. Results of this kind are proved
  by Hooley's method, which uses the Dedekind zeta functions of Kummer
  fields Q(zeta_k, g^(1/k)); these are not abelian over the rationals. The
  enumeration and distance arguments are unconditional. Compare the entry
  metacyclic-codes-asymptotically-good.
