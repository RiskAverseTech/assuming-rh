  open_questions:
    - >-
      The paper never spells out GRH beyond 'GRH for Artin L-functions'. ERH-Dedekind is listed because the Chebotarev theorem it cites is normally stated under the Riemann Hypothesis for the Dedekind zeta functions of the fields involved; the cited source was not checked.
    - >-
      The extracted text garbles the square root sign; the bound [5k + 1 + sqrt(log k)] was read from the abstract and Theorem 1.3.1 together with the arXiv metadata.
    - >-
      The definition of N_p(f) at primes dividing the level uses chi_0(p) p^(k-1); the entry states it for primes not dividing M.
