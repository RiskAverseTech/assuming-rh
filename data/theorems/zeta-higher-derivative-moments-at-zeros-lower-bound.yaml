id: zeta-higher-derivative-moments-at-zeros-lower-bound
title: Lower bounds for discrete moments of higher derivatives of zeta at its zeros
field: analytic-number-theory
statement_plain: >
  Let rho run over the non-trivial zeros of the Riemann zeta function with
  imaginary part in (0, T], and let zeta^(m) be the m-th derivative. For all
  natural numbers k and m at least 1, the sum of |zeta^(m)(rho)|^(2k) over
  these zeros is at least a positive constant times
  T (log T)^(k^2 + 2km + 1).
statement_formal: |
  \sum_{0 < \gamma \le T} \left|\zeta^{(m)}(\rho)\right|^{2k} \gg T (\log T)^{k^2 + 2km + 1} \qquad (k, m \in \mathbb{N})
hypotheses_required: [RH]
status: unlocked
status_note: >
  The paper says the case m = 1 was proved by Milinovich and Ng under the
  Generalized Riemann Hypothesis, and that this corollary extends it to all
  m and replaces that hypothesis with the Riemann Hypothesis. The matching
  upper bound under RH is attributed to Kirila. The case m = 1 overlaps with
  the existing entry zeta-derivative-moments-at-zeros-sharp-lower-bound; the
  new content here is m at least 2. The paper's conjecture GRH(Theta) for
  Dirichlet L-functions is used only for a sharper error term in part (ii)
  of its Theorem 1.1 and is not assumed in this corollary.
sources:
