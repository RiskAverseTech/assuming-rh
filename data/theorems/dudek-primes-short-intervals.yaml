id: dudek-primes-short-intervals
title: Explicit primes in short intervals
field: analytic-number-theory
statement_plain: >
  For every x at least 2 there is a prime in the interval from
  x - (4/pi) sqrt(x) log x up to x.
statement_formal: |
  \text{For all } x \ge 2 \text{ there is a prime } p \text{ with } x - \tfrac{4}{\pi}\sqrt{x}\,\log x < p \le x .
hypotheses_required: [RH]
status: unlocked
status_note: >
  Carneiro, Milinovich and Soundararajan later improved the constant: under
  RH there is a prime in [x, x + (22/25) sqrt(x) log x] for every x at
  least 4.
  Both statements are checked in Lean 4. The repository cited below proves,
  from Mathlib's RiemannHypothesis, the bound of Carneiro, Milinovich and
  Soundararajan as stated above (Cramer.cmsPrimeInterval_of_RH) and a prime
  in (x, x + (107/100) sqrt(x) log x] for every x at least 2. Dudek's
  statement, which is the one in this entry, is deduced from the second of
  these in the file lean/Dudek.lean of this repository, written for this
  project; the deduction is short because 107/100 is below 4/pi. All were
  compiled on 25 November 2026 and depend only on Lean's three standard
  axioms. The cited formalization was written by AI agents and is three days
  old. What is checked is the implication from the hypothesis to this
  result. It is not a check of the announced proof, and the build was run by
  an AI system, not reviewed by a person.
