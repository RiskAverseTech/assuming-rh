id: supersingular-endring-maxorder-equivalence
title: The supersingular endomorphism ring and maximal order problems are equivalent
field: complexity-theory
statement_plain: >
  For supersingular elliptic curves, the problem of computing a basis of the
  endomorphism ring (EndRing) and the problem of finding a maximal order of
  the quaternion algebra isomorphic to the endomorphism ring (MaxOrder) are
  equivalent under probabilistic polynomial time reductions. They are also
  equivalent to the isogeny problem, the one endomorphism problem and the
  problem of computing the lattice of all isogenies between two curves.
statement_formal: null
hypotheses_required: [GRH-Hecke]
status: proved-otherwise
status_note: >
  The reductions between EndRing and MaxOrder were known earlier only under
  the generalized Riemann hypothesis, by Wesolowski (FOCS 2021), following a
  heuristic equivalence of Eisenträger, Hallgren, Lauter, Morrison and Petit.
  Herlédan Le Merdy and Wesolowski prove the equivalence with no hypothesis
  (Theorem 1). They say the earlier reductions needed the hypothesis to
  provably avoid hard factorizations and for the distribution of numbers
  represented by quadratic forms. One link stays conditional: the paper says
  the reduction from the l-isogeny path problem to the other problems is
  still known only under the hypothesis, and its average-case Theorem 2
  needs the hypothesis in two named cases.
