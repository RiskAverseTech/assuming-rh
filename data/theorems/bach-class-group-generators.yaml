id: bach-class-group-generators
title: Bach's bound on generators of the class group
field: algebraic-number-theory
statement_plain: >
  The ideal class group of a number field with discriminant D is generated
  by the prime ideals of norm at most 12 (log |D|)^2. For quadratic fields
  the constant 12 can be replaced by 6.
statement_formal: |
  \mathrm{Cl}(K) = \bigl\langle\, [\mathfrak{p}] : N\mathfrak{p} \le 12\,(\log|\Delta_K|)^2 \,\bigr\rangle
hypotheses_required: [GRH-Hecke]
status: still-conditional
status_note: >
  This differs from the first expectation that the quadratic case would be
  unlocked. The proof takes a non-trivial character of the class group and
  needs the Riemann Hypothesis for its Hecke L-function. For a quadratic
  field, a class group character of order above 2 is not a Dirichlet
  character: its L-function is a two-dimensional dihedral Artin L-function
  over the rationals. Only the genus characters reduce to Dirichlet
  L-functions, which controls the class group modulo squares and nothing
  more. So the bound stays conditional even for quadratic fields.
sources:
