  open_questions:
    - >-
      The paper does not define GRH beyond mentioning GRH for Dedekind zeta functions in connection with Hooley. That Lemma 3.2 needs Kummer fields is taken from its description (Chebotarev conditional on GRH) and from the Fan and Pollack entry already in the dataset; the Fan and Pollack paper was not re-read here.
