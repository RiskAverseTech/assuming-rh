  open_questions:
    - >-
      Coding choice: the L-functions are both elliptic curve L-functions over Q (GRH-automorphic, modular-form-l-functions) and Hecke L-functions of Grossencharacters over Q(i) (GRH-Hecke). The entry uses the first because the paper states the hypothesis for L(s, E_d); a reviewer may prefer GRH-Hecke with power-residue-characters.
    - >-
      Theorem 1.1 assumes RH for d in the family, while a lemma in Section 4 assumes it for L(s, xi_d) for all odd integers d; the difference was not examined.
