id: euclidean-systems-ray-classes-generating-sets
title: Generating sets of ray class groups modulo powers of p are Euclidean systems
field: algebraic-number-theory
statement_plain: >
  Let K be a totally real Galois number field of degree at least 3, and let
  p be an odd rational prime that does not split completely in K. Then for
  every positive integer N, any generating set of the ray class group of K
  with modulus (p)^N is a Euclidean system of ray classes.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The hypothesis enters through Lenstra's theorem on Artin's generalized
  primitive root conjecture (Lenstra's Theorem 4.6), applied with the ray
  class field of K and a group W of units. That theorem concerns the fields
  obtained from K by adjoining roots of unity and roots of the elements of
  W, which are Kummer-type fields and not abelian over the rationals. The
  paper writes only "GRH" and does not define it.
