id: prime-races-many-contestants-extreme-biases
title: Extremely biased prime number races with n contestants modulo q once n / log q tends to infinity
field: analytic-number-theory
statement_plain: >
  For distinct reduced residues a_1, ..., a_n modulo q let
  delta(q; a_1, ..., a_n) be the logarithmic density of the set of x with
  pi(x; q, a_1) > pi(x; q, a_2) > ... > pi(x; q, a_n). There is an absolute
  constant C such that, for n sufficiently large and n <= phi(q), there are
  distinct reduced residues a_1, ..., a_n with
  delta(q; a_1, ..., a_n) <= exp(-min(n, phi(q)^(1/50)) / (C log q)) / n!,
  and distinct reduced residues b_1, ..., b_n with
  delta(q; b_1, ..., b_n) >= exp(min(n, phi(q)^(1/50)) / (C log q)) / n!.
  In particular biased n-way races exist as soon as n / log q tends to
  infinity.
statement_formal: |
  \delta(q; a_1,\dots,a_n) \le \exp\!\left(-\frac{\min\{n, \varphi(q)^{1/50}\}}{C\log q}\right)\frac{1}{n!}, \qquad \delta(q; b_1,\dots,b_n) \ge \exp\!\left(\frac{\min\{n, \varphi(q)^{1/50}\}}{C\log q}\right)\frac{1}{n!}
hypotheses_required: [GRH-Dirichlet, PLUS-EXTRA]
status: still-conditional
waiting_on: [extra-assumption]
status_note: >
  The extra assumption is the Linear Independence hypothesis LI: the
  nonnegative imaginary parts of the nontrivial zeros of Dirichlet
  L-functions attached to primitive characters are linearly independent
  over the rationals. It is not covered. The Riemann Hypothesis part
  concerns Dirichlet L-functions only. The result improves the range
  n >= phi(q)^epsilon of Harper and Lamzouri for the existence of biased
  races and, with their result that all n-way races are asymptotically
  unbiased for n <= log q / (log log q)^4, locates the transition at
  n = (log q)^(1 + o(1)). Related entry for a fixed number of competitors:
  prime-races-three-or-more-competitors-bias-size.
