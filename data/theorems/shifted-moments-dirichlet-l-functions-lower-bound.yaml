id: shifted-moments-dirichlet-l-functions-lower-bound
title: Sharp lower bounds for shifted moments of Dirichlet L-functions of fixed modulus
field: analytic-number-theory
statement_plain: >
  Let q be a large modulus for which the number of primitive characters
  modulo q is at least a fixed positive proportion of phi(q), let a_1, a_2 >= 0
  be fixed, and let |t_1|, |t_2| <= q^A. Then the sum over primitive
  characters chi modulo q of |L(1/2 + i t_1, chi)|^(2 a_1) |L(1/2 + i t_2, chi)|^(2 a_2)
  is bounded below by a constant times
  phi(q) (log q)^(a_1^2 + a_2^2) |zeta(1 + i(t_1 - t_2) + 1/log q)|^(2 a_1 a_2).
statement_formal: |
  \sum\nolimits^{*}_{\chi \bmod q} \left| L(\tfrac12 + i t_1, \chi) \right|^{2a_1} \left| L(\tfrac12 + i t_2, \chi) \right|^{2a_2} \gg \varphi(q) (\log q)^{a_1^2 + a_2^2} \left| \zeta\left(1 + i(t_1 - t_2) + \tfrac{1}{\log q}\right) \right|^{2 a_1 a_2}
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The hypothesis is used for L(s, chi) with chi a primitive Dirichlet
  character modulo q (Lemma 2.4). The paper notes that this matches the
  upper bound of Szabo, which is also conditional, so the shifted moments
  have the stated order of magnitude.
