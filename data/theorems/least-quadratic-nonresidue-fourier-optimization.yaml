id: least-quadratic-nonresidue-fourier-optimization
title: Least quadratic non-residue below (380/499) log^2 p
field: analytic-number-theory
statement_plain: >
  For every sufficiently large prime p, the least quadratic non-residue n_p
  modulo p is less than (380/499) (log p)^2. More precisely, the limsup
  of n_p / (log p)^2 is below 0.7615.
statement_formal: |
  n_p < \tfrac{380}{499}\,\log^2 p \quad \text{for all sufficiently large primes } p
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  Proved by Carneiro, Milinovich, Quesada-Herrera and Ramos. Their paper
  defines its hypothesis as GRH for Dirichlet L-functions and applies it only
  to the primitive characters inducing the powers of the character. They note
  that 380/499 cannot be replaced by 379/499 with their method. An earlier
  expository article by one of the authors quotes the slightly weaker
  constant 61/80. That article also states a result on primes of the form
  u^2 + 27 v^2 in short intervals, which uses Hecke L-functions of an
  imaginary quadratic field and is not part of this entry.
sources:
