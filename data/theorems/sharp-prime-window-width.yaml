id: sharp-prime-window-width
title: A sharp width for weighted sums over ordinary primes
field: analytic-number-theory
statement_plain: >-
  At every real scale y > 0 and every width b at or above the critical value, the weighted sum of log p over the primes between y and b²y is strictly less than b(b−1)y log b. The critical value lies strictly between 1.50342897722316 and 1.50342897722317.
statement_formal: |
  \begin{gathered}
  W_b(t)=\begin{cases}
  b(1-1/t) & 1<t\le b,\\
  b^2/t-1 & b<t<b^2,\\
  0 & \text{otherwise},
  \end{cases}\\
  \mathrm{RH}\ \Longrightarrow\
  \sum_{p\ \mathrm{prime}}(\log p)\, W_b(p/y)< b(b-1)y\log b
  \quad (y>0,\ b\ge b_\ast).
  \end{gathered}
hypotheses_required: [RH]
status: unlocked
status_note: >-
  The bound includes the critical width itself. Below it, the source proves sign changes under the additional assumption that the distinct positive ordinates of the zeta zeros are linearly independent over the rationals.
