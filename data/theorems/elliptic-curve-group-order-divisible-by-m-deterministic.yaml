  open_questions:
    - >-
      The paper does not define GRH. The explicit uses are Lemma 4 and Corollary 5 (Legendre symbols, a Dirichlet character modulo 4p) and finding a quadratic non-residue; the deterministic Hilbert class polynomial and root-finding steps are described as not relying on GRH. A reviewer should confirm no cited subroutine in the proof of Theorem 2 needs more.
