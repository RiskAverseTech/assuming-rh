id: quadratic-character-sum-moments-prime-moduli
title: Moments of quadratic character sums over prime moduli
field: analytic-number-theory
statement_plain: >
  Let chi^(8p) be the quadratic character given by the Kronecker symbol
  (8p / .). For real m >= 2, large X and Y and any eps > 0, the sum over odd
  primes p <= X of (log p) |sum_{n <= Y} chi^(8p)(n)|^(2m) is at most a
  constant times X Y^m (log X)^(2m^2 - m + 1 + eps).
statement_formal: |
  \sum_{\substack{p\le X\\ (p,2)=1}}\log p\,\left|\sum_{n\le Y}\chi^{(8p)}(n)\right|^{2m}\ll X\,Y^{m}(\log X)^{2m^{2}-m+1+\varepsilon}\qquad(m\ge 2)
hypotheses_required: [RH, GRH-Dirichlet]
status: unlocked
status_note: >
  This is the case k = 2 of Theorem 1.3, stated in the paper as (1.6). It is
  deduced from conditional upper bounds for shifted moments of the quadratic
  Dirichlet L-functions L(s, chi^(8p)) (Theorem 1.1).
sources:
