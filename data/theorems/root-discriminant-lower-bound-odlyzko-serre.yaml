id: root-discriminant-lower-bound-odlyzko-serre
title: Lower bound for the root-discriminant of a number field
field: algebraic-number-theory
statement_plain: >
  Let K be a number field of degree n with r1 real and 2 r2 complex
  embeddings and let D be the absolute value of its discriminant. Then the
  root-discriminant D^(1/n) is at least
  (215.3325...)^(r1/n) (44.7632...)^(2 r2/n) - O((log n)^(-2)), where the
  two constants are 8 pi e^(C + pi/2) and 8 pi e^C with C Euler's constant.
  The best unconditional bound of the same kind has the smaller constants
  60.8395... and 22.3816....
statement_formal: |
  D_K^{1/n} \ \ge\ \left(8\pi e^{C+\pi/2}\right)^{r_1/n}\left(8\pi e^{C}\right)^{2r_2/n} - O\!\left((\log n)^{-2}\right)
hypotheses_required: [ERH-Dedekind]
status: partial
status_note: >
  The bound for a field K needs the hypothesis only for the Dedekind zeta
  function of K itself. So it is unlocked when K is abelian over the
  rationals, where the zeta function is a product of Dirichlet
  L-functions, and stays conditional for general number fields. This paper
  is a survey. It attributes the bounds assuming the hypothesis to earlier
  papers of Odlyzko, improved by Serre using the explicit formulas of
  Guinand and Weil, with further work by Poitou and Odlyzko.
sources:
  - authors: A. M. Odlyzko
    title: "Bounds for discriminants and related estimates for class numbers, regulators and zeros of zeta functions: a survey of recent results"
    year: 1990
    venue: Sém. Théor. Nombres Bordeaux (2) 2, 119-141
    url: https://www.numdam.org/item/JTNB_1990__2_1_119_0/
    hypothesis_location: "Section 2, equation (2.6); the hypothesis is defined in Section 1"
    role: survey
