id: q-analog-pair-correlation-average-bounds
title: Bounds for the average of the q-analog of Montgomery's pair correlation function
field: analytic-number-theory
statement_plain: >
  Let F_Phi(alpha, Q) be the q-analog of Montgomery's pair correlation
  function for zeros of primitive Dirichlet L-functions with conductors of
  size Q, as defined by Chandee, Lee, Liu and Radziwill. For every b >= 1
  and every sufficiently large fixed l (possibly depending on b), as Q
  tends to infinity the average of F_Phi(alpha, Q) over alpha in
  [b, b + l] lies between 0.982144 + o(1) and 1.077542 + o(1). The
  conjectured value is 1.
statement_formal: |
  0.982144 + o(1) < \frac{1}{\ell}\int_{b}^{b+\ell} F_{\Phi}(\alpha, Q)\, d\alpha < 1.077542 + o(1) \qquad (Q \to \infty)
hypotheses_required: [GRH-Dirichlet]
