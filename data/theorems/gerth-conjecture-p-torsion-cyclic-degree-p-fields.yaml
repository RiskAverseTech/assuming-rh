  open_questions:
    - >-
      The L-functions used are Artin L-functions of induced representations, which coincide with Hecke L-functions of order p characters over Q(zeta_p); GRH-Hecke with power-residue-characters would be an equally reasonable coding.
    - >-
      Theorem 1.5 is worded for all p; the entry restricts to p > 3 because Theorem 1.6 says the result is unconditional for p = 3 and conditional for p > 3.
