id: gerth-conjecture-p-torsion-cyclic-degree-p-fields
title: Gerth's distribution for p-torsion in class groups of cyclic fields of degree p
field: algebraic-number-theory
statement_plain: >
  Let p > 3 be a prime. For a cyclic field K of degree p with Galois group
  generated by sigma, let phi = 1 - sigma act on the p-torsion Cl_K[p] of
  the class group. Among cyclic fields of degree p ordered by discriminant,
  the density of those for which phi(ker phi^2) has p-rank s equals
  eta_inf(p) / (eta_s(p) eta_(s+1)(p) p^(s(s+1))), where eta_s(p) is the
  product of (1 - p^(-i)) for i from 1 to s.
statement_formal: |
  \lim_{X\to\infty} \frac{\#\{K : D_K < X,\ \mathrm{rk}_p\,\varphi(\ker\varphi^2) = s\}}{\#\{K : D_K < X\}} = \frac{\eta_\infty(p)}{\eta_s(p)\,\eta_{s+1}(p)\,p^{s(s+1)}}, \qquad \eta_s(p) = \prod_{i=1}^{s}\left(1 - p^{-i}\right)
hypotheses_required: [GRH-Artin]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The paper assumes GRH for Artin L-functions. In the proof (Section 6.5)
  it is applied to L(s, sigma) for representations sigma of Gal(L/Q), where
  L is the compositum of a Kummer field Q(zeta_p, C^(1/p)) with a cyclic
  field of degree p; these representations are induced from characters of
  order p over Q(zeta_p). The hypothesis replaces large sieve inequalities
  for characters of order p that are not available. For p = 3 the paper
  proves the same statement unconditionally (Theorem 1.4), where it gives
  the distribution of the 3-rank of Cl_K[3] modulo its Galois-invariant
  part. The density follows from the moment computation in Theorem 1.6
  together with a result of Fouvry and Kluners on moments determining the
  distribution.
