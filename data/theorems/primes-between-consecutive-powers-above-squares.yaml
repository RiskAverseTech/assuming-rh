id: primes-between-consecutive-powers-above-squares
title: "Primes between x^(2+delta) and (x+1)^(2+delta)"
field: analytic-number-theory
statement_plain: >
  If delta is at least 1/4, the interval [x^(2+delta), (x+1)^(2+delta)]
  contains a prime for every real x at least 1. If 0 < delta < 1/4, it
  contains a prime for all x at least (beta (log beta + log log beta))^beta,
  where beta = 2/delta.
statement_formal: |
  \text{For } \delta \ge \tfrac14 \text{ and all real } x \ge 1 \text{ there is a prime in } \left[x^{2+\delta},\,(x+1)^{2+\delta}\right]
hypotheses_required: [RH]
