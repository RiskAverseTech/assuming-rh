id: lagarias-harmonic-inequality
title: Lagarias's harmonic number inequality
field: analytic-number-theory
statement_plain: >
  For every positive integer n, the sum of the divisors of n is at most
  H_n + exp(H_n) log(H_n), where H_n is the n-th harmonic number. Equality
  holds only for n = 1.
statement_formal: |
  \sigma(n) \le H_n + e^{H_n}\log H_n \qquad (n \ge 1), \qquad H_n = \sum_{k=1}^{n} \frac{1}{k}
hypotheses_required: [RH]
status: unlocked
status_note: >
  This inequality is equivalent to RH. The proof builds on Robin's inequality.
  The equivalence between RH and Lagarias's inequality for every positive n
  is formalized in Lean 4 in the repository cited below, stated with
  Mathlib's own definition of the Riemann Hypothesis. This project built
  that repository from source on 25 November 2026 and confirmed that the
  theorem compiles and depends only on Lean's three standard axioms. The
  formal statement is the inequality itself; the remark that equality holds
  only for n = 1 is not part of it. What is checked is the implication
  between RH and this inequality. It is not a check of the announced proof
  of RH, and it was run by an AI system, not reviewed by a person.
