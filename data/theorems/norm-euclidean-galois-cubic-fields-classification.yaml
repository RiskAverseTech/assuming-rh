id: norm-euclidean-galois-cubic-fields-classification
title: Classification of the norm-Euclidean Galois cubic fields
field: algebraic-number-theory
statement_plain: >
  The norm-Euclidean Galois cubic fields are exactly the thirteen fields with
  discriminant f^2 for f = 7, 9, 13, 19, 31, 37, 43, 61, 67, 103, 109, 127,
  157.
statement_formal: |
  K/\mathbb{Q} \text{ Galois cubic and norm-Euclidean} \iff \Delta_K = f^2,\ f \in \{7, 9, 13, 19, 31, 37, 43, 61, 67, 103, 109, 127, 157\}
hypotheses_required: [RH, GRH-Dirichlet]
status: proved-otherwise
status_note: >
  McGown proved this in 2012 assuming GRH for Dirichlet L-functions. Bagger,
  Booker, Kerr, McGown, Starichkova and Trudgian have since proved it
  without any hypothesis (arXiv 2507.05862), by new explicit bounds for
  cubic non-residues and further computation. In McGown's paper a footnote
  says it suffices to assume RH and GRH for Dirichlet L-functions of cubic
  characters. That the thirteen listed fields are norm-Euclidean was already
  unconditional; the hypothesis was used to exclude all other fields.
sources:
