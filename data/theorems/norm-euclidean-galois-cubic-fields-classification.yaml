id: norm-euclidean-galois-cubic-fields-classification
title: Classification of the norm-Euclidean Galois cubic fields
field: algebraic-number-theory
statement_plain: >
  The norm-Euclidean Galois cubic fields are exactly the thirteen fields with
  discriminant f^2 for f = 7, 9, 13, 19, 31, 37, 43, 61, 67, 103, 109, 127,
  157.
statement_formal: |
  K/\mathbb{Q} \text{ Galois cubic and norm-Euclidean} \iff \Delta_K = f^2,\ f \in \{7, 9, 13, 19, 31, 37, 43, 61, 67, 103, 109, 127, 157\}
hypotheses_required: [RH, GRH-Dirichlet]
status: unlocked
status_note: >
  The paper defines GRH as the statement for every Dirichlet L-function, and
  a footnote says that for this theorem it suffices to assume RH and GRH for
  Dirichlet L-functions of cubic characters. Where the proof assumes GRH for
  the Dedekind zeta function of the cubic field, the paper notes that this
  follows from the Dirichlet case, since the field is abelian over the
  rationals. That the thirteen listed fields are norm-Euclidean is
  unconditional; the hypothesis is used to exclude all other fields.
sources:
