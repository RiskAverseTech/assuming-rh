id: montgomery-pair-correlation-form-factor-theorem
title: Montgomery's theorem on the pair correlation form factor F(alpha) for alpha up to 1
field: analytic-number-theory
statement_plain: >
  Let F(alpha) = F(alpha, T) be (T log T / (2 pi))^(-1) times the sum over
  pairs of ordinates gamma, gamma' in (0, T] of zeros of the Riemann zeta
  function of T^(i alpha (gamma - gamma')) w(gamma - gamma'), with
  w(u) = 4/(4 + u^2). Then F(alpha) is real, even and nonnegative, and
  F(alpha) = alpha + o(1) + (1 + o(1)) T^(-2 alpha) log T as T tends to
  infinity, uniformly for 0 <= alpha <= 1.
statement_formal: |
  F(\alpha) = \Bigl(\frac{T}{2\pi}\log T\Bigr)^{-1} \sum_{0<\gamma,\gamma'\le T} T^{i\alpha(\gamma-\gamma')}\, w(\gamma-\gamma') = \alpha + o(1) + (1+o(1))\,T^{-2\alpha}\log T \qquad (0 \le \alpha \le 1)
hypotheses_required: [RH]
status: unlocked
status_note: >
  This is Montgomery's 1973 theorem; the source here is an expository
  account by Goldston that re-proves it from Montgomery's explicit formula.
  The theorem is stated uniformly for 0 <= alpha <= 1 - epsilon, and the
  text right after it says that a sieve bound for prime twins extends the
  range to 0 <= alpha <= 1. The same notes deduce that at least two thirds
  of the zeros are simple and that liminf (gamma_{n+1} - gamma_n) log
  gamma_n / (2 pi) <= 0.6072...; both are weaker than the existing entries
  zeta-simple-zeros-proportion-19-27 and zeta-zeros-small-gaps-0-50895.
  Related entry: montgomery-form-factor-integral-bounded-intervals-bounds.
