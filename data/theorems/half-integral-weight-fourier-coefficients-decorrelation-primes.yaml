  open_questions:
    - >-
      The proof of the underlying Theorem 3.1 is a three-line reduction to two papers of Gao and Zhao, so the list of L-functions is taken from the theorem statement and could not be checked against a full proof.
    - >-
      Theorem 1.1 does not define the sign sigma or the normalization of the coefficients c_i(p); sigma is fixed as plus or minus 1 in Theorem 3.1.
    - >-
      The abstract mentions the Generalized Ramanujan Conjecture as an assumption; for holomorphic forms it is known, so no extra assumption is recorded for this theorem.
