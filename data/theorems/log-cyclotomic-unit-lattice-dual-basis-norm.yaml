id: log-cyclotomic-unit-lattice-dual-basis-norm
title: Asymptotic norm of the dual basis of the log-cyclotomic-unit lattice for prime conductor
field: computational-number-theory
statement_plain: >
  Let q be a prime and let b_j be the standard basis of the
  log-cyclotomic-unit lattice of the q-th cyclotomic field, with dual basis
  b_j^v. All the dual vectors have the same norm, and
  ||b_j^v||^2 = (4 zeta(2) / zeta(4)) (1/q) (1 + O(q^(-1+epsilon))) as q
  tends to infinity. As a consequence, the algorithm of Cramer, Ducas,
  Peikert and Regev for recovering a short generator of a principal ideal
  from an arbitrary generator succeeds with probability at least
  1 - (q - 3) exp(-t/2) with t of order sqrt(q).
statement_formal: |
  \|b_j^{\vee}\|^{2} = \frac{4\zeta(2)}{\zeta(4)}\cdot\frac{1}{q}\,\bigl(1 + O(q^{-1+\varepsilon})\bigr) \qquad (q \to \infty,\ q \text{ prime})
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The paper defines its GRH as the statement for Dirichlet L-functions. It
  is used to evaluate the negative second moment of L(1, chi) over
  non-principal even characters modulo q, which controls the norm of the
  dual basis. The hypothesis affects the analysis of the success
  probability, not the algorithm itself. Earlier analysis under GRH gave
  only the upper bound of order (log log q)^2 / q, hence t of order
  sqrt(q) / log log q. No existing entry covers short generator recovery.
sources:
