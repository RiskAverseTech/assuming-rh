id: selberg-mean-value-pnt-intervals-explicit
title: "Explicit version of Selberg's mean-value estimate for primes in short intervals"
field: analytic-number-theory
statement_plain: >
  For all x at least 10^8 and any delta in (0, 10^-8], the integral from
  1 to x of |theta(y + delta y) - theta(y) - delta y|^2 dy is less than
  202 delta x^2 (log x)^2.
statement_formal: |
  \int_1^x \left|\theta(y+\delta y) - \theta(y) - \delta y\right|^2 dy < 202\,\delta\,x^2 \log^2 x \quad \text{for all } x \ge 10^8,\ \delta \in (0, 10^{-8}]
hypotheses_required: [RH]
status: unlocked
status_note: null
sources:
