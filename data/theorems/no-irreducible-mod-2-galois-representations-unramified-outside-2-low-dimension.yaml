id: no-irreducible-mod-2-galois-representations-unramified-outside-2-low-dimension
title: No irreducible mod 2 Galois representations of Q unramified outside 2 in dimensions 2, 3 and 4
field: algebraic-number-theory
statement_plain: >
  There is no irreducible representation of the absolute Galois group of Q
  into GL_d over the algebraic closure of F_2 that is unramified outside 2,
  for d = 2, 3 or 4. The same holds for d = 5, 6, 7, 8 when the field cut
  out by the representation is totally real, and there is no irreducible
  totally real representation into GL_d over the algebraic closure of F_3
  unramified outside 3 for d = 2, 3 or 4.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The paper says the dependence on GRH comes from the discriminant lower
  bounds of Odlyzko, Poitou and Serre and Odlyzko's GRH-conditional tables.
  Those bounds assume the Riemann Hypothesis for the Dedekind zeta function
  of the number field they are applied to, here the Galois extension of Q
  cut out by a hypothetical representation. Such a field is not abelian
  over Q when the representation is irreducible of dimension at least 2, so
  the hypothesis does not reduce to Dirichlet L-functions. The paper notes
  that Moon proved the case p = 2, d at most 4 without GRH under the extra
  assumption that the field cut out is totally real, and it proves
  unconditionally that there is no irreducible representation into GSp_4(F_2)
  unramified outside 2 (Theorem C).
sources:
