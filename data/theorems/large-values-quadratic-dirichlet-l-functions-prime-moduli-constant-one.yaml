id: large-values-quadratic-dirichlet-l-functions-prime-moduli-constant-one
title: Large central values of quadratic Dirichlet L-functions with moduli 8q, q prime, with constant 1
field: analytic-number-theory
statement_plain: >
  Let chi_{8q} be the quadratic Dirichlet character given by the Kronecker
  symbol (8q/.) for an odd prime q. For all sufficiently large X there is a
  prime q with X < q <= 2X for which L(1/2, chi_{8q}) is at least
  exp((1 + o(1)) sqrt(log X logloglog X / loglog X)).
statement_formal: |
  \max_{\substack{q \text{ prime} \\ X < q \le 2X}} L(\tfrac12, \chi_{8q}) \ge \exp\left( \bigl(1 + o(1)\bigr) \sqrt{\frac{\log X \, \log\log\log X}{\log\log X}} \right)
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  This sharpens the existing entry
  large-values-quadratic-dirichlet-l-functions-prime-moduli (Gao), improving
  the constant 1/2 to 1. The hypothesis is used in Lemma 2.2, a smoothed sum
  of chi_{8q}(c) log q over primes q with error O(X^(1/2 + epsilon)
  log(c + 2)), quoted from Gao's paper. The proof combines the resonance
  method with a bound for GCD sums over square-free integers.
sources:
