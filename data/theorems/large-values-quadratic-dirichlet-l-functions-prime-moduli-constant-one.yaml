  open_questions:
    - >-
      The paper does not define GRH. That only Dirichlet L-functions are needed is read from Lemma 2.2, the one lemma that carries the hypothesis, whose proof is in the cited paper of Gao and was not checked.
    - >-
      The theorem prints the range as X < |q| <= 2X; since q is an odd prime this is read as X < q <= 2X.
