  open_questions:
    - >-
      The theorem's literal hypothesis is a Lindelof-type bound for central values of triple product L-functions, not a Riemann Hypothesis; the paper says the Grand Riemann Hypothesis implies it with a = 0. A reviewer should decide whether such a result belongs in the dataset.
    - >-
      RH is listed because for the modular surface the hypothesis includes the Eisenstein case, whose triple product L-function should factor through the Riemann zeta function and a symmetric square L-function. This factorization is my reading, not a statement quoted from the paper.
    - >-
      Quantum unique ergodicity without a rate may since have been proved unconditionally for these surfaces by other methods (work of Lindenstrauss and of Soundararajan, from memory). The paper does not say so, so the entry does not use it; the optimal rate recorded here would in any case remain conditional. Please check.
    - >-
      The exact normalization of mu_0 and the constant's dependence on X were read from the extracted text of Theorem 4 and Corollary 1, not from the PDF.
