id: quantum-unique-ergodicity-optimal-rate-maximal-orders
title: Quantum unique ergodicity with optimal rate on arithmetic hyperbolic surfaces
field: analytic-number-theory
statement_plain: >
  Let X be the quotient of the upper half plane by the norm one units of a
  maximal order in an indefinite quaternion algebra over Q (for the split
  algebra, X is the modular surface). Let psi_j be the L^2-normalized
  Hecke-Maass eigenforms on X with Laplace eigenvalues lambda_j, and mu_j the
  measure |psi_j|^2 dx dy / y^2. Then for smooth compactly supported f, the
  integral of f against mu_j differs from its integral against the
  normalized uniform measure mu_0 by
  O(lambda_j^(-1/4 + eps) ||f||), where ||f|| is the Sobolev norm of order
  1/2. This is the quantitative form of quantum unique ergodicity
  conjectured by Luo and Sarnak.
statement_formal: |
  \int_X f\,d\mu_j - \int_X f\,d\mu_0 \ll_{\varepsilon} \lambda_j^{-\frac14+\varepsilon}\,\|f\|_{L^{2,1/2}}
hypotheses_required: [RH, GRH-automorphic]
status: still-conditional
waiting_on: [higher-automorphic]
status_note: >
  The theorem is stated under a Lindelof-type bound, with a parameter a
  between 0 and 1, for the central values of the triple product L-functions
  L(1/2, rho_j x rho_j x rho_j') of the eigenforms (and
  L(1/2, rho_j x rho_j x rho_E) with unitary Eisenstein series when the
  algebra is split). The entry records the case a = 0, which the paper says
  follows from the Grand Riemann Hypothesis for these L-functions; they are
  automorphic L-functions of degree 8 and are not covered. The paper says
  any a < 1 already gives quantum unique ergodicity without the optimal
  rate, and that the exponent -1/4 cannot be lowered.
sources:
