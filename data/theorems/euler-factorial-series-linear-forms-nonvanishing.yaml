  open_questions:
    - >-
      The paper's hypothesis is RH plus GRH for the m-th cyclotomic Dedekind zeta function. Since that zeta function factors into Dirichlet L-functions, this entry records the hypothesis as RH and GRH-Dirichlet. A reviewer should confirm that reading.
    - >-
      Theorems 2.5 and 2.8 of the paper give p-adic lower bounds under the same hypothesis. Theorem 2.8 also uses a cited GRH result on primes in short intervals in arithmetic progressions (Lemma 4.15). They are not recorded here.
