    - >-
      The paper says only "GRH" and cites Davenport; the reduction to Dirichlet L-functions is the drafter's reading of Proposition 19, based on the field in the Bach-Sorenson bound being biquadratic and hence abelian. A reviewer should confirm that the Bach-Sorenson theorem needs nothing beyond the zeros of the zeta function of that field.
    - >-
      The schema has no combinatorics or graph theory field; arithmetic-geometry was chosen because Jacobians of graphs come from tropical geometry.
    - >-
      The year is that of the arXiv version on disk (v2, September 2017).
