id: no-siegel-zeros
title: Nonexistence of Siegel zeros
field: analytic-number-theory
statement_plain: >
  No Dirichlet L-function of a real character modulo q has a real zero
  between 1 - c / log q and 1, for an absolute constant c. As a consequence,
  bounds that were previously ineffective, such as Siegel's lower bound for
  class numbers, get computable constants.
statement_formal: |
  L(\beta, \chi) \ne 0 \quad \text{for real } \chi \bmod q \text{ and } 1 - \frac{c}{\log q} < \beta < 1
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  Under GRH for Dirichlet L-functions there are no real zeros to the right
  of 1/2 at all, so this is immediate. Separately, a manuscript in OpenAI's
  October 2026 release claims this result without any hypothesis ("Uniform
  exclusion of Landau-Siegel zeros"), and human rewrites have appeared as
  preprints (for example arXiv:2610.15483). None of that work is refereed
  yet, so it is noted here and not relied on.
sources:
  - authors: C. L. Siegel
    title: Über die Classenzahl quadratischer Zahlkörper
    year: 1935
    venue: Acta Arith. 1, 83-86
    role: survey
