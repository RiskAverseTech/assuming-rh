id: least-prime-frobenius-traces-opposite-sign
title: Least prime where two elliptic curves have Frobenius traces of opposite sign
field: arithmetic-geometry
statement_plain: >
  Let E_1 and E_2 be semistable elliptic curves over the rationals without
  complex multiplication that are not isogenous over the algebraic closure,
  and let N be the product of their conductors. Then there is a prime p
  with a_p(E_1) a_p(E_2) < 0 and
  p < (32 log N + O((log N)^(1/3)))^2. The paper gives the explicit form
  p < (32 log N + 315 (log N)^(1/3) + 533 log log N)^2.
statement_formal: |
  \exists\, p:\quad a_{E_1}(p)\,a_{E_2}(p) < 0, \qquad p < \Bigl(32\log N + O\bigl(\sqrt[3]{\log N}\bigr)\Bigr)^{2}
hypotheses_required: [RH, GRH-automorphic]
status: still-conditional
waiting_on: [higher-automorphic, modular-form-l-functions]
status_note: >
  The theorem assumes GRH for the Rankin-Selberg L-functions
  L(s, Sym^i E_1 x Sym^j E_2) with i, j in {0, 1, 2}. The case i = j = 0 is
  the Riemann zeta function; the cases with one index 0 are the L-functions
  of E_1, E_2 and their symmetric squares; the rest are Rankin-Selberg
  convolutions of degree up to 9. The paper notes that analytic continuation
  and the functional equation are known for these. It sharpens and makes
  explicit a bound of Bucur and Kedlaya, p << (log N)^2 (log log 2N)^2,
  which assumed GRH for all i, j. The dataset has no earlier entry for this
  problem; the related entries on least non-residues concern Dirichlet
  characters.
sources:
