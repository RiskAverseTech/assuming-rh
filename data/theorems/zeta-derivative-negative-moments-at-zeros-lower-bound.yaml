id: zeta-derivative-negative-moments-at-zeros-lower-bound
title: Lower bounds for all negative discrete moments of zeta'(rho)
field: analytic-number-theory
statement_plain: >
  Let J_k(T) be the sum of |zeta'(rho)|^(2k) over the non-trivial zeros rho
  of the Riemann zeta function with 0 < Im(rho) <= T. For every real k < 0
  and all large T, J_k(T) is at least a positive constant (depending on k)
  times T (log T)^((k+1)^2).
statement_formal: |
  J_k(T) = \sum_{0 < \Im(\rho) \le T} |\zeta'(\rho)|^{2k} \gg_k T (\log T)^{(k+1)^2} \qquad (k < 0)
hypotheses_required: [RH, PLUS-EXTRA]
status: still-conditional
waiting_on: [extra-assumption]
status_note: >
  The extra assumption is that all zeros of the Riemann zeta function are
  simple, which is needed even to define J_k(T) for negative k and does not
  follow from the Riemann Hypothesis. This extends the lower bounds of Heap,
  Li and Zhao from rational k < 0 to all real k < 0. The paper remarks that
  the bound is expected to be sharp only for k >= -3/2. Upper bounds for
  non-negative k are in the entry
  zeta-derivative-moments-at-zeros-upper-bound.
