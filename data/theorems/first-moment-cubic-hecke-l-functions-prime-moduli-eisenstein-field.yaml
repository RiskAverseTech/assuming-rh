id: first-moment-cubic-hecke-l-functions-prime-moduli-eisenstein-field
title: First moment of cubic Hecke L-functions of prime moduli over the Eisenstein field
field: analytic-number-theory
statement_plain: >
  Let K = Q(omega) with omega a primitive cube root of unity, and for a
  prime w of Z[omega] congruent to 1 modulo 9 let chi_w be the cubic residue
  symbol modulo w. For a non-negative Schwartz function W with Mellin
  transform W^, the sum over such primes w of
  log N(w) L(1/2, chi_w) W(N(w)/X) equals
  W^(1) X zeta_K^(3)(3/2) / (h (1 - 3^(-1/2))) + O(X^(12/13 + eps)), where h
  is the order of the ray class group modulo 9 and zeta_K^(3) is the
  Dedekind zeta function of K without its Euler factor at the prime above
  3. The paper proves this as a special case of an asymptotic formula for
  the average of the ratio L(1/2 + alpha, chi_w)/L(1/2 + beta, chi_w).
statement_formal: |
  \sum\nolimits^{*}_{\varpi}\Lambda_K(\varpi)\,L\bigl(\tfrac12,\chi_{3,\varpi}\bigr)\,w\Bigl(\frac{N(\varpi)}{X}\Bigr)=\frac{\widehat{w}(1)X}{\#h_{(9)}}\cdot\frac{\zeta_K^{(3)}(\tfrac32)}{1-3^{-1/2}}+O\bigl(X^{12/13+\varepsilon}\bigr)
hypotheses_required: [GRH-Hecke]
status: still-conditional
waiting_on: [power-residue-characters]
status_note: >
  The paper writes only "GRH". The L-functions involved are Hecke
  L-functions of cubic characters of Q(omega): those of the family, and
  those of the dual characters twisted by ray class characters modulo 9,
  which are bounded under GRH in Section 2. The statement recorded is the
  case alpha = 0 of Theorem 1.2, which is the limit beta to infinity of the
  ratios result, Theorem 1.1; the paper says it improves the error term of
  an earlier first-moment result for this family. Theorem 1.5 deduces the
  one-level density of the same family; a different cubic family over
  Q(omega) is in the dataset entry
  one-level-density-cubic-l-functions-eisenstein-field-support-13-11.
