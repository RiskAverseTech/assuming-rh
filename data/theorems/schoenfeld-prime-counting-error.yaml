id: schoenfeld-prime-counting-error
title: Schoenfeld's explicit error bound for the prime counting function
field: analytic-number-theory
statement_plain: >
  For every x at least 2657, the number of primes up to x differs from the
  logarithmic integral li(x) by less than sqrt(x) ln(x) / (8 pi).
statement_formal: |
  \left|\pi(x) - \operatorname{li}(x)\right| < \frac{\sqrt{x}\,\ln x}{8\pi} \qquad (x \ge 2657)
hypotheses_required: [RH]
status: unlocked
status_note: >
  A Lean 4 formalization of this exact statement exists, in the repository
  cited below (Schoenfeld.schoenfeldPi_of_RH), and was built from source for
  this project on 25 November 2026. It is not marked Lean-verified here,
  because that proof settles its finite ranges with 23 computations that
  Lean runs as compiled code and does not re-check in its kernel, so it
  rests on more than Lean's three standard axioms. The same repository
  proves the bound with the weaker constant 9/20 in place of 1/(8 pi), for
  the same range of x, and that version depends only on the three standard
  axioms (Schoenfeld.piBound_of_RH).
sources:
