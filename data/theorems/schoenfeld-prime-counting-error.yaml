id: schoenfeld-prime-counting-error
title: Schoenfeld's explicit error bound for the prime counting function
field: analytic-number-theory
statement_plain: >
  For every x at least 2657, the number of primes up to x differs from the
  logarithmic integral li(x) by less than sqrt(x) ln(x) / (8 pi).
statement_formal: |
  \left|\pi(x) - \operatorname{li}(x)\right| < \frac{\sqrt{x}\,\ln x}{8\pi} \qquad (x \ge 2657)
hypotheses_required: [RH]
