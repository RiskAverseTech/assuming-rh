      The paper's own one-line description of GRH (zeros of "L-functions L(s, chi_k)") is ambiguous and could be read as Dirichlet L-functions. The code ERH-Dedekind follows the existing entries for Koiran's theorem and its parametric extension, on which the proof depends; a reviewer should confirm against Koiran's paper.
