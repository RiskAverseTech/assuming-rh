  confidence: medium
  open_questions:
    - >-
      The paper never says which L-functions its GRH covers. ERH-Dedekind is
      inferred from its reliance on the Lagarias-Odlyzko effective
      Chebotarev theorem; the proof also uses a result from the authors'
      earlier paper [6], which was not checked for further hypotheses.
    - >-
      The paper uses two different symbols for effective and non-effective
      implied constants, which the text extraction renders identically; the
      assignment (Theorem 1 non-effective, Theorem 2 effective) follows the
      introduction.
