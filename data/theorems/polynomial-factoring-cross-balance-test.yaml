  open_questions:
    - >-
      The paper never says which L-functions its ERH covers. If Lemma 9 of Evdokimov (1994) needs only non-residues in the prime field F_p, the codes should be GRH-Dirichlet alone and the status unlocked.
    - >-
      The first claim of Theorem 1.1 (some graph is not regular) appears to use only Gao's square root algorithm in F_p and so may already be unlocked on its own. This was inferred, not stated in the paper.
