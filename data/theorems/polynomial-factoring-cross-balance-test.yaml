id: polynomial-factoring-cross-balance-test
title: Deterministic factoring of polynomials that are not cross balanced
field: computational-number-theory
statement_plain: >
  Let f be a monic, square-free, completely splitting polynomial of degree n
  over the prime field F_p, and let G_1, ..., G_k be the directed graphs on
  the roots of f that the algorithm builds from k deterministically chosen
  auxiliary polynomials. If some G_l is not regular, a nontrivial factor of f
  is found in deterministic time l (n log p)^O(1). If all G_l are regular and
  G_l differs from G_(l-1) for at least ceil(log_2 n) values of l, then f is
  factored in time k (n log p)^O(1).
statement_formal: null
hypotheses_required: [GRH-Dirichlet, GRH-Hecke]
status: still-conditional
status_note: >
  Classified cautiously. The paper assumes ERH throughout and does not define
  it or say where it enters. The graphs are defined through Gao's square root
  algorithm, which needs a primitive 2^e-th root of unity in F_p, that is a
  quadratic non-residue modulo p, and that needs Dirichlet L-functions only.
  The last step of the second claim cites Lemma 9 of Evdokimov (1994) to turn
  a nontrivial endomorphism into a factor, and this draft could not confirm
  which hypothesis that lemma uses. The Hecke code is listed for that reason.
  This extends Gao's square balance test and is a different result from the
  entry deterministic-polynomial-factoring.
