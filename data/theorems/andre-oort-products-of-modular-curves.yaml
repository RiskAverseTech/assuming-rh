  open_questions:
    - >-
      The move to proved-otherwise rests on the abstract of the Pila, Shankar and Tsimerman paper, which says it proves the Andre-Oort conjecture in full generality. Only the abstract was read, and its publication status was not checked.
    - >-
      Proposition 6.1 is applied to composita of the CM fields, which contain real quadratic subfields as well; these are still abelian over Q, so the classification does not change, but the paper's phrase 'GRH for imaginary quadratic fields' is slightly narrower than what Proposition 6.1 literally asks of M.
    - >-
      The year is that of the arXiv version on disk (v2, October 2004); no journal reference is printed in the text.
