id: andre-oort-products-of-modular-curves
title: The Andre-Oort conjecture for products of modular curves
field: arithmetic-geometry
statement_plain: >
  Let Sigma be any set of special (CM) points in a finite product of modular
  curves. Then every irreducible component of the Zariski closure of Sigma is
  a special subvariety, that is, it is cut out by fixing some coordinates to
  be CM points and imposing isogeny relations between other coordinates.
statement_formal: null
hypotheses_required: [GRH-Dirichlet, RH]
status: proved-otherwise
status_note: >
  Now known without any hypothesis: this is a case of the Andre-Oort
  conjecture, which Pila, Shankar and Tsimerman report proving in full
  generality (2021). What follows describes the earlier conditional proof.
  The hypothesis in the paper is "GRH for imaginary quadratic fields". It is
  used for class number lower bounds and for the effective Chebotarev theorem
  of Lagarias, Montgomery and Odlyzko applied to a compositum M of quadratic
  fields, to find small primes that split in M. Such a field M is abelian
  over the rationals, so its Dedekind zeta function is a product of the
  Riemann zeta function and quadratic Dirichlet L-functions. The paper also
  proves the statement without any hypothesis when Sigma lies in a single
  isogeny class (Theorem 1.3), and notes that Andre had proved the case of a
  product of two modular curves unconditionally.
