id: explicit-mertens-theorems-number-fields
title: Explicit Mertens theorems for number fields
field: analytic-number-theory
statement_plain: >
  Let K be a number field of degree n and discriminant D. For all x >= 2,
  the sum of log N(p)/N(p) over prime ideals p of norm at most x equals
  log x + A(x) with |A(x)| <= 4.73 log|D| + 9.27 n + log 2, and the sum of
  1/N(p) over the same prime ideals equals log log x + M_K + B(x) with
  |B(x)| <= (13.47 log|D| + (26.37 + 0.12 log x) n) / sqrt(x), where M_K is
  a constant depending on K. An explicit product formula of Mertens type
  follows.
statement_formal: |
  \Bigl|\sum_{N(\mathfrak{p}) \le x} \frac{1}{N(\mathfrak{p})} - \log\log x - M_K\Bigr| \le \frac{13.47 \log|\Delta_K| + (26.37 + 0.12 \log x)\, n_K}{\sqrt{x}}, \qquad x \ge 2
hypotheses_required: [ERH-Dedekind]
status: partial
waiting_on: [single-field-zeta]
status_note: >
  The paper defines GRH as the statement that the non-trivial zeros of the
  Dedekind zeta function of K lie on the line Re s = 1/2. When K is abelian
  over the rationals (for example quadratic or cyclotomic) this zeta
  function is a product of Dirichlet L-functions, so the bounds are unlocked
  for those fields. For other fields the result stays conditional.
