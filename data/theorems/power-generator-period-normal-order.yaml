  open_questions:
    - >-
      The footnote says "L-functions associated with certain Kummer extensions" without saying whether these are Dedekind zeta functions or Artin L-functions of the extensions. ERH-Dedekind is chosen because the bound used is a count of primes splitting completely, as in Hooley; the status is still-conditional under either reading.
