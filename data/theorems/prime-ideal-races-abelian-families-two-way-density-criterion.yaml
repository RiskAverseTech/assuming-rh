  open_questions:
    - >-
      The identification of the Artin L-functions of an abelian extension of Q with Dirichlet L-functions is standard (Kronecker-Weber) but is not spelled out in the paper, which says only that they are Hecke L-functions.
    - >-
      The plain statement paraphrases the paper's definition of a uniformly 2-moderate family (Definition 1.1); the direction of the inequality in the race follows the paper's set P_{L/K}(C_1, C_2).
