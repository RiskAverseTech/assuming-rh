id: divisor-moments-polynomials-eigenform-coefficients-sato-tate-interval
title: Divisor moments of polynomial values at prime-indexed newform coefficients with Sato-Tate angle in an interval
field: analytic-number-theory
statement_plain: >
  Let f be a non-CM newform of weight k >= 2 and level N with integral
  Fourier coefficients a_f(n), write a_f(p) = 2 p^((k-1)/2) cos theta_f(p),
  and let F be a product of s pairwise distinct irreducible polynomials with
  integer coefficients. Let I be a proper subinterval of [0, pi] of positive
  Sato-Tate measure and m >= 1. Then the average of d(F(a_f(p)))^m over the
  primes p <= x not dividing N with theta_f(p) in I and F(a_f(p)) nonzero
  has order of magnitude (log x)^(s (2^m - 1)), with implied constants
  independent of I. Here d is the number of divisors function.
statement_formal: |
  \frac{1}{\#\Pi(x,I;F,f)}\sum_{p\in\Pi(x,I;F,f)} d\bigl(F(a_f(p))\bigr)^m \asymp_{f,F,m} (\log x)^{s(2^m-1)},\qquad \Pi(x,I;F,f)=\{p\le x : p\nmid N,\ \theta_f(p)\in I,\ F(a_f(p))\ne 0\}
hypotheses_required: [ERH-Dedekind, GRH-automorphic, PLUS-EXTRA]
status: still-conditional
waiting_on: [galois-extensions, higher-automorphic, extra-assumption]
status_note: >
  The paper's Remark 1.2 says GRH means two things: the Riemann Hypothesis
  for Dedekind zeta functions (used for the analytic continuation of a zeta
  function attached to cycle types and for the effective Chebotarev theorem
  in the fields cut out by the mod delta Galois representations of f), and
  GRH for L(s, Sym^m f x chi) for every irreducible character chi of a
  Galois group Gal(K/Q) inside GL_2(Z/delta). The extra assumption is the
  paper's Hypothesis A: these L-functions L(s, Sym^m f x chi) have the
  expected gamma factors, entire continuation of order 1, functional
  equation and conductor bound. For I = [0, pi] Hypothesis A is not needed,
  and that case is contained in the dataset entry
  divisor-moments-polynomials-in-eigenform-coefficients-at-primes (from a
  later paper of the same author, which also allows non-square-free F and
  non-rational coefficient fields); this entry records the version with a
  Sato-Tate restriction. For F(T) = T the paper says the theorem recovers an
  earlier result of Lau and the same author.
