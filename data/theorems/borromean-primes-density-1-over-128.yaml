  confidence: medium
  open_questions:
    - >-
      The paper does not define GRH. The entry takes it to be the Riemann Hypothesis for the Dedekind zeta functions of the fields to which the effective Chebotarev theorem is applied. The zeta function of the degree 16 field factors into Dirichlet L-functions and L-functions of dihedral type (Hecke characters of quadratic fields), so GRH-Hecke for those characters would also suffice; this refinement is not in the paper.
