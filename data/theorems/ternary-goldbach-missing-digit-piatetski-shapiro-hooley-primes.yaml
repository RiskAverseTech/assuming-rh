    - "The paper never defines GRH. The reading that only Dirichlet L-functions are used rests on where the hypothesis is applied (Lemma 5.1, the proof of the lemma after Lemma 5.2, and sums over primes congruent to 1 mod d) and on results quoted from the authors' earlier paper, which was not read."
    - "Theorem 1.2 as printed omits the missing-digit condition on p_1 and writes 'gamma* <= 1'; the statement here follows the abstract, which says p_1 has no digit a_0 and gamma* < gamma_0 <= 1."
