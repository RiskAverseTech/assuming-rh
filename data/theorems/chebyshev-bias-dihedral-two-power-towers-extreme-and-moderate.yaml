  open_questions:
    - >-
      The detailed version (Theorem 4.18) is stated under GRH and LI for the fields D_n, while the introduction's Theorem 2 says GRH and LI+; the entry follows Theorem 2. For dihedral groups there are no symplectic characters, so the two may coincide.
    - >-
      The exponent in the moderate bias bound is 2^(-n/3) in Theorem 2; the table in Theorem 4.18 is garbled in the text extraction and was not compared.
