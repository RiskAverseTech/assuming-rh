id: chebyshev-bias-dihedral-two-power-towers-extreme-and-moderate
title: Extreme, moderate and absent Chebyshev biases in a tower of dihedral extensions of 2-power degree
field: analytic-number-theory
statement_plain: >
  There are absolute constants c_1, c_2, c_3 > 0 and number fields D_n,
  n >= 3, Galois over Q with dihedral group of order 2^n generated by r of
  order 2^(n-1) and s of order 2, such that the following holds for the
  logarithmic density delta(D_n/Q, C_a, C_b) of the set of x at which
  Frobenius elements up to x fall in the class C_a proportionally more often
  than in C_b. Writing -1 for r^(2^(n-2)): the race between the classes of 1
  and -1 is extremely biased, with
  c_1 exp(-c_2 2^n) < delta(D_n/Q, C_1, C_(-1)) < exp(-c_3 2^n / n); the
  race between -1 and s is moderately biased, with
  0 < 1/2 - delta(D_n/Q, C_(-1), C_s) << 2^(-n/3); and the races between
  r^k and s, and between r^k and rs, are unbiased (density exactly 1/2)
  for odd k with 1 <= k <= 2^(n-2) - 1.
statement_formal: |
  c_1\exp(-c_2 2^n) < \delta(D_n/\mathbb{Q}, C_1, C_{-1}) < \exp\!\left(-c_3\tfrac{2^n}{n}\right),\qquad 0 < \tfrac12 - \delta(D_n/\mathbb{Q}, C_{-1}, C_s) \ll 2^{-n/3},\qquad \delta(D_n/\mathbb{Q}, C_{r^k}, C_s) = \delta(D_n/\mathbb{Q}, C_{r^k}, C_{rs}) = \tfrac12 \ \ (k \text{ odd})
hypotheses_required: [GRH-Artin, PLUS-EXTRA]
status: still-conditional
waiting_on: [extra-assumption]
status_note: >
  The paper's GRH (Conjecture 1.6) is the Riemann Hypothesis for the Artin
  L-functions L(s, chi, L/K) of the irreducible characters of the Galois
  group; here these are the Artin L-functions of the dihedral extensions
  D_n/Q, which include two-dimensional ones that are not Dirichlet
  L-functions. The extra assumption is the paper's LI+ (Conjecture 1.9):
  the positive imaginary parts of the zeros of these Artin L-functions are
  linearly independent over the rationals, orthogonal and unitary characters
  have non-vanishing L-function at 1/2, and a symplectic irreducible
  character chi has order of vanishing (1 - W(chi))/2 at 1/2. Artin's
  holomorphy conjecture is known for these groups, as the paper notes. The
  full list of class pairs is in Theorem 4.18 of the paper; Theorem 3 gives
  the analogue for generalized quaternion groups, where the sign of the bias
  depends on whether the Dedekind zeta function vanishes at 1/2.
