id: eighth-moment-dirichlet-l-functions
title: Asymptotic for the eighth moment of Dirichlet L-functions averaged over moduli
field: analytic-number-theory
statement_plain: >
  The eighth moment of the completed Dirichlet L-functions, summed over
  primitive even characters chi mod q, over moduli q of size about Q with a
  smooth weight, and integrated along the critical line, has the asymptotic
  predicted by the moment conjectures, with leading constant 24024 a_4 and an
  error term O(Q^2 (log Q)^(15+eps)). The main term has order Q^2 (log Q)^16.
statement_formal: |
  \sum_{q}\Psi\!\left(\tfrac{q}{Q}\right)\sum_{\substack{\chi \bmod q\\ \text{primitive, even}}}\int_{-\infty}^{\infty}\left|\Lambda\!\left(\tfrac12+iy,\chi\right)\right|^{8}dy
  = 24024\,a_4\sum_{q}\Psi\!\left(\tfrac{q}{Q}\right)\prod_{p\mid q}\frac{\left(1-\frac1p\right)^{7}}{1+\frac9p+\frac9{p^2}+\frac1{p^3}}\,\varphi^{\flat}(q)\,\frac{(\log q)^{16}}{16!}\int_{-\infty}^{\infty}\left|\Gamma\!\left(\tfrac{1/2+iy}{2}\right)\right|^{8}dy
  + O\!\left(Q^{2}(\log Q)^{15+\epsilon}\right)
hypotheses_required: [RH, GRH-Dirichlet]
status: proved-otherwise
status_note: >
  Now known without any hypothesis: Chandee, Li, Matomaki and Radziwill
  (2023) prove the same asymptotic unconditionally, and their abstract says
  so. What follows describes the earlier conditional proof.
  Here Psi is smooth and compactly supported in [1, 2], phi-flat(q) is the
  number of primitive even characters mod q, and a_4 is the Euler product
  over p of (1 - 1/p)^9 (1 + 9/p + 9/p^2 + 1/p^3). The paper says GRH is used
  to bound an eighth moment of Dirichlet L-functions in the t-aspect. The
  same paper has a second conditional result (Theorem 1.2) for Dirichlet
  twists of a GL(2) L-function, which would need more than Dirichlet
  L-functions and is not part of this entry.
