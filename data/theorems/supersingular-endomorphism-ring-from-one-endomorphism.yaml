id: supersingular-endomorphism-ring-from-one-endomorphism
title: Endomorphism ring of a supersingular curve from one known endomorphism
field: computational-number-theory
statement_plain: >
  There is a classical algorithm that, given a supersingular elliptic curve E
  and an endomorphism alpha of E that is not an integer, computes the
  endomorphism ring of E in expected time l^O(1) |disc(Z[alpha])|^(1/4),
  where l is the length of the input. There is a quantum algorithm for the
  same task with expected running time l^O(1) L_{|disc(Z[alpha])|}[1/2],
  which is subexponential.
statement_formal: |
  \text{expected time } l^{O(1)}\,|\mathrm{disc}(\mathbb{Z}[\alpha])|^{1/4} \text{ (classical)}, \qquad l^{O(1)}\,L_{|\mathrm{disc}(\mathbb{Z}[\alpha])|}[1/2] \text{ (quantum)}
hypotheses_required: [GRH-Hecke]
status: still-conditional
waiting_on: [class-group-characters]
status_note: >
  The paper marks its conditional results with "GRH" and gives no formal
  definition. The hypothesis enters through two cited results: a theorem of
  Childs, Jao and Soukharev that random walks on the Cayley graph of the
  class group of an imaginary quadratic order, generated by prime ideals of
  norm at most (log |disc|)^(2 + eps), mix rapidly (Proposition 1), and
  Wesolowski's reduction of the oriented endomorphism ring problem to the
  vectorization problem for the class group action (Proposition 3). The first
  is a statement about L-functions of characters of class groups of quadratic
  orders, which are Hecke characters and in general not Dirichlet characters.
  The paper says earlier algorithms with these running times relied on
  heuristic assumptions. Its division and primitivization algorithms are
  unconditional.
