id: chevalley-groups-z-one-over-p-unitriangular-length-6
title: Unitriangular factorization of length 6 for Chevalley groups over Z[1/p]
field: algebraic-number-theory
statement_plain: >
  Let Phi be a reduced irreducible root system and p a rational prime. Then
  the simply connected Chevalley group G = G(Phi, Z[1/p]) is the product of
  six unitriangular subgroups, G = U U^- U U^- U U^-, where U and U^- are the
  unipotent radicals of the standard Borel subgroup and of its opposite.
statement_formal: |
  G\bigl(\Phi, \mathbb{Z}[\tfrac1p]\bigr) = \Bigl(U\bigl(\Phi, \mathbb{Z}[\tfrac1p]\bigr)\, U^{-}\bigl(\Phi, \mathbb{Z}[\tfrac1p]\bigr)\Bigr)^{3}
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The paper writes only "Generalised Riemann's Hypothesis". The proof reduces
  to SL(2, Z[1/p]) and uses the fact that every residue class c mod d with d
  coprime to p contains infinitely many primes q for which p is a primitive
  root modulo q. The paper takes this from the conditional results on Artin's
  conjecture in arithmetic progressions (it cites Moree and a later complete
  proof). Those results follow Hooley's method, which needs the Riemann
  Hypothesis for Dedekind zeta functions of Kummer fields; compare the entry
  primitive-root-primes-in-progression-density. The same paper proves
  unconditionally a factorization of length 4 over rings of stable rank 1.
sources:
