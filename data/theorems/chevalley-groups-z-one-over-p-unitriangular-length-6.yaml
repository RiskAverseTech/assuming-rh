  open_questions:
    - >-
      The paper does not say which L-functions its hypothesis covers. The code ERH-Dedekind is this project's reading of the cited conditional theorem on primitive roots in arithmetic progressions.
    - >-
      Only the existence of infinitely many primes q in a progression with p a primitive root is used, not a density. If that weaker statement were known unconditionally for the needed progressions the theorem would follow, but the paper does not claim this.
