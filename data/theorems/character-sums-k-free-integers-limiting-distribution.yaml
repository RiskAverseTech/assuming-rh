  open_questions:
    - >-
      The extra assumption is printed as a bound T^(1 + 1/k - eps) 'for all eps > 0'; it was read from the PDF and is recorded as printed, although the intended quantifier is probably 'for some eps > 0' (Lemma 4.1 says 'there is an eps').
    - >-
      Whether RH for zeta alone suffices for even k and GRH for L(s, chi) alone for odd k follows the paper's case split and the remark in the author's earlier paper; the theorem itself just says 'the generalized Riemann hypothesis'.
