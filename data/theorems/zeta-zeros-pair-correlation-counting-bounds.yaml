    - >-
      The paper's main contribution is the optimal majorants and minorants (Theorems 2 to 5); I recorded Corollary 9 because it is the cleanest explicit statement that needs only the Riemann Hypothesis. A reviewer may prefer Theorem 1 with Theorem 2.
    - >-
      The constants in the formula were read from the extracted text (7/6 and 1/(2 pi^2 beta)) and are consistent with Theorem 2 and the bound N*(T) <= (4/3 + o(1)) N(T) used in the proof.
