id: zeta-zeros-pair-correlation-counting-bounds
title: Upper and lower bounds for the pair correlation count of zeta zeros
field: analytic-number-theory
statement_plain: >
  Let N(T) be the number of nontrivial zeros of the zeta function with
  ordinate in (0, T], and N(T, beta) the number of pairs of such ordinates
  gamma, gamma' with 0 < gamma' - gamma <= 2 pi beta / log T. Then for beta
  with beta sqrt(log log T / log T) tending to 0 and T sufficiently large,
  N(T, beta)/N(T) lies between beta - 7/6 + 1/(2 pi^2 beta) + O(1/beta^2) + o(1)
  and beta + 1/(2 pi^2 beta) + O(1/beta^2) + o(1).
statement_formal: |
  \beta - \frac{7}{6} + \frac{1}{2\pi^2\beta} + O\!\left(\frac{1}{\beta^2}\right) + o(1) \le \frac{N(T,\beta)}{N(T)} \le \beta + \frac{1}{2\pi^2\beta} + O\!\left(\frac{1}{\beta^2}\right) + o(1)
hypotheses_required: [RH]
status: unlocked
status_note: >
  This is Corollary 9 of the paper, which needs no assumption beyond the
  Riemann Hypothesis. The paper proves sharper statements under an extra
  assumption that almost all zeros are simple (condition (1.11)): then the
  lower bound improves to beta - 1 + 1/(2 pi^2 beta) + O(1/beta^2), and
  N(T, 0.606894) >> N(T) (Theorem 7). Those results are not recorded here.
  The paper also has an analogue for Dirichlet L-functions (Theorem 18).
sources:
  - authors: E. Carneiro, V. Chandee, F. Littmann, M. B. Milinovich
