id: index-of-g-mod-p-residue-class-density-close-to-average
title: The density of primes with index of g in a residue class is close to its average over finite fields
field: analytic-number-theory
statement_plain: >
  Let g be a rational number that is not of the form g_0^h or -g_0^h with
  g_0 rational and h > 1, and let D(g) be the discriminant of
  Q(sqrt(|g|)). Put m = lcm(2, D(g)) if g > 0; if g < 0 put m = D(g)/2
  when D(g) is 4 mod 8 and m = lcm(4, D(g)) otherwise. Let rho_g(a, d) be
  the natural density of the primes p for which the index of the subgroup
  generated by g in the multiplicative group mod p is congruent to a mod d,
  and let rho(a, d) = A times the sum of r(t) over t congruent to a mod d,
  where A is Artin's constant and r(t) = t^(-2) times the product over
  primes q dividing t of (q^2 - 1)/(q^2 - q - 1). Then
  |rho_g(a, d) - rho(a, d)| <= 2^(omega(m) + 2) / (m phi(m)). In particular
  rho_g(a, d) tends to rho(a, d) as D(g) tends to infinity.
statement_formal: |
  \bigl|\rho_g(a,d)-\rho(a,d)\bigr|\le \frac{2^{\omega(m)+2}}{m\,\varphi(m)},\qquad \rho(a,d)=A\sum_{t\equiv a\ (\text{mod } d)} r(t),\quad r(t)=\frac{1}{t^2}\prod_{q\mid t}\frac{q^2-1}{q^2-q-1}
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The paper's main results are unconditional: rho(a, d) is the density of
  elements of index congruent to a mod d in the multiplicative group of
  F_p, averaged over primes p (Theorem 4), and similarly for the order.
  The hypothesis enters only for the comparison with a fixed g. The paper
  writes only "GRH"; it is used through the existence and formula of the
  density of primes p for which g has index t, a sum of
  mu(n) / [Q(zeta_(nt), g^(1/(nt))) : Q], which the paper cites from
  Hooley-type work of Lenstra, Wagstaff and Pappalardi. That method uses
  the Dedekind zeta functions of the Kummer fields Q(zeta_n, g^(1/n)),
  which are not abelian over the rationals. The paper also gives the
  analogous bound for a single index t (Proposition 2):
  |delta(N_g(t)) - A r(t)| <= 2.21 / (t m_1 phi(t m_1)) with
  m_1 = m / gcd(t, m).
