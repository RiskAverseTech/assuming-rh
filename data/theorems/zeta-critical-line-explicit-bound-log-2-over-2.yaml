id: zeta-critical-line-explicit-bound-log-2-over-2
title: Explicit bound for zeta on the critical line with leading constant (log 2)/2
field: analytic-number-theory
statement_plain: >
  For all t >= exp(exp(19)), |zeta(1/2 + it)| is at most
  exp( (log 2 / 2) log t / log log t + 1.455 log t / (log log t)^2 ).
statement_formal: |
  \left|\zeta\!\left(\tfrac12+it\right)\right| \le \exp\!\left(\frac{\log 2}{2}\,\frac{\log t}{\log\log t} + 1.455\,\frac{\log t}{(\log\log t)^2}\right) \qquad (t \ge e^{e^{19}})
hypotheses_required: [RH]
status: unlocked
status_note: >
  This is Corollary 2.1, the Riemann zeta case of the paper's bounds for
  log |L(s)| for functions L in the Selberg class, which in general assume
  the Generalized Riemann Hypothesis for L together with RH for zeta (and,
  for the explicit versions, a polynomial Euler product and the strong
  lambda-conjecture). Only the zeta case is recorded here. The leading
  constant (log 2)/2 is that of Chandee and Soundararajan; the paper says its
  corollary is better than Chandee's earlier explicit bound for all
  t >= exp(exp(19)). Related entries: explicit-s-s1-zeta-critical-line-bounds
  (explicit, all t >= 2 pi, leading constant 0.995) and
  zeta-critical-line-bound-lower-order-terms (not explicit in t).
sources:
