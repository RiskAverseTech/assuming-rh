  confidence: medium
  open_questions:
    - >-
      The paper writes ERH without restating its definition. It is read here as the hypothesis for the Hecke L-functions into which the zeta function of E factors, as in the proof.
    - >-
      The asymptotic statement is for abelian extensions. The paper says it extends to Galois extensions with sigma replaced by its conjugacy class.
