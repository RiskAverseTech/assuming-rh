    - >-
      The RH equivalence recorded here (tau = 1) is Li's criterion and is due to Li, not to the cited paper; the paper's new content is the family indexed by tau.
    - >-
      The paper remarks that its indexing of the coefficients differs from the convention of Bombieri and Lagarias away from tau = 1; at tau = 1 the two agree.
