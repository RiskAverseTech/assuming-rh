id: li-criterion-zero-free-half-planes
title: Li's criterion and its extension to zero-free half-planes
field: analytic-number-theory
statement_plain: >
  Let xi(s) = s (s - 1) pi^(-s/2) Gamma(s/2) zeta(s) and let lambda_n be
  1/(n-1)! times the n-th derivative of s^(n-1) log xi(s) at s = 1. Then
  lambda_n >= 0 for every positive integer n.
statement_formal: |
  \lambda_n = \frac{1}{(n-1)!} \frac{d^n}{ds^n}\Bigl[s^{n-1} \log \xi(s)\Bigr]_{s=1} \ge 0 \quad \text{for all } n \ge 1
hypotheses_required: [RH]
status: unlocked
status_note: >
  This statement is equivalent to RH. It is Li's criterion, due to X.-J. Li
  (1997). The cited paper re-proves it as the case tau = 1 of a more general
  result (Theorem 1): for tau >= 1/2, the half-plane Re(s) > tau/2 contains
  no zero of zeta if and only if alpha_n(tau) >= 0 for all positive integers
  n, where alpha_n(tau) is defined like lambda_n with the derivative taken at
  s = tau. For tau > 1 that general statement is equivalent to a zero-free
  half-plane weaker than RH, not to RH.
  One direction of Li's criterion is formalized in Lean 4 in the repository
  cited below: from Mathlib's RiemannHypothesis, lambda_n > 0 for every
  positive n (RiemannHypothesis.li_criterion_rhs_of_RH), built for this
  project on 25 November 2026 with Lean's three standard axioms only. There
  lambda_n is defined as a sum over the zeros of zeta, following the
  formal-conjectures project, and not through the derivative of log xi as in
  this entry. The two definitions agree by a classical identity that is not
  part of what Lean checked, so this entry is not marked Lean-verified.
