      The shifted moment bounds are quoted from another paper (reference [6], Corollary 1.4), which was not checked; if that proof also uses GRH for the symmetric square L-function of f or for Dirichlet L-functions, the codes stay within GRH-automorphic plus GRH-Dirichlet and the status is unchanged.
    - >-
      The introduction describes the sum as over odd, positive, square-free d, while the starred sum is defined earlier as over fundamental discriminants; the entry follows the description given with the definition of T_m.
