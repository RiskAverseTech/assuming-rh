review:
  state: ai-classified
  checked_by: null
  checked_on: null
  confidence: medium
  open_questions:
    - >-
      The paper does not define ERH beyond quoting the conditional effective Chebotarev theorem; the entry takes it to be the Riemann Hypothesis for the Dedekind zeta functions of the Galois extensions that theorem is applied to.
    - >-
      The formula for PR(j) was read from extracted text with a garbled display; the reading PR(j) = prod_{k>=0} 1/(1+p^(-k)) times prod_{k=1}^{j} p/(p^k - 1) matches the paper's Table 1 values for PR(0) (0.3195 for p = 3) but should be checked against the PDF.
