  confidence: medium
  open_questions:
    - >-
      The paper does not spell out which L-functions its "GRH" in
      Corollary 1.3 covers; it is read here as RH for zeta_K with K = Q(i)
      together with GRH for the Hecke L-functions over Q(i) for which the
      Lindelof hypothesis is assumed. A proof that obtained the Lindelof
      bound for these Hecke L-functions another way would need only RH for
      zeta_K.
