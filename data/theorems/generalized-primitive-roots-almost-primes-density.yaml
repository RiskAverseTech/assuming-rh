  open_questions:
    - >-
      The paper is in French and does not define GRH formally; it refers to
      "certain number fields" as in Hooley's work. The identification with
      Dedekind zeta functions of Kummer fields follows Hooley's method.
    - >-
      The explicit definitions of W_l(p) and V_l(a_1) are long and the text
      extraction of them is garbled, so they are not reproduced here.
