  open_questions:
    - >-
      The paper never says which L-functions its GRH refers to. The classification as Dirichlet L-functions rests on where it is used: Lemma 4.4, which enlarges the major arcs of the circle method to denominators up to about N^(1/2) following Pintz and Ruzsa. The cited paper of Pintz and Ruzsa was not read.
    - >-
      The paper is a recent preprint; the proof was not checked.
