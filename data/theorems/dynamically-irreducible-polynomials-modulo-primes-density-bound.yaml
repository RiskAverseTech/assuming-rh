id: dynamically-irreducible-polynomials-modulo-primes-density-bound
title: Primes modulo which all iterates of a polynomial stay irreducible are O(Q / (log Q log log Q)) in [Q, 2Q]
field: analytic-number-theory
statement_plain: >
  Let f be a polynomial with integer coefficients whose derivative has the
  form g(X)^2 (aX + b) with g in Z[X] and a nonzero (this includes every
  quadratic polynomial), and assume that -b/a is not a pre-periodic point of
  f. Let P_f(Q) be the number of primes p in [Q, 2Q] such that every iterate
  of f is irreducible modulo p. Then P_f(Q) = O(Q / (log Q log log Q)) for
  Q >= 3, with the implied constant depending only on f.
statement_formal: |
  P_f(Q) = \#\{\, p \in [Q,2Q] : f \bmod p \text{ is dynamically irreducible} \,\} = O_f\!\left(\frac{Q}{\log Q\,\log\log Q}\right)
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The paper writes only "the GRH". In the text it is invoked once, for
  Lemma 2.5, a square-root bound for sums of Jacobi symbols (p/q) over
  primes p <= M, cited from Montgomery and Vaughan; this needs the
  hypothesis only for Dirichlet L-functions of real characters.
  Unconditionally the same paper proves the weaker bound
  (log log log log Q)^(2+o(1)) / (log log log Q) times Q / log Q
  (Theorem 1.2).
