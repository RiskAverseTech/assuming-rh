id: sup-norm-newforms-pgl-n-prime-level-bulk
title: Sub-baseline sup-norm bound in the level aspect for newforms on PGL(n), all n
field: analytic-number-theory
statement_plain: >
  Let n >= 2, let N be a prime, and let phi be an L^2-normalized Hecke-Maass
  cuspidal newform on X_n(N) = Gamma_0(N) \ SL_n(R) / SO(n) with spectral
  parameter mu, where the invariant measure is normalized to have volume
  asymptotic to N^(n-1). Let Omega_N be the bulk of X_n(N) attached to a
  fixed compact set Omega in X_n(1) (the preimage of Omega with a cuspidal
  region removed, as defined in the paper). Then the supremum of |phi| on
  Omega_N is O(N^(-1/(8n) + epsilon)), with the implied constant depending
  on Omega, n, mu and epsilon.
statement_formal: |
  \left\| \phi|_{\Omega_N} \right\|_{\infty} \ll_{\Omega, n, \mu, \varepsilon} N^{-\frac{1}{8n} + \varepsilon}
hypotheses_required: [GRH-automorphic]
status: still-conditional
waiting_on: [higher-automorphic]
status_note: >
  The paper assumes the "Grand Riemann Hypothesis" without listing
  L-functions. In the proof (Lemma 3.1) it is used for the Rankin-Selberg
  L-function L(s, pi x pi~) of the cuspidal automorphic representation pi of
  GL(n) generated by phi, to get a lower bound for a sum of Hecke
  eigenvalues over primes (the paper's hypothesis (1.3)), which gives an
  efficient amplifier. The same paper proves unconditionally the weaker
  bound N^(-1/(4 n^2) + epsilon) when n is prime.
sources:
