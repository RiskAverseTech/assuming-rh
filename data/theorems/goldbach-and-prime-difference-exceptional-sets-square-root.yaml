    - The hypothesis is a quasi-GRH for Dirichlet L-functions, weaker than GRH; coded GRH-Dirichlet because it is implied by it.
    - The paper remarks that a preprint it cites proves a zero-free half-plane Re(s) > 7/8. If that covered all Dirichlet L-functions the theorem would be unconditional, but the paper still states it as conditional and I have not relied on that remark.
