id: cm-elliptic-curve-torsion-odd-degree-upper-order
title: Upper order of torsion of CM elliptic curves over number fields of odd degree
field: arithmetic-geometry
statement_plain: >
  Let T_CM(d) be the largest order of the torsion subgroup of a CM elliptic
  curve over a number field of degree d. As d tends to infinity through odd
  integers, T_CM(d) is at most
  ((24 e^gamma / pi + o(1)) d log log d)^(2/3), where gamma is Euler's
  constant.
statement_formal: |
  T_{\mathrm{CM}}(d) \le \left( \left( \frac{24 e^{\gamma}}{\pi} + o(1) \right) d \log\log d \right)^{2/3} \qquad (d \to \infty,\ d \text{ odd})
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The theorem assumes the Riemann Hypothesis for Dirichlet L-functions. It is
  used through Littlewood's lower bound L(1, (D/.)) >= (pi^2 / (12 e^gamma) +
  o(1)) / log log |D| for fundamental discriminants D, which bounds class
  numbers of imaginary quadratic fields from below. The paper proves
  unconditionally that T_CM(d) >= ((12 e^gamma / pi + o(1)) d log log d)^(2/3)
  for infinitely many odd d, and that T_CM(d) << d^(2/3 + epsilon) for all
  odd d.
