id: arboreal-galois-groups-pcf-polynomials-exponential-lower-bound
title: Exponential lower bound for arboreal Galois groups of post-critically finite polynomials
field: arithmetic-geometry
statement_plain: >
  Let K be a number field, f a post-critically finite polynomial over K of
  degree at least 2, and alpha an element of K such that the pair (f, alpha)
  is not exceptional (for instance alpha not in any critical orbit of f).
  Let G_N(f, alpha) be the Galois group over K of the field generated by
  the solutions of f^N(x) = alpha, where f^N is the N-th iterate. Then there
  is a positive constant c(f, alpha) such that the order of G_N(f, alpha)
  is at least exp(c(f, alpha) N) for all N >= 1.
statement_formal: |
  \# G_N(f,\alpha) \ge \exp\bigl(c(f,\alpha)\cdot N\bigr)\qquad (N\ge 1)
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The abstract says "GRH for number fields". The hypothesis is used once,
  in Proposition 2.3, which applies the conditional effective Chebotarev
  theorem (Lagarias-Odlyzko, in Serre's form) to the Galois extension
  K_N(f, alpha)/K to produce a completely split prime of norm at most a
  power of log of the discriminant. So it is the Riemann Hypothesis for the
  Dedekind zeta functions of the arboreal fields K_N(f, alpha), which are
  not abelian in general. The same paper proves unconditionally an
  exponential lower bound for unicritical post-critically infinite
  polynomials.
sources:
  - authors: C. Pagano
    title: "The size of arboreal images, I: exponential lower bounds for PCF and unicritical polynomials"
    year: 2021
