    - >-
      Remark 2.2 says parts 1 to 5 of Conjecture 2.1 are known for the untwisted L(s, Sym^n f). It does not say so explicitly for the twists by Dirichlet characters, so PLUS-EXTRA was not listed; a reviewer may prefer to add it, as in the entry sato-tate-explicit-error-constant-3-33.
    - >-
      The proof needs only characters modulo the single modulus 23 * 49 * 3094972416000, but Conjecture 2.1 is stated for general primitive characters.
