id: serre-open-image-explicit-conductor-bound
title: Explicit bound for the largest non-surjective prime of an elliptic curve
field: arithmetic-geometry
statement_plain: >
  Let E be an elliptic curve over the rationals without complex
  multiplication and with conductor N_E. The mod l Galois representation of
  E is surjective for every prime l greater than
  964 log rad(2 N_E) + 5760, where rad(n) is the product of the primes
  dividing n.
statement_formal: |
  c(E)\le 964\log\operatorname{rad}(2N_E)+5760
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The paper says the hypothesis is GRH for Dedekind zeta functions. It is
  used through the effective Chebotarev density theorem of Lagarias and
  Odlyzko for Galois number fields that arise from torsion points of
  elliptic curves; these fields are not abelian over the rationals. The key
  step is Theorem 2, a conditional bound for the least prime p with
  a_p(E_1) different from a_p(E_2) for non-isogenous curves.
sources:
  - authors: J. Mayle, T. Wang
    title: On the effective version of Serre's open image theorem
    year: 2024
    venue: Bulletin of the London Mathematical Society 56, 1399-1416
