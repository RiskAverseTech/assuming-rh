id: two-variable-artin-conjecture-density
title: Two-variable Artin conjecture
field: analytic-number-theory
statement_plain: >
  Let a and b be multiplicatively independent non-zero rational numbers. The
  set of primes p for which b modulo p lies in the subgroup generated by a
  modulo p has a natural density, and this density equals a positive rational
  number c_(a,b) times the constant S, the product over all primes p of
  (1 - p/(p^3 - 1)).
statement_formal: |
  \delta(a,b)=c_{a,b}\prod_{p}\left(1-\frac{p}{p^3-1}\right),\qquad c_{a,b}\in\mathbb{Q}_{>0}
hypotheses_required: [ERH-Dedekind]
status: still-conditional
status_note: >
  The analytic part follows Stephens, who assumes the Riemann hypothesis for
  each of the fields F_(i,j) = Q(zeta_(ij), a^(1/ij), b^(1/i)), and Hooley's
  argument. These fields are not abelian over the rationals. For integers a
  and b that are positive, coprime and not perfect powers the result is
  credited to Stephens, with a corrected value of the constant. Theorem 3 of
  the paper gives c_(a,b) explicitly when Q*/<-1, a, b> is torsion-free.
sources:
