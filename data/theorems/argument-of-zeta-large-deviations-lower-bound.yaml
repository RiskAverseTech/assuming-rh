id: argument-of-zeta-large-deviations-lower-bound
title: Lower bound for the frequency of large values of S(t) up to sqrt(log T / log log T)
field: analytic-number-theory
statement_plain: >
  Let S(t) = (1/pi) Im log zeta(1/2 + it). There are constants kappa, D > 0
  such that for all large T and all V with
  sqrt(log log T) <= V <= kappa sqrt(log T / log log T), the set of t in
  [T, 2T] with S(t) >= V has measure at least
  T exp(-D V^2 / log(log T / (V^2 log V))). The same holds for -S(t).
statement_formal: |
  \operatorname{meas}\{t \in [T, 2T] : S(t) \ge V\} \ge T \exp\!\left(-D\,\frac{V^2}{\log\dfrac{\log T}{V^2 \log V}}\right), \qquad \sqrt{\log\log T} \le V \le \kappa\left(\frac{\log T}{\log\log T}\right)^{1/2}
hypotheses_required: [RH]
status: unlocked
status_note: >
  The paper's unconditional Theorem 1 gives a bound of the same shape only
  in the shorter range V <= kappa (log T / log log T)^(1/3), with V^3 in
  place of V^2 inside the logarithm; the Riemann Hypothesis is used to
  extend the range of V to exponent 1/2. This is a lower bound
  for how often S(t) is large, and complements the pointwise upper bounds
  for S(t) in the entry explicit-s-s1-zeta-critical-line-bounds.
sources:
