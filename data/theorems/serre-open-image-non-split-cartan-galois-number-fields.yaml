id: serre-open-image-non-split-cartan-galois-number-fields
title: Explicit bound excluding non-split Cartan normalizer images for elliptic curves over Galois number fields
field: arithmetic-geometry
statement_plain: >
  Let K be a Galois number field of degree n_K and absolute discriminant
  d_K, and let E be an elliptic curve over K without complex multiplication,
  with conductor ideal N_E. For every prime l at least
  2 C1(K) log Norm(rad(2 N_E)) + 2 C2(K), the image of the mod l Galois
  representation of E is not contained in the normalizer of a non-split
  Cartan subgroup of GL_2(F_l). Here C1(K) = 510.352 + 513.024 n_K and
  C2(K) = 513.024 (1 + (n_K/4) log d_K + n_K log(384 n_K)) + 1324.8 n_K + 45.7.
statement_formal: |
  \ell \ge 2C_1(K)\log N_{K/\mathbb{Q}}\,\mathrm{rad}(2\mathcal{O}_K\mathfrak{N}_E) + 2C_2(K) \ \Longrightarrow\ \rho_{E,\ell}(G_K) \not\subseteq N_{ns}(\ell), \qquad C_1(K) = 510.352 + 513.024\,n_K
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The paper defines GRH as the statement that the Dedekind zeta function of
  a number field has no zeros with real part greater than 1/2. It is needed
  for the effective Chebotarev theorem of Bach and Sorenson, which gives an
  effective isogeny theorem over K (Theorem 4.4) applied to E and a
  quadratic twist. The fields involved are generated by torsion points and
  are not abelian over the rationals. The paper presents this as an
  extension to Galois number fields of the result of Mayle and Wang over
  the rationals, which is the existing entry
  serre-open-image-explicit-conductor-bound. For real quadratic fields
  Q(sqrt(D)) with |D| < 50 the paper deduces (Corollary A) the same bound
  for the largest non-surjective prime, when the image is not contained in
  the normalizer of a split Cartan subgroup.
