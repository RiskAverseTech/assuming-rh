id: one-level-density-gamma1-q-l-functions-support-eight-thirds
title: One-level density for Gamma_1(q) L-functions with Fourier support up to 8/3
field: analytic-number-theory
statement_plain: >
  Let q be prime and k >= 3 odd. Consider the family of L-functions of Hecke
  cusp forms f of weight k for Gamma_0(q) with nebentypus chi, as chi runs
  over the odd characters modulo q, with the harmonic average over f and the
  average over chi. For every even Schwartz function phi whose Fourier
  transform is supported in (-8/3, 8/3), the one-level density of the
  low-lying zeros (scaled by log q / (2 pi)) tends to the integral of phi as
  q grows, which is the unitary prediction of Katz and Sarnak.
statement_formal: |
  \frac{2}{\varphi(q)} \sum_{\substack{\chi \bmod q \\ \chi(-1) = -1}} \; \sum\nolimits^{h}_{f \in H_k(q,\chi)} \; \sum_{\gamma_f} \phi\!\left(\frac{\gamma_f \log q}{2\pi}\right) = \int_{-\infty}^{\infty} \phi(x)\,dx + o(1) \qquad (\operatorname{supp}\hat\phi \subset (-\tfrac83, \tfrac83))
hypotheses_required: [GRH-automorphic, GRH-Dirichlet]
status: still-conditional
waiting_on: [higher-automorphic]
status_note: >
  The paper assumes GRH throughout, introduced for the L-functions L(s, f)
  of the newforms f in H_k(q, chi) (weight k >= 3 odd, prime level q,
  nebentypus chi). It also uses GRH for Dirichlet L-functions L(s, chi) with
  chi modulo q (Lemma 2.4) to bound prime sums twisted by characters. As an
  application (Corollary 1.2) the harmonic proportion of forms in the family
  with non-vanishing central value is at least 5/8.
