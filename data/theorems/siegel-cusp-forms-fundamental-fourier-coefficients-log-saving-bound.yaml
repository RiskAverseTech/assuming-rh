  open_questions:
    - >-
      The refined Gan-Gross-Prasad conjecture for (SO(5), SO(2)) may now be a theorem of Furusawa and Morimoto (the paper only reports an announcement). If so, PLUS-EXTRA and extra-assumption should be removed.
    - >-
      Theorem C in the introduction requires N odd; Theorem 5.14 is stated for squarefree N >= 1. The entry follows Theorem C.
