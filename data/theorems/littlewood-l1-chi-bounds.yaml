id: littlewood-l1-chi-bounds
title: Littlewood's bounds for L(1, chi) and class numbers
field: analytic-number-theory
statement_plain: >
  For a real primitive character chi modulo q, L(1, chi) is at most about
  2 e^gamma log log q and at least about pi^2 / (12 e^gamma log log q). By
  the class number formula, the class number of the imaginary quadratic
  field of discriminant -d is therefore sqrt(d) up to a factor of order
  log log d in both directions.
statement_formal: |
  \bigl(1 + o(1)\bigr)\frac{\pi^2}{12\,e^{\gamma}\log\log q} \;\le\; L(1,\chi) \;\le\; \bigl(1 + o(1)\bigr)\,2e^{\gamma}\log\log q
