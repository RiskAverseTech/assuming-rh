id: smoothed-goldbach-average-multiples-of-q
title: "Smoothed average of Goldbach representations over multiples of q"
field: additive-number-theory
statement_plain: >
  Let psi_2(n) be the sum of Lambda(m) Lambda(m') over m + m' = n, and
  let F_q(N) be the sum of psi_2(n) e^(-n/N) over n divisible by q, with
  F = F_1. Then for q at least 2, F_q(N) = F(N)/phi(q) + O(N log N log q),
  and F(N) = N^2 - 2 sum over zeta zeros rho of Gamma(rho) N^(rho+1) + O(N).
statement_formal: |
  F_q(N) = \frac{1}{\varphi(q)}\,F(N) + O\left(N \log N \log q\right), \qquad F_q(N) = \sum_{q \mid n} \psi_2(n)\,e^{-n/N}
