id: hurwitz-zeta-rational-parameter-moments-sharp-order
title: Sharp order of the moments of the Hurwitz zeta function with rational parameter on the critical line
field: analytic-number-theory
statement_plain: >
  Let alpha = a/q with gcd(a, q) = 1 and 1 <= a <= q, and let
  zeta(s, alpha) be the Hurwitz zeta function. For every real k > 1/2, the
  integral of |zeta(1/2 + it, alpha)|^(2k) over 1 <= t <= T is bounded above
  and below by constant multiples of T (log T)^(k^2). The upper bound holds
  for every k > 0.
statement_formal: |
  T(\log T)^{k^2} \ll \int_1^T \left|\zeta\!\left(\tfrac12+it, \alpha\right)\right|^{2k} dt \ll T(\log T)^{k^2} \qquad \left(\alpha = \tfrac{a}{q},\ k > \tfrac12\right)
hypotheses_required: [GRH-Dirichlet, RH]
status: unlocked
status_note: >
  The hypothesis is the Riemann hypothesis for all Dirichlet L-functions
  modulo q, which includes the principal character and so the Riemann zeta
  function. It enters because zeta(s, a/q) is a linear combination of the
  L(s, chi) with chi modulo q. This removes the epsilon in the exponent of
  the upper bound of Sahay, who had the result for positive integers k
  under the same hypothesis. The corollary is deduced from the paper's main
  theorems, which give the sharp order of mixed moments of products of
  distinct cuspidal automorphic L-functions of GL(m) over Q under GRH and
  the Generalized Ramanujan Conjecture for those L-functions; for Dirichlet
  L-functions the Ramanujan Conjecture is trivially true. The paper also
  deduces sharp moment bounds for Dedekind zeta functions of solvable
  Galois extensions of Q (Corollary 4).
