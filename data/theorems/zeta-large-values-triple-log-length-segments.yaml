id: zeta-large-values-triple-log-length-segments
title: Arbitrarily large values of zeta on critical-line segments of length about log log log T
field: analytic-number-theory
statement_plain: >
  For every fixed constant A there are constants c_0 = c_0(A) > 0 and
  T_0 = T_0(A) such that for every T > T_0 the interval (T - H, T + H) with
  H = (1/pi) log log log T + c_0 contains a point t with
  |zeta(1/2 + it)| > A.
statement_formal: |
  \max_{|t-T|\le H} \left|\zeta\left(\tfrac12+it\right)\right| > A, \qquad H = \frac{1}{\pi}\log\log\log T + c_0(A), \quad T > T_0(A)
hypotheses_required: [RH]
status: unlocked
status_note: >
  The paper presents this as a conditional solution of a problem of
  Karatsuba, who asked for the maximum of |zeta(1/2 + it)| over |t - T| <= H
  to be at least 1 for H as small as log log log T. The same paper proves,
  also under the Riemann Hypothesis, that S(t) = (1/pi) arg zeta(1/2 + it)
  takes values above 3 and below -3 on segments of length
  0.8 log log log T + c_0 (Corollary to Theorem 3), with consequences for
  Gram's law. The dataset entry
  argument-of-zeta-large-values-very-short-intervals records a related
  result of the same author from a different paper.
sources:
