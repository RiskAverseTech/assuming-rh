review:
  state: ai-classified
  checked_by: null
  checked_on: null
  confidence: medium
  open_questions:
    - >-
      The degree 8 field E' in the Chebotarev step is described only as a Galois extension in a tower of successive quadratic extensions E'/E/K/Q. If E' is multiquadratic over Q, then its zeta function is a product of Dirichlet L-functions and the result would be unlocked. This could not be settled from the paper, so the cautious code ERH-Dedekind and status still-conditional were used. A number theorist should check Larson and Vaintrob, Corollary 6.3.
    - >-
      The list of isogeny primes for Q (Mazur's theorem) is taken from the companion paper arXiv:2203.06009, Theorem 1.2.
