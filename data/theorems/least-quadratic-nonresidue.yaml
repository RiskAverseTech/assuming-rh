id: least-quadratic-nonresidue
title: Least quadratic non-residue is below 2 (ln p)^2
field: analytic-number-theory
statement_plain: >
  For every odd prime p, the smallest positive integer that is not a square
  modulo p is less than 2 (ln p)^2. More generally, every proper subgroup of
  the multiplicative group modulo m omits some positive integer below
  2 (ln m)^2.
statement_formal: |
  n_p < 2(\ln p)^2, \qquad n_p = \min\{\, n \ge 1 : n \text{ is not a square modulo } p \,\}
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  Ankeny proved O((log p)^2). Bach gave the constant 2. Lamzouri, Li and
  Soundararajan later improved it to (log q)^2 for prime q at least 5.
  The bound for quadratic non-residues is formalized in Lean 4. The
  repository cited below proves Bach's theorem in character form: if a
  non-trivial Dirichlet character mod m takes the value 1 at every positive
  integer below x, then x is below 2 (ln m)^2. The statement for the least
  quadratic non-residue is deduced from it in the file
  lean/LeastNonresidue.lean of this repository, written for this project.
  Both were compiled on 25 November 2026 and depend only on Lean's three
  standard axioms. For a prime modulus p, the subgroup form is also checked
  in Lean, in lean/SmallGenerators.lean of this repository: every proper
  subgroup of the units modulo p misses a positive integer below 2 (ln p)^2.
  Two consequences are checked in the same file: the units modulo p are
  generated by the positive integers below 2 (ln p)^2, and for every k > 1
  dividing p - 1 some positive integer below 2 (ln p)^2 is not a k-th power
  modulo p. For a composite modulus m the subgroup form with the constant 2
  is not a separate formal theorem here (the cited repository proves a
  version with the constant 270).
  What is checked is the implication from the hypothesis to this result. It
  is not a check of the announced proof, and the build was run by an AI
  system, not reviewed by a person.
