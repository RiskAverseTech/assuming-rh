    year: 1990
    venue: Math. Comp. 55, 355-380
    doi: 10.1090/S0025-5718-1990-1023756-8
    role: refinement
  - authors: Y. Lamzouri, X. Li, K. Soundararajan
    title: Conditional bounds for the least quadratic non-residue and related problems
    year: 2015
