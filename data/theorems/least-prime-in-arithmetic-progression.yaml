id: least-prime-in-arithmetic-progression
title: Least prime in an arithmetic progression
field: analytic-number-theory
statement_plain: >
  For every modulus q greater than 3 and every a coprime to q, the smallest
  prime congruent to a modulo q is at most (phi(q) log q)^2.
statement_formal: |
  p(q, a) \le \left(\varphi(q)\log q\right)^2 \qquad (q > 3,\ \gcd(a,q) = 1)
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  A 2017 corrigendum to this paper changes two asymptotic theorems. It is
  reported not to affect this explicit corollary.
