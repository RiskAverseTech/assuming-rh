id: supersingular-endomorphism-ring-sqrt-p-algorithm
title: Computing a supersingular endomorphism ring in about sqrt(p) time
field: computational-number-theory
statement_plain: >
  There is a probabilistic algorithm that, given a supersingular elliptic
  curve in characteristic p, computes its endomorphism ring in expected time
  O~(p^(1/2)), that is p^(1/2) up to factors polynomial in log p.
statement_formal: |
  \mathrm{EndRing} \text{ is solvable in expected time } \tilde{O}\!\left(p^{1/2}\right)
hypotheses_required: [GRH-Hecke]
status: proved-otherwise
status_note: >
  Algorithms with this running time were known earlier only under the
  generalized Riemann hypothesis, through Wesolowski's conditional
  equivalence of the endomorphism ring problem with the l-isogeny path
  problem (FOCS 2021), and by a more direct approach of Fuselier, Iezzi,
  Kozek, Morrison and Namoijam. Page and Wesolowski prove the bound with no
  hypothesis (Theorem 8.7), using their unconditional reduction of the
  endomorphism ring problem to the isogeny problem. They say the earlier
  unconditional algorithms ran in time O~(p) and returned only a full-rank
  subring.
sources:
  - authors: B. Wesolowski
    title: The supersingular isogeny path and endomorphism ring problems are equivalent
    year: 2022
    venue: 62nd Annual IEEE Symposium on Foundations of Computer Science (FOCS 2021)
