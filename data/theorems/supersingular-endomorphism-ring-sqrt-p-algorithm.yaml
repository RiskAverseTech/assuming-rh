  open_questions:
    - >-
      The earlier conditional paper was not read. Page and Wesolowski say only "the generalised Riemann hypothesis"; the code GRH-Hecke is a cautious guess at what that work needs (primes represented by quadratic forms and class groups), not something this paper states.
    - >-
      The reference details for the earlier paper are copied from the bibliography of the paper read; no DOI or URL is printed there.
    - >-
      The existing entry supersingular-inseparable-endomorphism-sqrt-p records a different conditional theorem from the paper of Fuselier and others; it is related but not the same statement.
