id: serre-surjectivity-mod-l-conductor-bound
title: Serre's bound for the primes where the Galois representation of an elliptic curve is not surjective
field: arithmetic-geometry
statement_plain: >
  Let E be an elliptic curve over the rationals without complex
  multiplication and let N_E be the product of the primes of bad reduction.
  There is an absolute constant c such that the l-adic Galois
  representation of E has image all of GL_2(Z_l) for every prime l with
  l >= c (log N_E) (log log 2 N_E)^3.
statement_formal: |
  \ell \ \ge\ c\,(\log N_E)\,(\log\log 2N_E)^{3} \ \Longrightarrow\ \operatorname{Im}(\rho_\ell) = \mathrm{GL}_2(\mathbb{Z}_\ell)
hypotheses_required: [ERH-Dedekind]
status: still-conditional
status_note: >
  Serre defines (GRH) as the statement that the zeta function of a number
  field has no zero of real part above 1/2. The proof uses the conditional
  effective Chebotarev theorem to bound the least prime p where two
  elliptic curves have different a_p (Théorème 21 and 21'), applied to
  Galois extensions generated by torsion points, which are not abelian over
  the rationals. The constant c is not made explicit in the paper.
sources:
  - authors: J.-P. Serre
    title: Quelques applications du théorème de densité de Chebotarev
    year: 1981
