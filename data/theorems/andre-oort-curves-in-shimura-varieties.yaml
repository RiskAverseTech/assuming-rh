id: andre-oort-curves-in-shimura-varieties
title: Andre-Oort for curves in Shimura varieties (a conjecture of Yves Andre)
field: arithmetic-geometry
statement_plain: >
  Let C be an irreducible closed algebraic curve in a Shimura variety
  Sh_K(G, X). If C contains infinitely many special points, then C is of
  Hodge type, that is, a special subvariety.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: proved-otherwise
status_note: >
  Now known without any hypothesis: this is a case of the Andre-Oort
  conjecture, which Pila, Shankar and Tsimerman report proving in full
  generality (2021). What follows describes the earlier conditional proof.
  The paper assumes "the Generalised Riemann Hypothesis for CM fields". It
  is used through the effective Chebotarev density theorem: to find, for a
  CM field L with large discriminant d_L, many primes below (log d_L)^5
  that split in L (giving a lower bound of the form c (log d_L)^N for
  Galois orbits of special points, Theorem 2.15), and to choose a suitable
  prime for a Hecke correspondence. The same paper proves an unconditional
  result (Theorem 1.3) under an extra condition on the special points.
