  open_questions:
    - >-
      The move to proved-otherwise rests on the abstract of the Pila, Shankar and Tsimerman paper, which says it proves the Andre-Oort conjecture in full generality. Only the abstract was read, and its publication status was not checked.
    - >-
      'GRH for CM fields' was read as the Riemann Hypothesis for Dedekind zeta functions of CM fields (splitting fields of the Mumford-Tate tori of special points), since it is used only for effective Chebotarev.
