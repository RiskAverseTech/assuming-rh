  open_questions:
    - >-
      Theorem 1.1 is worded "for any imaginary quadratic number field K", but the introduction restricts to the nine fields of class number one (d in -1, -2, -3, -7, -11, -19, -43, -67, -163); the entry follows the restriction.
    - >-
      The closest waiting_on family is power-residue-characters (quadratic residue symbols over K); it is not an exact fit since K is cyclotomic only for d = -1 and d = -3.
