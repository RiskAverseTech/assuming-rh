    - >-
      The paper writes only 'GRH'. The code ERH-Dedekind reflects that the proofs go through effective Chebotarev in the GL2-type division fields Q(E[m]) (following Lagarias-Odlyzko, David-Wu and Cojocaru-David) and through the modular polynomial algorithm of Broker, Lauter and Sutherland; the cited papers were not read to see whether some of them also assume Artin's conjecture or GRH for Artin L-functions.
