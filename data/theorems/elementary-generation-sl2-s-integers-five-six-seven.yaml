    - >-
      The hypothesis is used only inside the cited theorems of Cooke and Weinberger, which were not read. The code ERH-Dedekind is taken from the paper's own statement of Hypothesis 3.7.
    - >-
      When K is abelian over Q the fields K(zeta_n, (O^x)^(1/n)) are still not abelian over Q in general, so no special case is marked as covered.
