id: robin-inequality-odd-integers
title: Robin-type inequality for the sum of divisors of odd integers
field: analytic-number-theory
statement_plain: >
  For every odd integer n at least c0 = 18565284664427130919514350125 =
  3^4 * 5^3 * 7^2 * 11 * 13 * ... * 67, the sum of the divisors of n is less
  than (e^gamma / 2) n log log n, where gamma is the Euler-Mascheroni
  constant.
statement_formal: |
  \frac{\sigma(n)}{n \log\log n} < \frac{e^{\gamma}}{2} \qquad (n \text{ odd},\ n \ge 3^4 \cdot 5^3 \cdot 7^2 \cdot 11 \cdot 13 \cdots 67)
hypotheses_required: [RH]
status: unlocked
status_note: >
  This statement is equivalent to RH. The same paper also proves (Theorem
  1.3) that RH is equivalent to an analogue of Lagarias's inequality for all
  odd n at least 3; that result is not part of this entry.
sources:
  - authors: L. C. Washington, A. Yang
    title: Analogues of the Robin-Lagarias Criteria for the Riemann Hypothesis
    year: 2020
