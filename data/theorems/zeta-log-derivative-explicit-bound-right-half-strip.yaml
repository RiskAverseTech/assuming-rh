id: zeta-log-derivative-explicit-bound-right-half-strip
title: Explicit bound for the logarithmic derivative of zeta for 0.6 <= sigma < 1
field: analytic-number-theory
statement_plain: >
  For 0.6 <= sigma < 1 and t >= exp(exp(13)), |zeta'/zeta(sigma + it)| is at
  most ((log t)^(2 - 2 sigma) - sigma 2^(1 - sigma)) / (1 - sigma)
  + 0.518 (log t)^(2 - 2 sigma) + 4 (log t)^(3 - 4 sigma) + 90.
statement_formal: |
  \left|\frac{\zeta'}{\zeta}(\sigma+it)\right| \le \frac{(\log t)^{2-2\sigma}-\sigma 2^{1-\sigma}}{1-\sigma} + 0.518\,(\log t)^{2-2\sigma} + 4\,(\log t)^{3-4\sigma} + 90 \qquad (0.6\le\sigma<1,\ t\ge e^{e^{13}})
hypotheses_required: [RH]
status: unlocked
status_note: >
  This is the Riemann zeta case of Corollary 3 of the paper. The corollary is
  stated for every function L in the Selberg class with a polynomial Euler
  product of order m equal to its degree d_L, assuming the Generalized
  Riemann Hypothesis for L, RH for zeta and the strong lambda-conjecture for
  L. With tau = q_L |t|^(d_L), for tau >= exp(exp(13)) and |t| large enough it
  gives |L'/L(s)| <= d_L ((log tau)^(2 - 2 sigma) - sigma 2^(1 - sigma)) / (1 - sigma)
  + (1.796 - 1.278 d_L) (log tau)^(2 - 2 sigma) + 4 (log tau)^(3 - 4 sigma) + 90 d_L,
  together with a companion bound for |log L(s)|. For zeta one has d_L = m = 1,
  q_L = 1 and tau = t, the strong lambda-conjecture holds, and the hypothesis
  is RH alone; the entry records only this case. For other L the result
  needs the Riemann Hypothesis for L and is not covered in general. The
  entry zeta-log-derivative-critical-strip-bound gives a bound with a sharper
  leading constant but an inexplicit error term.
sources:
