review:
  state: ai-classified
  checked_by: null
  checked_on: null
  confidence: medium
  open_questions:
    - >-
      The paper states Corollary 3 for general L; the substitution d_L = m = 1, q_L = 1, tau = t (so 1.796 - 1.278 = 0.518) was done by the drafter and should be checked. The side condition |t| >= m_L + 2000 is implied by t >= exp(exp(13)).
    - >-
      The paper also has a zeta-specific Corollary 2 (t >= 10^6, sigma >= 1/2 + 1/log log t) whose constants depend on auxiliary functions defined elsewhere in the paper; it was not recorded.
    - >-
      Corollary 4 of the paper (an upper bound for the residue of a Dedekind zeta function under GRH and the Dedekind conjecture) was not recorded because the entry dedekind-zeta-residue-explicit-bounds already has a bound with essentially the same leading constant and no extra conjecture.
