id: evasiveness-sparse-monotone-graph-properties
title: Sparse monotone graph properties are eventually evasive
field: complexity-theory
statement_plain: >
  For any eps > 0, every nontrivial monotone property of n-vertex graphs that
  fails for all graphs with more than n^(5/4 - eps) edges is evasive for all
  sufficiently large n. That is, its decision-tree complexity equals the
  number n(n-1)/2 of possible edges.
statement_formal: null
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The paper defines ERH as the Riemann Hypothesis for Dirichlet L-functions.
  It is used for a prime number theorem in arithmetic progressions with
  square-root error, which gives a prime r = a mod pq with n/4 <= r <= n/2
  for a modulus pq of size about n^(1/2 - eps). Under Chowla's conjecture on
  the least prime in a progression the edge bound improves to n^(3/2 - eps),
  and unconditionally the paper gets c n log n.
sources:
