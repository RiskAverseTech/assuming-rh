id: ternary-goldbach-one-prime-below-log-fourth-power
title: Ternary Goldbach with one prime at most (log N)^(4+eps)
field: additive-number-theory
statement_plain: >
  Fix eps > 0. For large odd N, let R(N, y, U) be the number of
  representations N = p1 + p2 + p3 with primes N - 2y < p1 <= N - y,
  y < p2 <= 2y and p3 <= U. If sqrt(N) (log N)^(2+eps) <= y <= N/2 and
  (log N)^(4+eps) <= U <= y / (log N)^eps, then R(N, y, U) has exact order
  S(N) U y / (log U log y log N), where S(N) is the ternary Goldbach
  singular series. In particular every sufficiently large odd integer is a
  sum of three primes, one of which is at most (log N)^(4+eps).
statement_formal: |
  R(N,y,U) \asymp \frac{\mathfrak{S}(N)\,U\,y}{\log U\,\log y\,\log N}, \qquad \sqrt{N}\,(\log N)^{2+\varepsilon} \le y \le \tfrac{N}{2}, \quad (\log N)^{4+\varepsilon} \le U \le \frac{y}{(\log N)^{\varepsilon}}
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  The paper's GRH (Conjecture 2.5) is that no Dirichlet L-function modulo
  any q >= 1 has a zero with real part greater than 1/2; the modulus q = 1
  gives the Riemann zeta function. Here S(N) is the product over primes p
  not dividing N of 1 + 1/(p-1)^3 times the product over primes p dividing N
  of 1 - 1/(p-1)^2. Unconditionally the same paper obtains an asymptotic
  formula with U = N^(4/49) exp((log N)^(2/3+eps)), using a zero-density
  estimate.
