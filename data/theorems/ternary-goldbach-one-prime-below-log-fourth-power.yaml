  open_questions:
    - >-
      Corollary 2.7 is printed as 'Assume Condition 2.1' (the zero-density condition), but it sits in the section on results under GRH and the abstract attributes U = (log N)^(4+eps) to GRH; this looks like a misprint and the entry treats the corollary as conditional on GRH.
    - >-
      Theorem 2.6 prints the range of y as sqrt(N) log^(2+eps) without an argument for the logarithm; log N is assumed, as in Lemma 5.4.
    - >-
      The theorem does not say 'N sufficiently large'; this is assumed because the statement is an order-of-magnitude estimate.
