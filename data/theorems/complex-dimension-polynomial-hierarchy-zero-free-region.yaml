  confidence: medium
  open_questions:
    - >-
      The hypothesis actually needed (a zero-free region near the line Re(s) = 1 for all Dedekind zeta functions, or the still weaker Modular Root Hypothesis) is strictly weaker than any code in the taxonomy. ERH-Dedekind is the nearest code. A reviewer should decide whether this needs its own treatment, as for the entry three-sphere-recognition-in-conp.
    - >-
      Read as a consequence of the full Riemann hypothesis for Dedekind zeta functions, the conclusion is weaker than Koiran's. A reviewer may decide the entry is not worth keeping separately from nullstellensatz-polynomial-hierarchy.
    - >-
      The zero-free region was checked against the PDF (page 3). The hypothesis also has two further clauses not repeated in status_note: the region is restricted to |gamma| >= 1/(1 + 4 log Delta), and there are to be no real zeros in the interval (1 - (log(d log(3 Delta)))^(-C), 1).
