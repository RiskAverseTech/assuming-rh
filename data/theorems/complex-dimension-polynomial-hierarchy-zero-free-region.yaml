id: complex-dimension-polynomial-hierarchy-zero-free-region
title: Dimension of complex algebraic sets in the polynomial hierarchy from a zero-free region for Dedekind zeta functions
field: complexity-theory
statement_plain: >
  Deciding whether the complex zero set of a system of polynomials with
  integer coefficients has dimension at least D is in the class P^(NP^NP).
  In particular, deciding whether such a system has a complex root is in
  that class.
statement_formal: |
  \mathrm{DIM}_{\mathbb{C}} \in \mathsf{P}^{\mathsf{NP}^{\mathsf{NP}}}
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  The point of the paper is that less than the Riemann hypothesis is enough.
  It proves the statement from its Modular Root Hypothesis (a lower bound
  for the number of primes p up to x modulo which an irreducible integer
  polynomial has a root), which it derives from its Minimalist Dedekind Zero
  Hypothesis: for some constant C > 4, every Dedekind zeta function of a
  number field K of degree d and discriminant of absolute value Delta is
  zero-free in a region of the shape
  beta >= 1 - 1/((log(d log(3 Delta)))^C log(|gamma| + 2)). The Riemann
  hypothesis for all Dedekind zeta functions (the paper's GRH) implies both,
  which is how the entry is coded. Under that full hypothesis Koiran had
  already placed the problem in the smaller class AM (see the entry
  nullstellensatz-polynomial-hierarchy); this entry records the weaker
  hypothesis, not a stronger conclusion. The number fields involved are
  attached to arbitrary polynomial systems and are not abelian in general.
sources:
  - authors: J. M. Rojas, Y. Zhu
    title: Dedekind Zeta Zeroes and Faster Complex Dimension Computation
    year: 2018
    venue: Preprint
    url: https://arxiv.org/abs/1803.04104
    hypothesis_location: "Theorem 2, with the hypotheses MRH, GRH and MDZH stated in Section 1"
    role: conditional-proof
