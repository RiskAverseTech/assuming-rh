    - >-
      Lemma 5.1 does not repeat the words "assume GRH"; the dependence is through its citation of Theorem 3.1(3) of Bach and Sorenson, which was not consulted. The reading that only Dirichlet L-functions are needed rests on the paper's statement that the field K is abelian over Q.
    - >-
      The theorem speaks of "conjectural rank one"; the entry states rank one as the conclusion under the parity conjecture.
    - >-
      The title is given as printed in the version on disk (v3); the arXiv listing title is "Factoring integer using elliptic curves over rational number field Q".
