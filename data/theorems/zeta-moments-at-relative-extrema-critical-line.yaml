id: zeta-moments-at-relative-extrema-critical-line
title: Moments of zeta at its relative extrema between consecutive zeros
field: analytic-number-theory
statement_plain: >
  For each zero ordinate gamma in (0, T] let gamma+ be the next ordinate and
  take the maximum of |zeta(1/2 + i tau)|^(2k) over gamma <= tau <= gamma+.
  For every natural number k and every epsilon > 0, the average of these
  maxima over the N(T) zeros up to height T lies between constants times
  (log T)^(k^2 - epsilon) and (log T)^(k^2 + epsilon), for all sufficiently
  large T.
statement_formal: |
  (\log T)^{k^2-\varepsilon} \ll_{k,\varepsilon} \frac{1}{N(T)}\sum_{0<\gamma\le T}\ \max_{\gamma\le\tau_\gamma\le\gamma^{+}} \bigl|\zeta(\tfrac12+i\tau_\gamma)\bigr|^{2k} \ll_{k,\varepsilon} (\log T)^{k^2+\varepsilon}
hypotheses_required: [RH]
