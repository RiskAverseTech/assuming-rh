id: endomorphism-rings-ordinary-curves-subexponential
title: Computing endomorphism rings of ordinary elliptic curves in subexponential time
field: computational-number-theory
statement_plain: >
  The endomorphism ring of an ordinary elliptic curve over F_q can be
  computed by a probabilistic algorithm, with failure probability o(1), in
  time L(q)^(1+o(1)) + L(q)^(1/sqrt(2)+o(1)), where
  L(x) = exp(sqrt(log x log log x)) and the first term only accounts for
  factoring the discriminant of the Frobenius order.
statement_formal: |
  L(q)^{1+o(1)} + L(q)^{1/\sqrt2+o(1)}, \qquad L(x)=\exp\sqrt{\log x\,\log\log x}
hypotheses_required: [GRH-Hecke]
status: still-conditional
waiting_on: [class-group-characters]
status_note: >
  The hypothesis is used for the running time and failure probability of the
  search for relations in class groups of imaginary quadratic orders: Bach's
  bound for generators of the class group, and the theorem of Jao, Miller and
  Venkatesan on near-uniform distribution of short products of small primes
  in the class group (Theorem 6.1 of the paper). Both concern L-functions of
  class group characters. The paper says the output can be verified
  unconditionally by a certification method from earlier work.
