id: riesz-sums-mobius-oscillation-order-one-over-delta
title: Oscillations of Riesz sums of the Mobius function of small order delta
field: analytic-number-theory
statement_plain: >
  There is an absolute constant c > 0 such that for all sufficiently small
  delta > 0, the Riesz sum of the Mobius function,
  sum over n <= y of mu(n) (1 - n/y)^delta, divided by sqrt(y), has lim sup
  at least c/delta and lim inf at most -c/delta as y tends to infinity.
statement_formal: |
  \limsup_{y\to\infty}\frac{1}{\sqrt{y}}\sum_{n\le y}\mu(n)\left(1-\frac{n}{y}\right)^{\delta}\ \ge\ \frac{c}{\delta}, \qquad \liminf_{y\to\infty}\frac{1}{\sqrt{y}}\sum_{n\le y}\mu(n)\left(1-\frac{n}{y}\right)^{\delta}\ \le\ -\frac{c}{\delta}
hypotheses_required: [RH, PLUS-EXTRA]
status: still-conditional
waiting_on: [extra-assumption]
status_note: >
  Besides RH the theorem assumes three things that no Riemann Hypothesis
  gives: that all nontrivial zeros of zeta are simple; the Linear
  Independence conjecture (the positive ordinates of the zeros are linearly
  independent over the rationals); and the bound that the sum of
  1/|zeta'(rho)| over zeros with |Im rho| <= T is O(T^(1 + epsilon)) for
  every epsilon > 0 (the paper's equation (8.3), a weaker form of the
  Gonek-Hejhal conjecture). The paper remarks that (8.3) can be replaced by
  the convergence of certain series over the zeros. Theorems 8.6 and 8.7
  give the same statement for the Liouville function and for the error term
  of the Riesz sum of d(n)^2. The Voronoi summation formulas that form the
  main part of the paper do not assume RH.
sources:
