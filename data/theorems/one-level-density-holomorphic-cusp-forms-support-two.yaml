  open_questions:
    - >-
      The fixed weight k in the level family can be 2, which would also fit the family modular-form-l-functions; higher-automorphic is listed because general weight and symmetric squares are involved.
    - >-
      The formal statement shows only the level-aspect case; the weight-aspect and symmetric square cases are in the plain statement.
