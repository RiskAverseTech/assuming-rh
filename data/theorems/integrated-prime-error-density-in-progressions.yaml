id: integrated-prime-error-density-in-progressions
title: Positive logarithmic density for both signs of an integrated prime-counting error
field: analytic-number-theory
statement_plain: >-
  Let m be q or 2q for a prime q between 11 and 10,009 inclusive. In any reduced residue class a modulo m, integrate φ(m)π(t;m,a) − li(t) from 2 to x and multiply by (log x)/x^(3/2). The set of x where the result exceeds 1/4 and the set where it is below −3/2 each have positive lower logarithmic density.
statement_formal: |
  E_{m,a}(x)=\frac{\log x}{x^{3/2}}\int_2^x\bigl(\varphi(m)\pi(t;m,a)-\operatorname{li}(t)\bigr)\,dt,\quad
  \underline{\delta}_{\log}\{x:E_{m,a}(x)>1/4\}>0,\quad
  \underline{\delta}_{\log}\{x:E_{m,a}(x)<-3/2\}>0.
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >-
  The density conclusion uses GRH for the primitive Dirichlet L-functions that occur modulo m, including the Riemann zeta function. Crossley proves that both thresholds are crossed arbitrarily far out unconditionally for the same moduli. Johnston’s Problem 23 asks when the integral in one residue class stays negative.
