id: moments-cubic-quartic-dirichlet-l-functions-order-of-magnitude
title: Order of magnitude of moments of cubic and quartic Dirichlet L-functions
field: analytic-number-theory
statement_plain: >
  For every real k >= 0, the sum of |L(1/2, chi)|^(2k) over primitive cubic
  Dirichlet characters chi of conductor q <= X coprime to 3 has order of
  magnitude X (log X)^(k^2). The same holds for primitive quartic Dirichlet
  characters (with primitive square) of odd conductor q <= X.
statement_formal: |
  \sum_{\substack{q \le X \\ (q,3)=1}} \; \sum\nolimits^{*}_{\substack{\chi \bmod q \\ \chi^3 = \chi_0}} \left| L(\tfrac12, \chi) \right|^{2k} \asymp_k X (\log X)^{k^2}
hypotheses_required: [RH, GRH-Dirichlet]
status: unlocked
status_note: >
  The characters here are Dirichlet characters of order 3 and 4 over the
  rationals. The conditional steps (Lemma 2.9, Propositions 5.2 and 5.3)
  assume RH for zeta and GRH for L(s, chi) with chi a primitive cubic or
  quartic Dirichlet character. Hecke L-functions over Q(omega) and Q(i)
  appear in the proof only through an unconditional convexity bound. The
  paper proves the lower bound for k >= 1/2 unconditionally in the cubic
  case, and under the Lindelof hypothesis for quartic Dirichlet
  L-functions in the quartic case.
sources:
  - authors: P. Gao, L. Zhao
    title: Bounds for moments of cubic and quartic Dirichlet $L$-functions
