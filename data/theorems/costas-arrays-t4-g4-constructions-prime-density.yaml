  open_questions:
    - >-
      The T4 asymptotic (Theorem 1) is due to Lenstra (1977), following a conjecture of Shanks; this paper restates it in the language of Costas arrays. Only Theorem 2 (G4) is new, and its proof is a brief indication ("we find that the asymptotic density should be") rather than a full argument.
    - >-
      The hypothesis code is inferred from the cited method of Lenstra (Hooley-type argument over Kummer fields); the paper itself never says which zeta functions are meant.
