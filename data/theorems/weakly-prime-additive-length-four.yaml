id: weakly-prime-additive-length-four
title: Weakly prime-additive numbers of length 4 divisible by any given integer
field: additive-number-theory
statement_plain: >
  A positive integer n is weakly prime-additive if it has at least two
  distinct prime divisors and is a sum of positive powers of distinct prime
  divisors of n; its length is the least number of terms in such a sum. For
  every positive integer m there are infinitely many weakly prime-additive
  numbers of length 4 that are divisible by m.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [kummer-fields]
status_note: >
  The theorem is stated under an assumption (*): in certain arithmetic
  progressions a mod f there is a prime having a prescribed odd prime g as a
  primitive root. The paper derives (*) from "GRH" through a theorem of Moree
  on primes in arithmetic progressions with a prescribed primitive root, and
  notes that (*) is much weaker than GRH. The paper does not say which
  L-functions are meant; results of this Artin primitive root type are
  recorded here as needing Dedekind zeta functions of Kummer-type fields.
