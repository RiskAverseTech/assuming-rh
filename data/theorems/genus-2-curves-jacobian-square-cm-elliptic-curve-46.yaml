id: genus-2-curves-jacobian-square-cm-elliptic-curve-46
title: Exactly 46 genus-2 curves with field of moduli Q have Jacobian the square of a CM elliptic curve
field: arithmetic-geometry
statement_plain: >
  There are exactly 46 genus-2 curves (up to isomorphism over the algebraic
  numbers) with field of moduli Q whose Jacobian is isomorphic to the square
  of an elliptic curve with complex multiplication by a maximal order.
  Exactly 13 of them can be defined over Q.
statement_formal: null
hypotheses_required: [GRH-Dirichlet, RH]
status: unlocked
status_note: >
  The paper finds the 46 curves, and equations for the 13 defined over Q,
  without any hypothesis. The Generalized Riemann Hypothesis is used only for
  completeness of the list: the class group of the CM order must have
  exponent at most 2, and the paper quotes Louboutin (1990) for the fact that
  under the hypothesis such imaginary quadratic fields have discriminant at
  most 2 * 10^7 in absolute value, which leaves 65 fundamental discriminants.
  This concerns imaginary quadratic fields only, so the L-functions are the
  Riemann zeta function and quadratic Dirichlet L-functions. See the existing
  entry idoneal-numbers-complete for Weinberger's result on the same class
  group problem under a weaker hypothesis.
sources:
