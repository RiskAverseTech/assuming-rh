review:
  state: ai-classified
  checked_by: null
  checked_on: null
  confidence: medium
  open_questions:
    - >-
      The Chebotarev step is applied to a degree 4 Galois extension E' of the quadratic field K, built as a tower of quadratic extensions. If E' is multiquadratic over Q (hence abelian), GRH for Dirichlet L-functions would suffice and the status would be unlocked. The paper does not describe E' explicitly, so the cautious code ERH-Dedekind was chosen.
    - >-
      The list of degrees for Q(sqrt(213)) was read from Table 1.2 of the paper; the other 18 fields are in Table 8.1 and are not reproduced here.
