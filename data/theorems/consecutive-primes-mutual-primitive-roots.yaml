id: consecutive-primes-mutual-primitive-roots
title: Bounded runs of consecutive primes that are primitive roots of each other
field: analytic-number-theory
statement_plain: >
  For every positive integer m there is a constant C_m such that for
  infinitely many n the consecutive primes p_n, ..., p_(n+m) lie in an
  interval of length at most C_m and each of them is a primitive root modulo
  each of the others.
statement_formal: null
hypotheses_required: [ERH-Dedekind]
status: still-conditional
status_note: >
  The paper writes only "GRH". Its proof uses, through a result of Pollack,
  an effective Chebotarev density theorem to count primes p with
  g^((p-1)/q) = 1 mod p, which concerns Kummer-type fields that are not
  abelian over the rationals. The entry therefore records the hypothesis as
  one on Dedekind zeta functions; the paper itself does not spell this out.
sources:
