id: supersingular-isogeny-path-endomorphism-ring-equivalence
title: The supersingular l-isogeny path problem is equivalent to the endomorphism ring problem
field: complexity-theory
statement_plain: >
  For supersingular elliptic curves over F_{p^2}, the problem of finding a
  path between two given curves in the l-isogeny graph (l-IsogenyPath), the
  problem of computing four endomorphisms generating the endomorphism ring
  (EndRing), and the problem of finding a maximal order of the quaternion
  algebra isomorphic to the endomorphism ring (MaxOrder) are equivalent under
  reductions of polynomial expected time. As a tool, the quaternion analog of
  the path problem (finding a connecting ideal of prescribed norm between two
  maximal orders) is solved in polynomial expected time.
statement_formal: null
hypotheses_required: [GRH-Hecke, GRH-Dirichlet]
status: still-conditional
waiting_on: [class-group-characters]
status_note: >
  The paper writes "the generalised Riemann hypothesis" without defining it.
  It is used through the conditional effective Chebotarev theorem of Lagarias
  and Odlyzko to count primes represented by a positive definite binary
  quadratic form of discriminant D (Theorem 3.1), which concerns ring class
  fields of imaginary quadratic orders and so class group characters, and
  through a conditional bound on primes in arithmetic progressions on average
  adapted from the literature (Theorem 4.4). The hypothesis is used for the
  correctness and expected running time of the rigorous replacement for the
  heuristic algorithm of Kohel, Lauter, Petit and Tignol. The entry
  supersingular-endring-maxorder-equivalence records that the EndRing and
  MaxOrder part was later proved without the hypothesis, and says that the
  link with the l-isogeny path problem is still known only conditionally;
  that link is what this entry records.
