    - >-
      Overlaps with the existing entry supersingular-endring-maxorder-equivalence, which lists this paper as the historical conditional proof of the EndRing and MaxOrder equivalence. Kept as a separate entry because the l-isogeny path equivalence is a different statement that the existing entry describes as still conditional; a reviewer may prefer to merge them.
    - >-
      The paper does not say which L-functions its hypothesis covers. The codes are read from the cited tools: Chebotarev for ring class fields (Hecke L-functions of class group characters) and primes in arithmetic progressions (Dirichlet L-functions).
