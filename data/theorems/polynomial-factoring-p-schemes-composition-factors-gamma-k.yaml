    - >-
      The thesis states GRH for Dirichlet L-functions only, which read
      literally would make this entry unlocked. The code GRH-Hecke is kept
      because Hypothesis (*) asks for power non-residues in extension fields
      F_(p^d), and the cited proofs (Huang; Lagarias, Montgomery, Odlyzko)
      use L-functions of number fields. A number theorist should decide
      whether Dirichlet L-functions suffice for Hypothesis (*).
