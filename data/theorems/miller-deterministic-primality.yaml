id: miller-deterministic-primality
title: Deterministic Miller primality test
field: computational-number-theory
statement_plain: >
  An odd integer n > 1 is prime if and only if it passes the Miller
  strong-pseudoprime test for every base a up to 2 (ln n)^2. This gives a
  deterministic primality test that runs in polynomial time.
statement_formal: |
  n \text{ odd and composite} \;\Longrightarrow\; \text{some } a \le 2(\ln n)^2 \text{ is a Miller witness for } n
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: >
  Miller proved a bound of the form c (ln n)^2. Bach made the constant 2
  explicit. Primality testing in polynomial time is known unconditionally by
  a different algorithm (see the AKS entry), so what is unlocked here is the
  correctness of this specific, much faster test.
  The implication is formalized in Lean 4 in the repository cited below:
  assuming that every zero of every Dirichlet L-function in the critical
  strip lies on the critical line, an odd n above 1 is prime if and only if
  no base below both n and 2 (ln n)^2 is a Miller witness. This project
  built that repository from source on 25 November 2026 and confirmed that
  the theorem depends only on Lean's three standard axioms. The statement
  that the test runs in polynomial time is not part of the formal theorem.
  What is checked is the implication from the hypothesis to this result. It
  is not a check of the announced proof, and the build was run by an AI
  system, not reviewed by a person.
