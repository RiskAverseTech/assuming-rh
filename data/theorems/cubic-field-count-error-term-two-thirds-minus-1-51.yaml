  confidence: medium
  open_questions:
    - >-
      The paper cites a 2026 preprint claiming a zero-free half plane Re(s) > 1 - 1/32 for every Dedekind zeta function, from which its Theorem 1.10 would give exponent 2/3 - 1/591 without GRH. This does not reach the exponent recorded here, and the cited claim was not checked.
    - >-
      Same hypothesis also gives the one-level density of the family zeta_K(s)/zeta(s) for test functions with Fourier support in (-1, 1) (Theorem 1.12); not recorded as a separate entry.
