id: lindelof-hypothesis
title: Lindelöf hypothesis for the Riemann zeta function
field: analytic-number-theory
statement_plain: >
  On the critical line the Riemann zeta function grows more slowly than any
  positive power of the height: zeta(1/2 + it) is O(t^epsilon) for every
  positive epsilon.
statement_formal: |
  \zeta\!\left(\tfrac12 + it\right) = O_\varepsilon\!\left(|t|^{\varepsilon}\right) \quad \text{for every } \varepsilon > 0
hypotheses_required: [RH]
status: unlocked
status_note: >
  RH implies the Lindelöf hypothesis. The converse is not known. This entry
  covers the zeta function only, not Lindelöf-type bounds for other
  L-functions.
  The implication from RH is formalized in Lean 4 in the repository cited
  below, stated with Mathlib's own definition of the Riemann Hypothesis:
  zeta(1/2 + it) is O(|t|^epsilon) for every positive epsilon, as t tends to
  plus or minus infinity. This project built that repository from source on
  25 November 2026 and confirmed that the theorems depend only on Lean's
  three standard axioms.
  What is checked is the implication from the hypothesis to this result. It
  is not a check of the announced proof, and the build was run by an AI
  system, not reviewed by a person.
sources:
