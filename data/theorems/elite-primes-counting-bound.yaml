id: elite-primes-counting-bound
title: Upper bound for the number of elite primes
field: analytic-number-theory
statement_plain: >
  A prime p is elite if all sufficiently large Fermat numbers
  F_n = 2^(2^n) + 1 are quadratic nonresidues modulo p. The number E(x) of
  elite primes up to x is O(x^(3/4) (log x)^(1/2)).
statement_formal: |
  E(x) = O\bigl(x^{3/4} (\log x)^{1/2}\bigr)
hypotheses_required: [GRH-Dirichlet]
status: unlocked
status_note: null
