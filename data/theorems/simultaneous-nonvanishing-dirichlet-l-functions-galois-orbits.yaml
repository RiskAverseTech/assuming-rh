  open_questions:
    - >-
      The paper writes "GRH" without a formal definition. That only Dirichlet L-functions are involved is read from the places where it is invoked (Remark 1.7, Section 5 and Section 7); the cited moment bound ([42, Theorem 1]) was not consulted, and it may also use RH for the Riemann zeta function.
