id: explicit-pnt-short-intervals
title: Explicit prime number theorem in short intervals
field: analytic-number-theory
statement_plain: >
  For all x at least e^10 and every h with sqrt(x) log x <= h <= x^(3/4),
  |psi(x + h) - psi(x) - h| < (1/pi) sqrt(x) log x log( h / (sqrt(x) log x) )
  + 2 sqrt(x) log x, where psi is the Chebyshev function.
statement_formal: |
  \left|\psi(x+h) - \psi(x) - h\right| < \frac{1}{\pi}\sqrt{x}\,\log x\,\log\!\left(\frac{h}{\sqrt{x}\,\log x}\right) + 2\sqrt{x}\,\log x \qquad \left(x \ge e^{10},\ \sqrt{x}\log x \le h \le x^{3/4}\right)
hypotheses_required: [RH]
