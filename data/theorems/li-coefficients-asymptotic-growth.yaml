id: li-coefficients-asymptotic-growth
title: Asymptotic growth of the Li coefficients
field: analytic-number-theory
statement_plain: >
  Let lambda_n be the sum over the nontrivial zeros rho of the Riemann zeta
  function (grouped in pairs rho, 1 - rho) of 1 - (1 - 1/rho)^n. Then as n
  tends to infinity, lambda_n = (1/2) n (log n - 1 + gamma - log 2 pi) + o(n),
  where gamma is Euler's constant.
statement_formal: |
  \lambda_n = \tfrac12\, n\left(\log n - 1 + \gamma - \log 2\pi\right) + o(n) \quad (n \to \infty), \qquad \lambda_n = \sum_{\rho}\left[1 - \left(1 - \tfrac{1}{\rho}\right)^{n}\right]
hypotheses_required: [RH]
status: unlocked
status_note: >
  This statement is equivalent to RH. The paper's theorem is a dichotomy: the
  displayed tempered growth holds if and only if RH is true, and otherwise
  lambda_n oscillates with exponentially growing amplitude. The paper notes
  that the formula under RH had been displayed by Keiper and proved in an
  unpublished argument of Oesterlé, and that the converse is also implied by
  results of Bombieri and Lagarias. The paper indicates analogous asymptotics
  for more general zeta and L-functions; this entry records only the Riemann
  zeta case.
