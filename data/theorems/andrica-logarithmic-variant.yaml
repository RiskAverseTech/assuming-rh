id: andrica-logarithmic-variant
title: Logarithmic variant of Andrica's conjecture
field: analytic-number-theory
statement_plain: >
  For every n at least 1, with p_n the n-th prime,
  sqrt(p_(n+1)) / ln p_(n+1) - sqrt(p_n) / ln p_n <= 11/25.
statement_formal: |
  \frac{\sqrt{p_{n+1}}}{\ln p_{n+1}} - \frac{\sqrt{p_n}}{\ln p_n} \le \frac{11}{25} \qquad (n \ge 1)
hypotheses_required: [RH]
status: unlocked
status_note: >
  The proof rests on the explicit prime gap bound of Carneiro, Milinovich and
  Soundararajan under RH, p_(n+1) - p_n < (22/25) sqrt(p_n) ln p_n. The same
  paper also proves, under RH, that the difference of m-th roots of
  consecutive primes is at most 44 / (25 e (m - 2)) for n >= 3 and m > 2
  (Theorem 3).
sources:
