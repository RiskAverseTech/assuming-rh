  open_questions:
    - >-
      The paper does not define its GRH, and Lemma 2.1 is cited from
      reference [2] without proof; that the cited lemma needs only quadratic
      Dirichlet L-functions (and possibly the Riemann zeta function) was not
      checked in the cited source.
    - >-
      The lower limit of the range in Theorem 1.1 was read from the PDF page image as
      exp(4 sqrt(log X log_2 X) log_3 X), with log_3 X outside the square root; the
      text layer is ambiguous on this point.
