id: cramer-prime-gap-bound
title: Cramér's bound on gaps between consecutive primes
field: analytic-number-theory
statement_plain: >
  The gap between a prime p and the next prime is at most a constant times
  sqrt(p) log p.
statement_formal: |
  p_{n+1} - p_n = O\!\left(\sqrt{p_n}\,\log p_n\right)
hypotheses_required: [RH]
status: unlocked
status_note: >
  Explicit versions of this bound are recorded in the entry on primes in
  short intervals.
  The implication from RH is formalized in Lean 4 in the repository cited
  below, as the theorem Cramer.cramer_of_RH, whose statement is the bound in
  this entry and whose hypothesis is Mathlib's RiemannHypothesis. It was
  built from source for this project on 25 November 2026 and depends only on
  Lean's three standard axioms. The formalization was written by AI agents
  and is three days old. What is checked is the implication from the
  hypothesis to this result. It is not a check of the announced proof, and
  the build was run by an AI system, not reviewed by a person.
sources:
