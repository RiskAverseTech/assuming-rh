id: one-level-density-sextic-hecke-l-functions-support-45-43
title: One level density of sextic Hecke L-functions over Q(omega) with support up to 45/43, and non-vanishing for at least 2/45 of the family
field: analytic-number-theory
statement_plain: >
  Let omega = exp(2 pi i / 3) and consider the family of Hecke L-functions
  L(s, chi^(72c)) over Q(omega) attached to sextic symbols, where c runs over
  square-free elements of Z[omega] coprime to 6 with norm between X and 2X.
  For even Schwartz test functions whose Fourier transform is supported in
  (-45/43, 45/43), the smoothed one level density of the low-lying zeros of
  the family tends to the integral of the test function as X tends to
  infinity, as predicted for a unitary family. As a consequence, at least a
  proportion 2/45 + o(1) of the L-functions in the family do not vanish at
  s = 1/2.
statement_formal: |
  \#\{c \in C(X) : L(\tfrac12, \chi^{(72c)}) \ne 0\} \ \ge\ \left(\frac{2}{45} + o(1)\right) \#C(X), \qquad C(X) = \{c \in \mathbb{Z}[\omega] : (c,6)=1,\ c \text{ square-free},\ X \le N(c) \le 2X\}
hypotheses_required: [GRH-Hecke]
status: still-conditional
waiting_on: [power-residue-characters]
status_note: >
  The hypothesis is the Riemann Hypothesis for the Hecke L-functions
  L(s, chi^(72c)) of the sextic family over Q(omega) themselves. These are
  L-functions of sextic residue symbol characters over Q(omega), not
  Dirichlet L-functions. The first moment result of the same paper
  (Theorem 1.1) is unconditional. The analogous result for a cubic family
  over the same field, with support 13/11 and proportion 2/13, is the entry
  one-level-density-cubic-l-functions-eisenstein-field-support-13-11.
