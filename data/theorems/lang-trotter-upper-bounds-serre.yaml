id: lang-trotter-upper-bounds-serre
title: Serre's upper bounds for the number of primes with a given Frobenius trace
field: arithmetic-geometry
statement_plain: >
  Let E be an elliptic curve over the rationals without complex
  multiplication, and for an integer h let P_{E,h}(x) be the number of
  primes p up to x of good reduction with a_p(E) = h. Then
  P_{E,h}(x) = O(x^(5/6) / (log x)^(1/3)) when h is not 2 or -2, and
  P_{E,0}(x) = O(x^(3/4)), the case h = 0 counting supersingular primes.
statement_formal: |
  P_{E,h}(x) = O\!\left(\frac{x^{5/6}}{(\log x)^{1/3}}\right)\ (h \ne \pm 2), \qquad P_{E,0}(x) = O\!\left(x^{3/4}\right)
hypotheses_required: [ERH-Dedekind]
status: still-conditional
waiting_on: [galois-extensions]
status_note: >
  Serre defines (GRH) as the statement that the zeta function of a number
  field has no zero of real part above 1/2. It is used through the
  effective Chebotarev theorem of Lagarias and Odlyzko, applied to finite
  quotients of the l-adic Galois group of E. These fields are generated by
  torsion points of E and are not abelian over the rationals. Serre remarks
  that only the zeta functions of the fields actually used are needed. For
  h = 2 or -2 the same theorem gives the weaker bound
  O(Li(x) / (x^(1/2) (log x)^(-2))^(1/4)). The paper also proves weaker
  unconditional bounds of the form O(x / (log x)^c).
sources:
  - authors: J.-P. Serre
    title: Quelques applications du théorème de densité de Chebotarev
    year: 1981
