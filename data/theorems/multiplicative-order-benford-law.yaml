id: multiplicative-order-benford-law
title: Benford's law for the multiplicative order of a modulo n
field: analytic-number-theory
statement_plain: >
  Fix an integer a with |a| > 1 and let l_a(n) be the multiplicative order of
  a modulo n. For each fixed nonzero real theta, the sum of l_a(n)^(i theta)
  over n <= x coprime to a is o(x) as x tends to infinity. Consequently the
  orders l_a(n) obey Benford's leading digit law, with densities taken
  relative to the n coprime to a.
statement_formal: |
  \sum_{\substack{n\le x\\ \gcd(n,a)=1}}\ell_a(n)^{i\theta}=o(x)\qquad(x\to\infty)
hypotheses_required: [ERH-Dedekind]
status: still-conditional
status_note: >
  The paper says that by GRH it means the Riemann Hypothesis for Dedekind
  zeta functions. The hypothesis enters through a lemma of Li and Pomerance
  on primes p for which a is an r-th power residue, a Hooley-type argument
  over Kummer fields, which are not abelian over the rationals. The analogous
  result for Carmichael's lambda function (Theorem 1.3) is unconditional.
sources:
