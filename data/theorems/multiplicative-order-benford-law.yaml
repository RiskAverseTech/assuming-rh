  open_questions:
    - "The paper states its hypothesis as the Riemann Hypothesis for Dedekind zeta functions without naming the fields. The GRH input is Lemma 6.7, quoted from Li and Pomerance, about primes p = 1 mod r with a^((p-1)/r) = 1 mod p, which is a Kummer field condition; the exact fields were not checked in that reference."
